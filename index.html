      const num = id => parseInt(document.getElementById(id).value, 10);
      S.names = names;
      S.turns = Math.max(1, num('b-turns') || 15);
      S.start = Number.isFinite(num('b-start')) ? num('b-start') : 100;
      S.qText = document.getElementById('b-qtext').value;
      S.questions = parseQLines(S.qText, false);
      S.teams = names.map(name => ({ name, score:S.start }));
      S.turn = 0; S.qi = 0; S.deck = []; S.log = []; S.lines = []; undo = [];
      S.phase = 'ask'; render();
    },
    eat(){ snap(); nextQ(); S.phase = 'question'; SFX.click(); render(); },
    skip(){
      snap(); S.lines = [];
      add(cur(), -10, 'Không ăn bánh');
      S.phase = 'result'; SFX.bonk(); render();
    },
    answer(right){
      snap(); S.lines = [];
      const t = cur();
      if (!right){ add(t, -10, 'Ăn bánh nhưng trả lời sai'); S.phase = 'result'; SFX.bonk(); render(); return; }
      const id = draw(); S.slip = id; S.give = null; S.target = null;
      if (id === 1) add(t, 10, 'Phiếu Lộc trời cho');
      if (id === 2) add(t, -20, 'Phiếu Xui tận mạng');
      if (id === 4) add(t, 30, 'Phiếu Tỷ phú tài trợ');
      if (id === 9) add(t, -5, 'Phiếu Đánh rơi ví');
      if (id === 10){
        S.teams.forEach((_, i) => { if (i !== t) add(i, -1, `Bị ${S.teams[t].name} nhặt mất`); });
        add(t, n() - 1, 'Phiếu Nhặt được của rơi');
      }
      S.phase = 'slip'; SFX.flip(); moodSound(SLIPS[id].mood); render();
    },
    give(j){
      snap(); const t = cur();
      add(t, -10, `Hiến tặng ${S.teams[j].name}`);
      add(j, 10, `Được ${S.teams[t].name} hiến tặng`);
      S.phase = 'result'; SFX.coin(); render();
    },
    bonus(){ snap(); nextQ(); S.phase = 'bonusQ'; render(); },
    bonusAns(r){
      snap(); add(cur(), r ? 10 : -5, r ? 'Câu hỏi phụ đúng' : 'Câu hỏi phụ sai');
      S.phase = 'result'; r ? SFX.coin() : SFX.bonk(); render();
    },
    nominate(j){ snap(); S.target = j; nextQ(); S.phase = 'nomQ'; SFX.click(); render(); },
    nomAns(r){
      snap(); const t = cur(), j = S.target;
      if (r){ add(t, 20, `${S.teams[j].name} trả lời đúng câu chỉ định`); add(j, 10, 'Trả lời đúng câu được chỉ định'); SFX.coin(); }
      else { add(t, -10, `${S.teams[j].name} trả lời sai câu chỉ định`); SFX.bonk(); }
      S.phase = 'result'; render();
    },
    pickHeir(j){ S.give = S.give === j ? null : j; SFX.click(); render(); },
    poison(bury){
      const t = cur(), had = Math.max(0, S.teams[t].score);
      let amt = 0;
      if (!bury){
        if (S.give === null) { document.getElementById('b-perr').textContent = 'Chọn đội nhận thừa kế trước nha.'; return; }
        amt = parseInt(document.getElementById('b-amt').value, 10);
        if (!Number.isFinite(amt) || amt < 0 || amt > had) { document.getElementById('b-perr').textContent = `Số tiền phải từ 0 đến ${had} tỷ.`; return; }
      }
      snap();
      const was = S.teams[t].score;
      add(t, -was, 'Ngộ độc bánh, tài sản tiêu tan');
      if (!bury && amt > 0) add(S.give, amt, `Nhận thừa kế từ ${S.teams[t].name}`);
      if (bury) S.lines.push({ team:t, delta:0, why:'Mang tài sản xuống mồ 🪦' });
      S.phase = 'result'; SFX.sad(); render();
    },
    showAns(){ S.showAns = true; render(); },
    next(){
      S.turn++; S.lines = []; S.slip = null;
      S.phase = S.turn >= S.turns ? 'end' : 'ask';
      if (S.phase === 'end') SFX.fanfare();
      render();
    },
    undo(){ if (!undo.length) return; S = JSON.parse(undo.pop()); render(); },
    log(){ showLog = !showLog; render(); },
    edit(){ editing = !editing; render(); },
    adj(i, d){
      d = Math.round(Number(d)) || 0; if (!d) return;
      snap(); S.teams[i].score += d;
      S.log.push({ turn:S.turn + 1, team:i, delta:d, why:'Chỉnh tay' });
      render();
    },
    setv(i, v){ const n = Math.round(Number(v)); if (Number.isFinite(n)) act.adj(i, n - S.teams[i].score); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      const keep = { names:S.names, turns:S.turns, start:S.start, qText:S.qText };
      S = Object.assign(fresh(), keep); undo = []; render();
    }
  };

  /* ---------- views ---------- */
  const cake = lavCake(false, 'lavcake hero');

  const lineList = () => S.lines.length
    ? `<div class="verdict">${S.lines.map(l => `<p>${nm(l.team)}: <b class="${l.delta > 0 ? 'pos' : l.delta < 0 ? 'neg' : ''}">${ty(l.delta)}</b> · ${esc(l.why)}</p>`).join('')}</div>` : '';
  const nextBtn = () => `<button class="btn btn-gold" onclick="B.next()">${S.turn + 1 >= S.turns ? 'Xem kết quả chung cuộc' : 'Lượt tiếp →'}</button>`;
  const qCard = (title) => {
    const q = S.curQ;
    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'B')}</div>`
      : `<div class="qcard"><div class="kicker">${title}</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };
  const teamPicks = (fn, sel, exclude) => `<div class="grid-pick">${S.teams.map((x, i) =>
    `<button class="chip ${sel === i ? 'sel' : ''}" ${i === exclude ? 'disabled' : ''} onclick="B.${fn}(${i})">${esc(x.name)} <small class="chip-sub">${x.score} tỷ</small></button>`).join('')}</div>`;
  const slipCard = id => `<div class="slip ${SLIPS[id].mood}"><span class="slip-no">Phiếu ${id}</span><span class="slip-t">${SLIPS[id].t}</span><span class="slip-d">${SLIPS[id].d}</span></div>`;

  function vSetup(){
    const names = [...S.names];
    return `<div class="stage">
      ${cake}
      <div class="kicker">Trò chơi thuyết trình · 100 tỷ mỗi đội</div>
      <h1>Ăn hay không ăn?</h1>
      <div class="setup">
        <div class="panel">
          <h3>Các đội</h3>
          ${names.map((v, i) => `<label for="b-nm${i}">Đội ${i + 1}${i >= 5 ? ' (không bắt buộc)' : ''}<input id="b-nm${i}" data-bname value="${esc(v)}" placeholder="Bỏ trống nếu không dùng"></label>`).join('')}
          <div class="two">
            <label for="b-turns">Tổng số lượt<input id="b-turns" type="number" min="1" value="${S.turns}"></label>
            <label for="b-start">Vốn ban đầu (tỷ)<input id="b-start" type="number" value="${S.start}"></label>
          </div>
          <p class="note">Mỗi lượt gọi một đội, xoay vòng. 15 lượt nghĩa là mỗi đội 3 lượt với 5 đội.</p>
        </div>
        <div class="panel">
          <h3>Câu hỏi</h3>
          <label for="b-qtext">Mỗi dòng: câu hỏi | đáp án. Dòng bắt đầu bằng &gt;&gt; là đoạn văn đi kèm các câu bên dưới. Để trống nếu chiếu câu hỏi bằng slide Canva.
            <textarea id="b-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>
        </div>
        <div class="panel span2">
          <h3>Luật chơi</h3>
          <ul class="rules">
            <li><b>Không ăn bánh:</b> chắc chắn −10 tỷ.</li>
            <li><b>Ăn bánh, trả lời sai:</b> −10 tỷ.</li>
            <li><b>Ăn bánh, trả lời đúng:</b> máy bốc 1 trong 10 phiếu (mỗi phiếu 2 bản, hết thì xáo lại).</li>
          </ul>
          <div class="slip-grid">${Object.keys(SLIPS).map(k => `<div class="mini"><b>${k}. ${SLIPS[k].t}</b><span>${SLIPS[k].d}</span></div>`).join('')}</div>
        </div>
      </div>
      <p class="note" id="b-err" role="alert"></p>
      <button class="btn btn-eat" onclick="B.start()">Dọn bánh ra!</button>
    </div>`;
  }
  function vAsk(){
    const t = cur();
    return `<div class="stage">
      <div class="kicker">Lượt ${S.turn + 1}/${S.turns}</div>
      <h1 class="ask-title"><span class="team-name">${nm(t)}</span> ăn hay không ăn?</h1>
      <div class="cake-pick">
        <button class="cake-btn" onclick="B.eat()">${lavCake(false)}<span class="cake-word">ĂN</span><small>Trả lời câu hỏi</small></button>
        <span class="cake-divider" aria-hidden="true"></span>
        <button class="cake-btn" onclick="B.skip()">${lavCake(true)}<span class="cake-word">KHÔNG ĂN</span><small>Chắc chắn −10 tỷ</small></button>
      </div>
    </div>`;
  }
  function vQuestion(){
    return `<div class="stage">${qCard(`Câu hỏi cho ${nm(cur())}`)}
      <div class="row"><button class="btn btn-ok" onclick="B.answer(true)">Đúng<small>Bốc phiếu</small></button>
      <button class="btn btn-no" onclick="B.answer(false)">Sai<small>−10 tỷ</small></button></div></div>`;
  }
  function vSlip(){
    const t = cur(), id = S.slip;
    let body = '';
    if (AUTO.includes(id)) body = `${lineList()}${nextBtn()}`;
    if (id === 3) body = `<p class="lead">${nm(t)} hiến 10 tỷ cho đội nào?</p>${teamPicks('give', null, t)}`;
    if (id === 6) body = `<button class="btn btn-gold" onclick="B.bonus()">Trả lời câu hỏi phụ</button>`;
    if (id === 7) body = `<p class="lead">${nm(t)} chỉ định đội nào trả lời câu tiếp theo?</p>${teamPicks('nominate', null, t)}`;
    if (id === 8){
      const had = Math.max(0, S.teams[t].score);
      body = `<p class="lead">${nm(t)} đang có ${S.teams[t].score} tỷ. Chọn một đội nhận thừa kế, hoặc ôm hết xuống mồ.</p>
        ${teamPicks('pickHeir', S.give, t)}
        <div class="row heir">
          <label for="b-amt">Số tiền chuyển (tỷ)<input id="b-amt" type="number" min="0" max="${had}" value="${had}"></label>
          <button class="btn btn-gold" onclick="B.poison(false)">Chuyển nhượng</button>
          <button class="btn btn-no" onclick="B.poison(true)">Mang xuống mồ 🪦</button>
        </div>
        <p class="note" id="b-perr" role="alert"></p>`;
    }
    return `<div class="stage"><div class="kicker">${nm(t)} trả lời đúng · bốc phiếu</div>${slipCard(id)}${body}</div>`;
  }
  function vBonusQ(){
    return `<div class="stage">${qCard(`Câu hỏi phụ cho ${nm(cur())}`)}
      <div class="row"><button class="btn btn-ok" onclick="B.bonusAns(true)">Đúng<small>+10 tỷ</small></button>
      <button class="btn btn-no" onclick="B.bonusAns(false)">Sai<small>−5 tỷ</small></button></div></div>`;
  }
  function vNomQ(){
    const t = cur(), j = S.target;
    return `<div class="stage">${qCard(`${nm(j)} trả lời thay (do ${nm(t)} chỉ định)`)}
      <div class="row"><button class="btn btn-ok" onclick="B.nomAns(true)">Đúng<small>${nm(t)} +20 · ${nm(j)} +10</small></button>
      <button class="btn btn-no" onclick="B.nomAns(false)">Sai<small>${nm(t)} −10</small></button></div></div>`;
  }
  function vResult(){
    return `<div class="stage">
      ${S.slip ? slipCard(S.slip) : `<div class="kicker">${nm(cur())}</div>`}
      ${lineList()}${nextBtn()}</div>`;
  }
  function vEnd(){
    const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
    const top = order[0], broke = order.filter(t => t.score <= 0), bottom = order[order.length - 1];
    return `<div class="stage">
      <div class="kicker">Chung cuộc</div>
      <h1>👑 <span class="team-name">${esc(top.name)}</span></h1>
      <div class="money pos">${top.score} tỷ</div>
      ${broke.length ? `<div class="verdict"><p><b>Phá sản:</b> ${broke.map(t => esc(t.name)).join(', ')}</p><p>Mời đồng thanh: <b class="neg">“CHÚNG TÔI BẤT TÀI!”</b> 📢</p></div>` : ''}
      <p class="lead">${esc(bottom.name)} về chót, xin nhận quà “gia vị cuộc sống” tỏi và ớt để thêm phần đắng cay 🧄🌶️</p>
      <div class="row">${plushBtn(bottom.name)}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Hạng</th><th>Đội</th><th class="num">Tài sản (tỷ)</th></tr></thead>
        <tbody>${order.map((t, k) => `<tr><td>${k + 1}</td><td><b>${esc(t.name)}</b></td><td class="num"><b class="${t.score <= 0 ? 'neg' : ''}">${t.score}</b></td></tr>`).join('')}</tbody>
      </table></div>
      <button class="btn btn-no" onclick="B.reset()">${S.armReset ? 'Bấm lần nữa để chơi ván mới' : 'Chơi ván mới'}</button>
    </div>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, ask:vAsk, question:vQuestion, slip:vSlip, bonusQ:vBonusQ, nomQ:vNomQ, result:vResult, end:vEnd };
    document.getElementById('b-stage').innerHTML = (V[S.phase] || vSetup)().replace(/^<div class="stage">/, '').replace(/<\/div>$/, '');
    const st = document.getElementById('b-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      ${S.phase !== 'end' ? `<span class="pill on">Lượt ${Math.min(S.turn + 1, S.turns)}/${S.turns}</span>` : ''}
      <button class="ghost" onclick="B.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      <button class="ghost" onclick="B.undo()" ${undo.length ? '' : 'disabled'}>↶ Hoàn tác</button>
      ${S.phase !== 'end' ? editBtn('B', editing) : ''}
      <button class="ghost" onclick="B.log()">Sổ thư ký</button>
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="B.reset()">${S.armReset ? 'Bấm lần nữa để xoá ván' : 'Ván mới'}</button>`;
    const rail = document.getElementById('b-rail');
    rail.hidden = S.phase === 'setup' || S.phase === 'end';
    if (!rail.hidden) rail.innerHTML = S.teams.map((t, i) => `<div class="slot ${i === cur() ? 'now' : ''}">
        <span class="nm">${esc(t.name)}</span>
        ${editing ? adjBox('B', i, t.score, 10) : `<span class="sc ${t.score <= 0 ? 'neg' : ''}">${t.score} tỷ</span>`}
        <span class="lb">${t.score <= 0 ? 'Phá sản' : 'Tài sản'}</span></div>`).join('');
    const veil = document.getElementById('b-veil');
    veil.innerHTML = showLog ? `<div class="veil" role="dialog" aria-label="Sổ thư ký"><div class="box">
        <div class="kicker">Sổ thư ký · mọi khoản cộng trừ</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Lượt</th><th>Đội</th><th>Lý do</th><th class="num">Tỷ</th></tr></thead>
          <tbody>${S.log.slice().reverse().map(l => `<tr><td>${l.turn}</td><td>${nm(l.team)}</td><td>${esc(l.why)}</td><td class="num"><b class="${l.delta > 0 ? 'pos' : l.delta < 0 ? 'neg' : ''}">${fmt(l.delta)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="note">Chưa có khoản nào.</td></tr>'}</tbody>
        </table></div>
        <button class="btn btn-gold" onclick="B.log()">Đóng</button></div></div>` : '';
  }

  act.names = () => (S.teams || []).map(t => t.name);
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= ĐẤU GIÁ ================= */
const D = (() => {
  const KEYD = 'dau-gia-v1';
  const BOX = { 50:3, 100:5, 120:5, 150:5 };
  const ITEMS = {
    1:{ t:'Nhân đôi', d:'Tài sản hiện có nhân đôi', mood:'good' },
    2:{ t:'Chia đôi', d:'Tài sản hiện có chia đôi', mood:'bad' },
    3:{ t:'Bị cướp 50 tỷ', d:'Phải hiến 50 tỷ cho một đối thủ bất kì', mood:'bad' },
    4:{ t:'Được chu cấp', d:'Mỗi đội khác góp 10 tỷ cho bạn', mood:'good' },
    5:{ t:'Đổi tiền', d:'Bắt buộc đổi toàn bộ tài sản với một đội bất kì', mood:'meh' },
    6:{ t:'Tăng 100 tỷ', d:'Cộng thẳng 100 tỷ', mood:'good' }
  };
  function fresh(){
    return { phase:'setup', names:['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5'], rounds:3, qPer:1, qText:SAMPLE_Q,
      questions:[], qi:0, teams:[], k:0, box:null, pendingDraw:null, peekDraw:false, round:1, t:0, curQ:null, showAns:false,
      lastQ:null, bid:{ team:null, price:10 }, item:null, lines:[], swaps:[], log:[], armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYD)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
  let undo = [], showBook = false;

  const save = () => { try { localStorage.setItem(KEYD, JSON.stringify(S)); } catch(e) {} };
  const snap = () => { undo.push(JSON.stringify(S)); if (undo.length > 40) undo.shift(); };
  const n = () => S.teams.length;
  const nm = i => esc(S.teams[i].name);
  const r1 = x => Math.round(x * 10) / 10;
  const curTeam = () => S.t % n();
  function log(team, delta, why, pub){
    S.log.push({ round:S.round, team, delta:r1(delta), why, after:r1(S.teams[team].money) });
    if (pub) S.teams[team].last = pub;
  }
  function change(team, delta, why, pub){ S.teams[team].money = r1(S.teams[team].money + delta); log(team, delta, why, pub); }
  function nextQ(){ S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null; S.qi++; S.showAns = false; }

  const act = {
    start(){
      const names = [...document.querySelectorAll('[data-dname]')].map(el => el.value.trim()).filter(Boolean);
      if (names.length < 2) { document.getElementById('d-err').textContent = 'Cần ít nhất 2 đội.'; return; }
      const num = id => parseInt(document.getElementById(id).value, 10);
      S.names = names;
      S.rounds = Math.max(1, num('d-rounds') || 3);
      S.qPer = Math.max(1, num('d-qper') || 1);
      S.qText = document.getElementById('d-qtext').value;
      S.questions = parseQLines(S.qText, false);
      S.teams = names.map(name => ({ name, start:null, money:0, last:'Chưa có giao dịch' }));
      S.box = { ...BOX }; S.k = 0; S.round = 1; S.t = 0; S.qi = 0; S.log = []; S.swaps = []; undo = [];
      S.phase = 'draw'; render();
    },
    enterDraw(v){
      snap();
      S.teams[S.k].start = v; S.teams[S.k].money = v;
      if (S.box[v] > 0) S.box[v]--;
      log(S.k, v, 'Thăm tài sản ban đầu');
      SFX.click(); act.afterDraw();
    },
    machineDraw(){
      const pool = [];
      Object.entries(S.box).forEach(([v, c]) => { for (let i = 0; i < c; i++) pool.push(+v); });
      if (!pool.length) Object.entries(BOX).forEach(([v, c]) => { for (let i = 0; i < c; i++) pool.push(+v); });
      S.pendingDraw = pool[Math.floor(Math.random() * pool.length)];
      S.peekDraw = false; S.phase = 'drawShow'; SFX.flip(); render();
    },
    peekDraw(){ S.peekDraw = true; SFX.coin(); render(); },
    keepDraw(){ const v = S.pendingDraw; S.pendingDraw = null; S.peekDraw = false; act.enterDraw(v); },
    afterDraw(){
      S.k++;
      if (S.k >= n()) { S.t = 0; nextQ(); S.phase = 'question'; }
      else S.phase = 'draw';
      render();
    },
    answer(right){
      snap();
      const t = curTeam(), d = right ? 100 : -50;
      change(t, d, right ? 'Trả lời đúng' : 'Trả lời sai', right ? 'Câu hỏi: +100 tỷ' : 'Câu hỏi: −50 tỷ');
      S.lastQ = { team:t, d };
      S.phase = 'qres'; right ? SFX.coin() : SFX.bonk(); render();
    },
    nextTurn(){
      S.t++;
      if (S.t >= n() * S.qPer) { S.bid = { team:null, price:10 }; S.phase = 'auction'; }
      else { nextQ(); S.phase = 'question'; }
      render();
    },
    bidTeam(i){ S.bid.team = S.bid.team === i ? null : i; SFX.click(); render(); },
    bump(x){ const el = document.getElementById('d-price'); let v = parseInt(el.value, 10) || 10; v = Math.max(10, v + x); S.bid.price = v; render(); },
    setPrice(){ const v = parseInt(document.getElementById('d-price').value, 10); if (Number.isFinite(v)) S.bid.price = Math.max(10, v); save(); },
    sell(){
      if (S.bid.team === null) { document.getElementById('d-aerr').textContent = 'Chọn đội trả giá cao nhất trước nha.'; return; }
      act.setPrice();
      snap();
      const b = S.bid;
      change(b.team, -b.price, `Thắng đấu giá vòng ${S.round}`, `Mua hộp bí ẩn: −${b.price} tỷ`);
      S.item = null; S.lines = []; S.phase = 'box'; SFX.click(); render();
    },
    noSale(){ snap(); S.bid.team = null; S.lines = []; S.item = null; S.phase = 'roundEnd'; render(); },
    open(id){
      snap();
      if (!id) id = 1 + Math.floor(Math.random() * 6);
      S.item = id; S.lines = [];
      const w = S.bid.team;
      if (id === 1) { const m = S.teams[w].money; change(w, m, 'Hộp: nhân đôi', 'Hộp: nhân đôi tài sản'); }
      if (id === 2) { const m = S.teams[w].money; change(w, -r1(m / 2), 'Hộp: chia đôi', 'Hộp: chia đôi tài sản'); }
      if (id === 4) {
        S.teams.forEach((_, i) => { if (i !== w) change(i, -10, `Góp chu cấp cho ${S.teams[w].name}`, `Góp 10 tỷ cho ${S.teams[w].name}`); });
        change(w, 10 * (n() - 1), 'Hộp: được chu cấp', `Hộp: được chu cấp ${10 * (n() - 1)} tỷ`);
      }
      if (id === 6) change(w, 100, 'Hộp: tăng 100 tỷ', 'Hộp: +100 tỷ');
      S.phase = [3, 5].includes(id) ? 'itemPick' : 'roundEnd';
      SFX.flip(); setTimeout(() => ITEMS[id].mood === 'good' ? SFX.coin() : ITEMS[id].mood === 'bad' ? SFX.bonk() : SFX.click(), 320);
      render();
    },
    pick(j){
      snap();
      const w = S.bid.team;
      if (S.item === 3) {
        change(w, -50, `Bị ${S.teams[j].name} cướp`, `Hộp: mất 50 tỷ vào tay ${S.teams[j].name}`);
        change(j, 50, `Cướp của ${S.teams[w].name}`, `Được 50 tỷ từ ${S.teams[w].name}`);
      } else {
        const a = S.teams[w].money, b = S.teams[j].money;
        S.swaps.push({ round:S.round, from:w, to:j, before:a, after:b });
        change(w, b - a, `Đổi tiền với ${S.teams[j].name}`, `Hộp: đổi tiền với ${S.teams[j].name}`);
        change(j, a - b, `Bị ${S.teams[w].name} đổi tiền`, `Bị ${S.teams[w].name} đổi tiền`);
      }
      S.phase = 'roundEnd'; SFX.flip(); render();
    },
    nextRound(){
      if (S.round >= S.rounds) { S.phase = 'final'; }
      else { S.round++; S.t = 0; nextQ(); S.phase = 'question'; }
      render();
    },
    reveal(){
      const btn = document.getElementById('d-revealBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang mở sổ...'; }
      const wait = SFX.drumroll();
      setTimeout(() => { S.phase = 'end'; SFX.flip(); setTimeout(SFX.fanfare, 380); render(); }, wait);
    },
    showAns(){ S.showAns = true; render(); },
    undo(){ if (!undo.length) return; S = JSON.parse(undo.pop()); render(); },
    book(){ showBook = !showBook; render(); },
    adj(i, d){
      d = Number(d) || 0; if (!d) return;
      snap(); change(i, d, 'Chỉnh tay'); render();
    },
    setv(i, v){ const n = Number(v); if (Number.isFinite(n)) act.adj(i, r1(n - S.teams[i].money)); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      const keep = { names:S.names, rounds:S.rounds, qPer:S.qPer, qText:S.qText };
      S = Object.assign(fresh(), keep); undo = []; showBook = false; render();
    }
  };

  /* ---------- views ---------- */
  const mbox = `<div class="mbox" aria-hidden="true"><span>?</span></div>`;
  const teamPicks = (fn, sel, exclude) => `<div class="grid-pick">${S.teams.map((x, i) =>
    `<button class="chip ${sel === i ? 'sel' : ''}" ${i === exclude ? 'disabled' : ''} onclick="D.${fn}(${i})">${esc(x.name)}</button>`).join('')}</div>`;
  const itemCard = id => `<div class="slip ${ITEMS[id].mood}"><span class="slip-no">Hộp bí ẩn · phiếu ${id}</span><span class="slip-t">${ITEMS[id].t}</span><span class="slip-d">${ITEMS[id].d}</span></div>`;
  const qCard = title => {
    const q = S.curQ;
    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'D')}</div>`
      : `<div class="qcard"><div class="kicker">${title}</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };

  function vSetup(){
    const names = [...S.names];
    return `
      ${mbox}
      <div class="kicker">Trò chơi thuyết trình · Làm tỷ phú một buổi</div>

        <div class="panel">
          <h3>Các đội</h3>
          ${names.map((v, i) => `<label for="d-nm${i}">Đội ${i + 1}${i >= 4 ? ' (không bắt buộc)' : ''}<input id="d-nm${i}" data-dname value="${esc(v)}" placeholder="Bỏ trống nếu không dùng"></label>`).join('')}
          <div class="two">
            <label for="d-rounds">Số vòng<input id="d-rounds" type="number" min="1" value="${S.rounds}"></label>
            <label for="d-qper">Câu mỗi đội / vòng<input id="d-qper" type="number" min="1" value="${S.qPer}"></label>

        </div>
        <div class="panel">
          <h3>Câu hỏi</h3>
          <label for="d-qtext">Mỗi dòng: câu hỏi | đáp án. Dòng bắt đầu bằng &gt;&gt; là đoạn văn đi kèm các câu bên dưới. Để trống nếu chiếu câu hỏi bằng slide Canva.
            <textarea id="d-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>

        <div class="panel span2">
          <h3>Luật chơi</h3>

  function vDraw(){
    const left = Object.entries(S.box).map(([v, c]) => `${c} thăm ${v}`).join(' · ');

      <div class="kicker">Bốc thăm tài sản · ${S.k + 1}/${n()}</div>

      <p class="lead">Bốc thăm thật rồi người dẫn bấm số vừa bốc (cả lớp nhìn đi chỗ khác 🙈), hoặc để máy bốc giùm.</p>
      <div class="row">${[50, 100, 120, 150].map(v => `<button class="chip" onclick="D.enterDraw(${v})">${v} tỷ</button>`).join('')}</div>

  function vDrawShow(){
    return `
      <div class="kicker">Chỉ ${nm(S.k)} được xem</div>
      ${S.peekDraw ? `<div class="money pos">${S.pendingDraw} tỷ</div><p class="lead">Nhớ kỹ con số này nha, rồi bấm ẩn đi.</p>
        <button class="btn btn-gold" onclick="D.keepDraw()">Đã nhớ, ẩn đi</button>`
      : `<div class="seal" aria-label="Thăm niêm phong"></div><h2>Thăm đã bốc</h2>
        <p class="lead">Các đội khác quay mặt đi, chỉ ${nm(S.k)} nhìn màn hình.</p>
        <button class="btn btn-eat" onclick="D.peekDraw()">Mở xem</button>`}`;
  }
  function vQuestion(){
    const t = curTeam();
    return `${qCard(`Vòng ${S.round} · Câu hỏi cho ${nm(t)}`)}
      <div class="row"><button class="btn btn-ok" onclick="D.answer(true)">Đúng<small>+100 tỷ</small></button>
      <button class="btn btn-no" onclick="D.answer(false)">Sai<small>−50 tỷ</small></button></div>`;
  }
  function vQres(){
    const L = S.lastQ, last = S.t + 1 >= n() * S.qPer;
    return `<div class="kicker">${nm(L.team)}</div>
      <div class="money ${L.d > 0 ? 'pos' : 'neg'}">${fmt(L.d)} tỷ</div>
      <button class="btn btn-gold" onclick="D.nextTurn()">${last ? 'Mở phiên đấu giá 🔨' : 'Đội tiếp →'}</button>`;
  }
  function vAuction(){
    return `
      <div class="kicker">Vòng ${S.round} · Phiên đấu giá</div>
      ${mbox}
      <h2>Món hàng bí ẩn, khởi điểm 10 tỷ</h2>
      <p class="lead">Các đội hô giá. Chốt xong thì bấm đội thắng và nhập giá cuối.</p>
      ${teamPicks('bidTeam', S.bid.team, -1)}
      <div class="row heir">
        <button class="ghost" onclick="D.bump(-10)" aria-label="Giảm 10 tỷ">−10</button>
        <label for="d-price">Giá chốt (tỷ)<input id="d-price" type="number" min="10" step="10" value="${S.bid.price}" onchange="D.setPrice()"></label>
        <button class="ghost" onclick="D.bump(10)">+10</button>
        <button class="ghost" onclick="D.bump(50)">+50</button>
      </div>
      <p class="note" id="d-aerr" role="alert"></p>
      <div class="row">
        <button class="btn btn-eat" onclick="D.sell()">🔨 Chốt giá</button>
        <button class="btn btn-no" onclick="D.noSale()">Không ai mua</button>
      </div>`;
  }
  function vBox(){
    const w = S.bid.team;
    return `
      <div class="kicker">${nm(w)} mua với ${S.bid.price} tỷ</div>
      ${mbox}
      <h2>Mở hộp bí ẩn!</h2>
      <button class="btn btn-eat" onclick="D.open()">Máy bốc phần quà</button>
      <p class="note">Bốc phiếu giấy thật? Bấm số phiếu bốc được:</p>
      <div class="row">${[1,2,3,4,5,6].map(i => `<button class="ghost" onclick="D.open(${i})">${i}. ${ITEMS[i].t}</button>`).join('')}</div>`;
  }
  function vItemPick(){
    const w = S.bid.team;
    return `${itemCard(S.item)}
      <p class="lead">${S.item === 3 ? `${nm(w)} phải đưa 50 tỷ cho đội nào?` : `${nm(w)} đổi toàn bộ tài sản với đội nào? Ai giàu, ai nghèo… chỉ có trời biết 😏`}</p>
      ${teamPicks('pick', null, w)}`;
  }
  function vRoundEnd(){
    const sold = S.item;
    return `${sold ? itemCard(sold) : `<div class="kicker">Vòng ${S.round}</div><h2>Phiên này không ai mua</h2>`}
      ${sold ? `<p class="lead">Số tiền cụ thể nằm trong sổ thư ký. Cả lớp cứ việc đoán 🤫</p>` : ''}
      <button class="btn btn-gold" onclick="D.nextRound()">${S.round >= S.rounds ? 'Kết thúc, công bố tài sản' : `Sang vòng ${S.round + 1} →`}</button>`;
  }
  function vFinal(){
    return `<div class="kicker">Hết ${S.rounds} vòng</div>
      <h1>Ai là tỷ phú?</h1>
      <p class="lead">Mời các đội công khai thăm ban đầu. Đội nào từng đổi tiền sắp biết mình chọn đúng hay sai.</p>
      <button class="btn btn-eat" id="d-revealBtn" onclick="D.reveal()">Mở sổ tài sản</button>`;
  }
  function vEnd(){
    const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.money - a.money);
    const top = order[0];
    const swaps = S.swaps.map(s => {
      const g = r1(s.after - s.before);
      return `<p>Vòng ${s.round}: ${nm(s.from)} đổi với ${nm(s.to)} · <b class="${g >= 0 ? 'pos' : 'neg'}">${g >= 0 ? 'lời' : 'lỗ'} ${Math.abs(g)} tỷ</b></p>`;
    }).join('');
    return `<div class="kicker">Chung cuộc</div>
      <h1>👑 <span class="team-name">${esc(top.name)}</span></h1>
      <div class="money pos">${top.money} tỷ</div>
      ${swaps ? `<div class="verdict"><p class="kicker">Các vụ đổi tiền</p>${swaps}</div>` : ''}
      <div class="table-wrap"><table>
        <thead><tr><th>Hạng</th><th>Đội</th><th class="num">Thăm ban đầu</th><th class="num">Tài sản cuối (tỷ)</th></tr></thead>
        <tbody>${order.map((t, k) => `<tr><td>${k + 1}</td><td><b>${esc(t.name)}</b></td><td class="num">${t.start}</td><td class="num"><b class="${t.money <= 0 ? 'neg' : ''}">${t.money}</b></td></tr>`).join('')}</tbody>
      </table></div>
      <p class="lead">Các đội còn lại đồng thanh hô khẩu hiệu của ${esc(top.name)}, hoặc tự nhận: <b>“Chúng tôi khố rách áo ôm!”</b> 🥲</p>
      <div class="row">${plushBtn(order[order.length - 1].name)}</div>
      <button class="btn btn-no" onclick="D.reset()">${S.armReset ? 'Bấm lần nữa để chơi ván mới' : 'Chơi ván mới'}</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, draw:vDraw, drawShow:vDrawShow, question:vQuestion, qres:vQres, auction:vAuction, box:vBox, itemPick:vItemPick, roundEnd:vRoundEnd, final:vFinal, end:vEnd };
    document.getElementById('d-stage').innerHTML = (V[S.phase] || vSetup)();
    const st = document.getElementById('d-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      ${!['end','final','draw','drawShow'].includes(S.phase) ? `<span class="pill on">Vòng ${S.round}/${S.rounds}</span>` : ''}
      <button class="ghost" onclick="D.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      <button class="ghost" onclick="D.undo()" ${undo.length ? '' : 'disabled'}>↶ Hoàn tác</button>
      <button class="ghost" onclick="D.book()">Sổ thư ký (bí mật)</button>
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="D.reset()">${S.armReset ? 'Bấm lần nữa để xoá ván' : 'Ván mới'}</button>`;
    const rail = document.getElementById('d-rail');
    rail.hidden = ['setup','end','draw','drawShow'].includes(S.phase);
    const turnTeam = S.phase === 'question' || S.phase === 'qres' ? curTeam() : S.phase === 'box' || S.phase === 'itemPick' ? S.bid.team : -1;
    if (!rail.hidden) rail.innerHTML = S.teams.map((t, i) => `<div class="slot ${i === turnTeam ? 'now' : ''}">
        <span class="nm">${esc(t.name)}</span>
        <span class="sc">🔒 ? tỷ</span>
        <span class="lb">${esc(t.last)}</span></div>`).join('');
    const veil = document.getElementById('d-veil');
    veil.innerHTML = showBook ? `<div class="veil" role="dialog" aria-label="Sổ thư ký"><div class="box">
        <div class="kicker">Chỉ thư ký xem · nhớ tắt máy chiếu</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Đội</th><th class="num">Thăm</th><th class="num">Hiện có (tỷ)</th></tr></thead>
          <tbody>${S.teams.map(t => `<tr><td>${esc(t.name)}</td><td class="num">${t.start ?? '–'}</td><td class="num">${adjBox('D', S.teams.indexOf(t), t.money, 10)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Vòng</th><th>Đội</th><th>Giao dịch</th><th class="num">±</th><th class="num">Còn</th></tr></thead>
          <tbody>${S.log.slice().reverse().map(l => `<tr><td>${l.round}</td><td>${nm(l.team)}</td><td>${esc(l.why)}</td><td class="num"><b class="${l.delta > 0 ? 'pos' : l.delta < 0 ? 'neg' : ''}">${fmt(l.delta)}</b></td><td class="num">${l.after}</td></tr>`).join('') || '<tr><td colspan="5" class="note">Chưa có giao dịch.</td></tr>'}</tbody>
        </table></div>
        <button class="btn btn-gold" onclick="D.book()">Đóng</button></div></div>` : '';
  }
  act.names = () => (S.teams || []).map(t => t.name);
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= ĐẠI HẢI TRÌNH ================= */
const H = (() => {
  const KEYH = 'dai-hai-trinh-v1';
  const GOAL = 5;
  const ICONS = ['🐢', '🦜', '🐙', '🦀', '🐬', '🦈'];
  const WHEEL_DEFAULT = `Tiến 1
Tiến 2
Lùi 1
Hát 1 bài
Tấn công
Tiến 1
Lùi 2
Tiến 3`;
  const COLORS = ['#d8384f', '#f2c35e', '#86dbaf', '#fbf5e6'];

  function parseSeg(label){
    const l = label.toLowerCase();
    const num = (l.match(/-?\d+/) || ['1'])[0];
    if (/tấn công|tan cong/.test(l)) return { label, type:'attack' };
    if (/hát|hat/.test(l)) return { label, type:'sing' };
    if (/tiến|tien/.test(l)) return { label, type:'move', n:Math.abs(parseInt(num, 10)) };
    if (/lùi|lui/.test(l)) return { label, type:'move', n:-Math.abs(parseInt(num, 10)) };
    return { label, type:'none' };
  }
  function fresh(){
    return { phase:'setup', names:['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5'], wheelText:WHEEL_DEFAULT, qText:SAMPLE_Q,
      segs:[], questions:[], qi:0, teams:[], turn:0, curQ:null, showAns:false, rot:0, segIdx:null, lines:[], armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYH)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
  if (S.phase === 'spinning') S.phase = 'spin';
  let undo = [], editing = false;

  const save = () => { try { localStorage.setItem(KEYH, JSON.stringify(S)); } catch(e) {} };
  const snap = () => { undo.push(JSON.stringify(S)); if (undo.length > 40) undo.shift(); };
  const n = () => S.teams.length;
  const cur = () => S.turn % n();
  const nm = i => esc(S.teams[i].name);
  const who = i => `${S.teams[i].icon} ${nm(i)}`;
  function move(i, d, why){
    const before = S.teams[i].pos;
    S.teams[i].pos = Math.max(0, Math.min(GOAL, before + d));
    S.lines.push({ team:i, from:before, to:S.teams[i].pos, why });
  }
  function nextQ(){ S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null; S.qi++; S.showAns = false; }
  function finish(){
    if (S.teams.some(t => t.pos >= GOAL)) { S.phase = 'win'; SFX.fanfare(); }
    else S.phase = 'turnEnd';
  }

  const act = {
    start(){
      const names = [...document.querySelectorAll('[data-hname]')].map(el => el.value.trim()).filter(Boolean);
      const segs = document.getElementById('h-wheel').value.split('\n').map(x => x.trim()).filter(Boolean).map(parseSeg);
      if (names.length < 2) { document.getElementById('h-err').textContent = 'Cần ít nhất 2 đội.'; return; }
      if (segs.length < 2) { document.getElementById('h-err').textContent = 'Vòng quay cần ít nhất 2 ô.'; return; }
      S.names = names;
      S.wheelText = document.getElementById('h-wheel').value;
      S.segs = segs;
      S.qText = document.getElementById('h-qtext').value;
      S.questions = parseQLines(S.qText, false);
      S.teams = names.map((name, i) => ({ name, pos:0, icon:ICONS[i % ICONS.length] }));
      S.turn = 0; S.qi = 0; S.rot = 0; S.lines = []; undo = [];
      nextQ(); S.phase = 'question'; render();
    },
    answer(right){
      snap(); S.lines = [];
      const t = cur();
      if (right) { S.phase = 'spin'; SFX.coin(); render(); return; }
      if (S.teams[t].pos === 0) { S.phase = 'punish'; SFX.sad(); }
      else { move(t, -1, 'Trả lời sai'); S.phase = 'turnEnd'; SFX.bonk(); }
      render();
    },
    spin(){
      if (S.phase !== 'spin') return;
      snap();
      const k = S.segs.length, seg = 360 / k;
      const idx = Math.floor(Math.random() * k);
      const base = S.rot;
      let target = -(idx + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
      let delta = ((target - base) % 360 + 360) % 360;
      S.rot = base + 360 * 5 + delta;
      S.segIdx = idx; S.phase = 'spinning';
      render(base);
      // ticks that slow down with the wheel
      let tt = 0, gap = 60;
      while (tt < 3300) { setTimeout(() => SFX.click(), tt); tt += gap; gap *= 1.09; }
      setTimeout(act.land, 3700);
    },
    land(){
      if (S.phase !== 'spinning') return;
      const t = cur(), s = S.segs[S.segIdx];
      if (s.type === 'move') { move(t, s.n, `Vòng quay: ${s.label}`); s.n > 0 ? SFX.coin() : SFX.bonk(); finish(); }
      else if (s.type === 'sing') { S.phase = 'sing'; SFX.flip(); }
      else if (s.type === 'attack') { S.phase = 'attack'; SFX.flip(); }
      else { S.lines.push({ team:t, from:S.teams[t].pos, to:S.teams[t].pos, why:`Vòng quay: ${s.label}` }); S.phase = 'turnEnd'; SFX.click(); }
      render();
    },
    sing(did){
      snap(); move(cur(), did ? 1 : -1, did ? 'Hát 1 bài thật to' : 'Không chịu hát');
      did ? SFX.fanfare() : SFX.bonk();
      finish(); render();
    },
    attack(j){
      snap(); move(j, -2, `Bị ${S.teams[cur()].name} tấn công`);
      SFX.bonk(); finish(); render();
    },
    next(){ S.turn++; S.lines = []; nextQ(); S.phase = 'question'; render(); },
    keepGoing(){ S.phase = 'turnEnd'; render(); },
    edit(){ editing = !editing; render(); },
    adj(i, d){
      d = Math.round(Number(d)) || 0; if (!d) return;
      snap(); S.teams[i].pos = Math.max(0, Math.min(GOAL, S.teams[i].pos + d)); render();
    },
    setv(i, v){ const n = Math.round(Number(v)); if (Number.isFinite(n)) act.adj(i, n - S.teams[i].pos); },
    showAns(){ S.showAns = true; render(); },
    undo(){ if (!undo.length) return; S = JSON.parse(undo.pop()); render(); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      const keep = { names:S.names, wheelText:S.wheelText, qText:S.qText };
      S = Object.assign(fresh(), keep); undo = []; render();
    }
  };

  /* ---------- views ---------- */
  const qCard = title => {
    const q = S.curQ;
    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'H')}</div>`
      : `<div class="qcard"><div class="kicker">${title}</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };
  const lineList = () => S.lines.length ? `<div class="verdict">${S.lines.map(l => {
      const d = l.to - l.from;
      return `<p>${who(l.team)}: <b class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? `tiến ${d}` : d < 0 ? `lùi ${-d}` : 'đứng yên'}</b> · ${esc(l.why)} · đang ở ${l.to === GOAL ? 'kho báu' : l.to === 0 ? 'xuất phát' : `bước ${l.to}`}</p>`;
    }).join('')}</div>` : '';

  function vSetup(){
    const names = [...S.names];
    return `
      <div class="kicker">Trò chơi thuyết trình · Kho báu cách 5 bước</div>
      <h1>Đại hải trình</h1>
      <div class="setup">
        <div class="panel">
          <h3>Các đội</h3>
          ${names.map((v, i) => `<label for="h-nm${i}">${ICONS[i]} Đội ${i + 1}${i >= 4 ? ' (không bắt buộc)' : ''}<input id="h-nm${i}" data-hname value="${esc(v)}" placeholder="Bỏ trống nếu không dùng"></label>`).join('')}
        </div>
        <div class="panel">
          <h3>Vòng quay</h3>
          <label for="h-wheel">Mỗi dòng một ô. Máy hiểu: “Tiến 2”, “Lùi 1”, “Hát 1 bài”, “Tấn công”. Ô khác (vd “Mất lượt”) thì đứng yên.
            <textarea id="h-wheel" spellcheck="false" style="min-height:190px">${esc(S.wheelText)}</textarea></label>
        </div>
        <div class="panel span2">
          <h3>Câu hỏi</h3>
          <label for="h-qtext">Mỗi dòng: câu hỏi | đáp án. Dòng bắt đầu bằng &gt;&gt; là đoạn văn đi kèm các câu bên dưới. Chuẩn bị càng nhiều càng tốt, hết thì máy quay lại câu đầu. Để trống nếu chiếu bằng slide Canva.
            <textarea id="h-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>
          <ul class="rules">
            <li><b>Trả lời đúng:</b> quay vòng quay.</li>
            <li><b>Trả lời sai:</b> lùi 1 bước. Đang ở xuất phát thì cả đội bị phạt hát hoặc đồng thanh xin lỗi.</li>
            <li><b>Hát 1 bài:</b> hát thì tiến 1, không hát thì lùi 1. <b>Tấn công:</b> chọn một đội bắt lùi 2 bước.</li>
          </ul>
        </div>
      </div>
      <p class="note" id="h-err" role="alert"></p>
      <button class="btn btn-eat" onclick="H.start()">Nhổ neo! ⚓</button>`;
  }
  const vQuestion = () => `${qCard(`Lượt ${S.turn + 1} · Câu hỏi cho ${who(cur())}`)}
    <div class="row"><button class="btn btn-ok" onclick="H.answer(true)">Đúng<small>Được quay</small></button>
    <button class="btn btn-no" onclick="H.answer(false)">Sai<small>Lùi 1 bước</small></button></div>`;
  const wheelBlock = () => `<div class="wheel-wrap"><div class="wheel-pin" aria-hidden="true"></div><canvas id="h-canvas" width="560" height="560" aria-label="Vòng quay"></canvas></div>`;
  const vSpin = () => `<div class="kicker">${who(cur())} trả lời đúng</div>${wheelBlock()}
    <button class="btn btn-eat" onclick="H.spin()" ${S.phase === 'spinning' ? 'disabled' : ''}>${S.phase === 'spinning' ? 'Đang quay...' : 'Quay!'}</button>`;
  const segTag = () => S.segIdx !== null ? `<div class="slip meh"><span class="slip-no">Vòng quay</span><span class="slip-t">${esc(S.segs[S.segIdx].label)}</span></div>` : '';
  const vSing = () => `${segTag()}<h2>${who(cur())} hát hay không?</h2>
    <div class="row"><button class="btn btn-ok" onclick="H.sing(true)">Đã hát 🎤<small>Tiến 1</small></button>
    <button class="btn btn-no" onclick="H.sing(false)">Không hát<small>Lùi 1</small></button></div>`;
  const vAttack = () => `${segTag()}<h2>${who(cur())} tấn công ai?</h2><p class="lead">Đội bị tấn công lùi 2 bước.</p>
    <div class="grid-pick">${S.teams.map((x, i) => `<button class="chip" ${i === cur() ? 'disabled' : ''} onclick="H.attack(${i})">${x.icon} ${esc(x.name)} <small class="chip-sub">${x.pos === 0 ? 'xuất phát' : `bước ${x.pos}`}</small></button>`).join('')}</div>`;
  const vPunish = () => `<div class="kicker">${who(cur())} trả lời sai ngay vạch xuất phát</div>
    <h2>Phạt cả đội!</h2>
    <p class="lead">Đồng thanh hát 1 bài, hoặc hô thật to: <b>“Xin lỗi, chúng tôi quá hồ đồ!”</b> 🙇</p>
    <div class="row">${plushBtn(S.teams[cur()].name)}</div>
    <button class="btn btn-gold" onclick="H.next()">Đội tiếp →</button>`;
  const vTurnEnd = () => `${segTag()}${lineList()}<button class="btn btn-gold" onclick="H.next()">Đội tiếp →</button>`;
  function vWin(){
    const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.pos - a.pos);
    const w = order[0];
    return `<div class="kicker">Cập bến kho báu</div>
      <div class="chest" aria-hidden="true">${w.icon}</div>
      <h1><span class="team-name">${esc(w.name)}</span> tìm thấy kho báu!</h1>
      ${lineList()}
      <div class="row"><button class="btn btn-gold" onclick="H.keepGoing()">Chơi tiếp tranh hạng nhì</button>
      <button class="btn btn-no" onclick="H.reset()">${S.armReset ? 'Bấm lần nữa để chơi ván mới' : 'Ván mới'}</button></div>`;
  }


  /* ---------- sea chart: dashed routes from each start to the treasure ---------- */
  const ROUTE_COLORS = ['#2f4f8f', '#7a2b2b', '#2f6b4a', '#8a5a12', '#5a3d7a', '#a8322d'];
  const STARTS = [[90, 80], [70, 270], [160, 450], [430, 470], [600, 45], [690, 480]];
  const LBL = [[0, 52, 'middle'], [0, 52, 'middle'], [0, -40, 'middle'], [-40, 6, 'end'], [-40, 6, 'end'], [-40, 6, 'end']];
  const CHEST = [860, 260];
  function routePoint(i, t){
    const [sx, sy] = STARTS[i % STARTS.length], [cx, cy] = CHEST;
    const mx = (sx + cx) / 2, my = (sy + cy) / 2;
    const bend = [ -90, 40, 110, 70, -60, 40 ][i % 6];
    const kx = mx, ky = my + bend;
    const x = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * kx + t * t * cx;
    const y = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * ky + t * t * cy;
    return [x, y];
  }
  function chartSVG(now){
    const n = S.teams.length;
    let routes = '', marks = '', toks = '';
    S.teams.forEach((t, i) => {
      const col = ROUTE_COLORS[i % ROUTE_COLORS.length];
      const pts = Array.from({ length:41 }, (_, k) => routePoint(i, k / 40 * 0.94));
      routes += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${i === now ? 6 : 4}" stroke-dasharray="14 10" stroke-linecap="round" opacity="${now < 0 || i === now ? 1 : .55}"/>`;
      for (let p = 1; p < GOAL; p++) {
        const [x, y] = routePoint(i, p / GOAL);
        marks += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(12)"><rect x="-11" y="-11" width="22" height="22" rx="3" fill="#f4e6c4" stroke="${col}" stroke-width="4"/></g>`;
      }
      const [sx, sy] = STARTS[i % STARTS.length];
      marks += `<g transform="translate(${sx},${sy})"><circle r="30" fill="#fbf2dc" stroke="${col}" stroke-width="4"/><text text-anchor="middle" y="11" font-size="30">${t.icon}</text></g>
        <text class="lbl" x="${sx + LBL[i % 6][0]}" y="${sy + LBL[i % 6][1]}" text-anchor="${LBL[i % 6][2]}">${esc(t.name)}</text>`;
      if (t.pos > 0) {
        const [x, y] = t.pos >= GOAL ? [CHEST[0] - 30 + (i % 3) * 30, CHEST[1] - 70 - Math.floor(i / 3) * 34] : routePoint(i, t.pos / GOAL);
        toks += `<g transform="translate(${x.toFixed(1)},${(y - 6).toFixed(1)})"><circle r="22" fill="${col}" opacity=".9"/><text class="tok" text-anchor="middle" y="11" font-size="28">${t.icon}</text></g>`;
      }
    });
    const [cx, cy] = CHEST;
    const chest = `<g transform="translate(${cx},${cy})">
      <ellipse cx="0" cy="44" rx="74" ry="12" fill="rgba(74,46,20,.25)"/>
      <rect x="-62" y="-6" width="124" height="50" rx="6" fill="#7a4a1e" stroke="#3b2413" stroke-width="4"/>
      <path d="M-62 -6 Q0 -60 62 -6 Z" fill="#9a6128" stroke="#3b2413" stroke-width="4"/>
      <circle cx="-30" cy="-14" r="9" fill="#f2c35e"/><circle cx="-8" cy="-22" r="10" fill="#ffd96b"/><circle cx="18" cy="-16" r="9" fill="#f2c35e"/><circle cx="36" cy="-10" r="7" fill="#ffd96b"/>
      <rect x="-66" y="10" width="132" height="8" fill="#c99a3b"/><rect x="-10" y="4" width="20" height="24" rx="3" fill="#f2c35e" stroke="#3b2413" stroke-width="3"/>
    </g><text class="lbl" x="${cx}" y="${cy + 80}" text-anchor="middle">KHO BÁU</text>`;
    const compass = `<g transform="translate(930,80)" opacity=".55"><circle r="38" fill="none" stroke="#6b4a22" stroke-width="2"/><path d="M0 -46 L8 0 L0 46 L-8 0 Z" fill="#6b4a22"/><path d="M-46 0 L0 -7 L46 0 L0 7 Z" fill="#a78558"/><text y="-52" text-anchor="middle" class="step-n">N</text></g>`;
    const grat = [140, 260, 380].map(y => `<path d="M0 ${y} Q500 ${y + (y - 260) * 0.35} 1000 ${y}" fill="none" stroke="rgba(74,46,20,.14)" stroke-width="1.5"/>`).join('') +
      [200, 400, 600, 800].map(x => `<path d="M${x} 0 Q${x + (x - 500) * 0.12} 260 ${x} 520" fill="none" stroke="rgba(74,46,20,.14)" stroke-width="1.5"/>`).join('');
    const land = `<g fill="rgba(122,90,48,.13)" stroke="rgba(74,46,20,.18)" stroke-width="2">
      <path d="M210 120 q40 -50 110 -30 q50 20 30 70 q-20 50 -80 40 q-70 -10 -60 -80z"/>
      <path d="M520 300 q30 -40 80 -20 q40 30 10 80 q-30 40 -70 20 q-40 -30 -20 -80z"/>
      <path d="M640 110 q60 -40 120 -10 q30 30 -10 60 q-60 30 -110 0 q-30 -20 0 -50z"/>
    </g>`;
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 1000 520" role="img" aria-label="Hải đồ: vị trí các đội trên đường tới kho báu">
      <rect width="1000" height="520" fill="#ead6a8"/>
      <rect width="1000" height="520" fill="url(#vig)"/>
      <defs><radialGradient id="vig" cx="50%" cy="45%" r="70%"><stop offset="60%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(90,55,20,.35)"/></radialGradient></defs>
      ${grat}${land}
      <text class="ocean" x="250" y="205">BIỂN ĐÔNG</text><text class="ocean" x="300" y="385">ĐẠI DƯƠNG</text>
      ${compass}${routes}${marks}${chest}${toks}
    </svg></div>`;
  }
  function drawWheel(rotFrom){
    const cv = document.getElementById('h-canvas');
    if (!cv) return;
    const c = cv.getContext('2d'), k = S.segs.length, R = 270, cx = 280, cy = 280, seg = 2 * Math.PI / k;
    c.clearRect(0, 0, 560, 560);
    S.segs.forEach((s, i) => {
      const a0 = -Math.PI / 2 + i * seg, a1 = a0 + seg;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, a0, a1); c.closePath();
      c.fillStyle = COLORS[i % COLORS.length]; c.fill();
      c.strokeStyle = '#13402f'; c.lineWidth = 4; c.stroke();
      c.save(); c.translate(cx, cy); c.rotate(a0 + seg / 2);
      c.fillStyle = i % COLORS.length === 0 ? '#fbf5e6' : '#2a1a10';
      c.font = `800 ${k > 10 ? 22 : 28}px "Baloo 2", system-ui, sans-serif`;
      c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText(s.label.length > 14 ? s.label.slice(0, 13) + '…' : s.label, R - 22, 0);
      c.restore();
    });
    c.beginPath(); c.arc(cx, cy, 34, 0, 2 * Math.PI); c.fillStyle = '#13402f'; c.fill();
    c.lineWidth = 6; c.strokeStyle = '#f2c35e'; c.stroke();
    const spinning = S.phase === 'spinning';
    cv.style.transition = 'none';
    cv.style.transform = `rotate(${spinning ? rotFrom : S.rot}deg)`;
    if (spinning) {
      void cv.offsetWidth;
      const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      cv.style.transition = `transform ${reduce ? 0.4 : 3.6}s cubic-bezier(.17,.67,.2,1)`;
      cv.style.transform = `rotate(${S.rot}deg)`;
    }
  }

  function render(rotFrom){
    save();
    const V = { setup:vSetup, question:vQuestion, spin:vSpin, spinning:vSpin, sing:vSing, attack:vAttack, punish:vPunish, turnEnd:vTurnEnd, win:vWin };
    document.getElementById('h-stage').innerHTML = (V[S.phase] || vSetup)();
    drawWheel(typeof rotFrom === 'number' ? rotFrom : S.rot);
    const st = document.getElementById('h-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      <span class="pill on">Lượt ${S.turn + 1}</span>
      <button class="ghost" onclick="H.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      <button class="ghost" onclick="H.undo()" ${undo.length && S.phase !== 'spinning' ? '' : 'disabled'}>↶ Hoàn tác</button>
      ${editBtn('H', editing)}
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="H.reset()">${S.armReset ? 'Bấm lần nữa để xoá ván' : 'Ván mới'}</button>`;
    const board = document.getElementById('h-board');
    board.hidden = S.phase === 'setup';
    if (!board.hidden) {
      const now = ['question','spin','spinning','sing','attack','punish'].includes(S.phase) ? cur() : -1;
      board.innerHTML = chartSVG(now) + (editing ? `<div class="edit-list">${S.teams.map((t, i) => `<div class="slot"><span class="nm">${t.icon} ${esc(t.name)}</span>${adjBox('H', i, t.pos, 1)}<span class="lb">Bước (0 = xuất phát, ${GOAL} = kho báu)</span></div>`).join('')}</div>` : '');
    }
  }
  act.names = () => (S.teams || []).map(t => t.name);
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= LÁ BÀI QUYỀN NĂNG ================= */
const P = (() => {
  const KEYP = 'la-bai-quyen-nang-v1';
  const LV = { 1:'Dễ', 3:'Trung bình', 5:'Khó' };
  const SECRET = { dbl:'Nhân đôi ×2', shield:'Trừ đôi (khiên)' };
  const SAMPLE_P = `1 | Plural of "child"? | children
1 | Opposite of "expensive"? | cheap
3 | Past form of "teach"? | taught
3 | Complete: If it rains, we ___ (stay) at home. | will stay
5 | Rewrite: "I don't have a bike." → I wish ... | I wish I had a bike.
5 | Spell the word: /ˈwenzdeɪ/ | Wednesday
1 | Complete: I'm good ___ drawing. | at
3 | Which is correct: "much books" or "many books"? | many books
5 | Passive: "They built this bridge in 1990." | This bridge was built in 1990.`;

  function fresh(){
    return { phase:'setup', names:['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5'], turns:10, wrongMinus:false, qText:SAMPLE_P,
      questions:[], qi:0, teams:[], turn:0, curQ:null, lvl:1, showAns:false, secret:null, stealer:null, target:null,
      lines:[], log:[], turnStart:[], armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYP)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
  let undo = [], hostPick = false, showLog = false, editing = false;

  const save = () => { try { localStorage.setItem(KEYP, JSON.stringify(S)); } catch(e) {} };
  const snap = () => { undo.push(JSON.stringify(S)); if (undo.length > 40) undo.shift(); };
  const n = () => S.teams.length;
  const cur = () => S.turn % n();
  const nm = i => esc(S.teams[i].name);
  function add(i, x, why){
    S.teams[i].score += x;
    S.lines.push({ team:i, delta:x, why });
    S.log.push({ turn:S.turn + 1, team:i, delta:x, why });
  }
  function nextQ(){
    S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null;
    S.qi++; S.showAns = false;
    S.lvl = S.curQ && S.curQ.lv ? S.curQ.lv : 1;
  }
  function endTurn(){ S.phase = 'turnEnd'; }

  const act = {
    async classify(){
      const ta = document.getElementById('p-qtext'), msg = document.getElementById('p-lvmsg');
      if (!ta) return 0;
      if (!aiOK()) { if (msg) msg.textContent = 'Cần AI để phân cấp độ. Cô ghi tay 1, 3 hoặc 5 ở đầu dòng nha.'; return 0; }
      const n = PLevel.unlevelled(ta);
      if (!n) { if (msg) msg.textContent = 'Câu nào cũng đã có mức điểm rồi 👍'; return 0; }
      if (window.__AI.needsPass()) { if (msg) msg.textContent = 'Nhập mã dùng AI ở khung đọc ảnh trước nha.'; return 0; }
      if (msg) msg.textContent = `✨ AI đang chia ${n} câu thành dễ / trung bình / khó…`;
      try { const d = await PLevel.classify(ta); if (msg) msg.textContent = `AI đã chấm mức cho ${d} câu (1 = dễ, 3 = trung bình, 5 = khó). Cô sửa số đầu dòng nếu muốn.`; SFX.coin(); return d; }
      catch (e) { if (msg) msg.textContent = `AI chưa phân cấp được (${AIERR[e && e.code] || 'lỗi'}). Câu chưa có mức sẽ tính là Dễ.`; return 0; }
    },
    async start(){
      const ta = document.getElementById('p-qtext');
      if (ta && aiOK() && !window.__AI.needsPass() && PLevel.unlevelled(ta) && !act._busy) {
        act._busy = true; await act.classify(); act._busy = false;
      }
      act._start();
    },
    _start(){
      const names = [...document.querySelectorAll('[data-pname]')].map(el => el.value.trim()).filter(Boolean);
      if (names.length < 2) { document.getElementById('p-err').textContent = 'Cần ít nhất 2 đội.'; return; }
      S.names = names;
      S.turns = Math.max(1, parseInt(document.getElementById('p-turns').value, 10) || 10);
      S.wrongMinus = document.getElementById('p-wm').checked;
      S.qText = document.getElementById('p-qtext').value;
      S.questions = parseQLines(S.qText, true);
      S.teams = names.map(name => ({ name, score:0, cards:{ steal:true, attack:true, dbl:true, shield:true } }));
      S.turn = 0; S.qi = 0; S.log = []; undo = [];
      act.beginTurn(); render();
    },
    beginTurn(){
      S.secret = null; S.stealer = null; S.target = null; S.lines = [];
      S.turnStart = S.teams.map(t => t.score);
      S.phase = 'pre';
    },
    noCard(){ snap(); S.secret = null; nextQ(); S.phase = 'question'; SFX.click(); render(); },
    openHost(){ hostPick = true; render(); },
    closeHost(){ hostPick = false; render(); },
    useSecret(k){
      snap();
      S.teams[cur()].cards[k] = false; S.secret = k; hostPick = false;
      nextQ(); S.phase = 'question'; SFX.flip(); render();
    },
    level(v){ S.lvl = v; SFX.click(); render(); },
    showAns(){ S.showAns = true; render(); },
    answer(right){
      snap();
      const t = cur(), p = S.lvl, c = S.secret;
      if (right){
        add(t, c === 'dbl' ? 2 * p : p, c === 'dbl' ? 'Trả lời đúng, lá nhân đôi' : 'Trả lời đúng');
        SFX.coin(); endTurn();
      } else {
        if (c === 'dbl') add(t, -2 * p, 'Trả lời sai, lá nhân đôi');
        else if (c === 'shield') add(t, 0, 'Trả lời sai, được khiên trừ đôi đỡ');
        else add(t, S.wrongMinus ? -p : 0, 'Trả lời sai');
        SFX.bonk();
        S.phase = S.teams.some((x, i) => i !== t && x.cards.steal) ? 'steal' : 'turnEnd';
      }
      render();
    },
    steal(j){
      snap(); S.stealer = j; S.teams[j].cards.steal = false;
      S.phase = 'stealQ'; SFX.flip(); render();
    },
    noSteal(){ snap(); endTurn(); render(); },
    stealAns(right){
      snap();
      const j = S.stealer, p = S.lvl, c = S.secret;
      if (c === 'shield') { add(j, -2 * p, right ? 'Cướp lượt đúng nhưng dính khiên trừ đôi' : 'Cướp lượt sai, dính khiên trừ đôi'); SFX.sad(); }
      else if (c === 'dbl') { add(j, right ? 2 * p : 0, right ? 'Cướp lượt đúng câu nhân đôi' : 'Cướp lượt sai (câu nhân đôi, không bị trừ)'); right ? SFX.coin() : SFX.bonk(); }
      else { add(j, right ? p : -p, right ? 'Cướp lượt đúng' : 'Cướp lượt sai'); right ? SFX.coin() : SFX.bonk(); }
      endTurn(); render();
    },
    attack(){ snap(); S.teams[cur()].cards.attack = false; S.phase = 'attackPick'; SFX.flip(); render(); },
    attackPick(j){ snap(); S.target = j; S.phase = 'attackQ'; SFX.click(); render(); },
    attackAns(right){
      snap();
      const j = S.target, p = S.lvl;
      add(j, right ? 0 : -p, right ? 'Bị tấn công, trả lời đúng (không được cộng)' : 'Bị tấn công, trả lời sai');
      right ? SFX.click() : SFX.bonk();
      endTurn(); render();
    },
    next(){
      S.turn++;
      if (S.turn >= S.turns) { S.phase = 'end'; SFX.fanfare(); render(); return; }
      act.beginTurn(); render();
    },
    undo(){ if (!undo.length) return; S = JSON.parse(undo.pop()); hostPick = false; render(); },
    log(){ showLog = !showLog; render(); },
    edit(){ editing = !editing; render(); },
    adj(i, d){
      d = Math.round(Number(d)) || 0; if (!d) return;
      snap(); S.teams[i].score += d;
      if (S.turnStart[i] != null) S.turnStart[i] += d;
      S.log.push({ turn:S.turn + 1, team:i, delta:d, why:'Chỉnh tay' });
      render();
    },
    setv(i, v){ const n = Math.round(Number(v)); if (Number.isFinite(n)) act.adj(i, n - S.teams[i].score); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      const keep = { names:S.names, turns:S.turns, wrongMinus:S.wrongMinus, qText:S.qText };
      S = Object.assign(fresh(), keep); undo = []; render();
    }
  };

  /* ---------- views ---------- */
  const lvChips = () => `<div class="row">${[1,3,5].map(v => `<button class="chip lv ${S.lvl === v ? 'sel' : ''}" onclick="P.level(${v})">${LV[v]} · ${v}đ</button>`).join('')}</div>`;
  const qCard = title => {
    const q = S.curQ;
    return q ? `<div class="qcard"><div class="kicker">${title} · ${LV[S.lvl]} ${S.lvl}đ</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'P')}</div>`
      : `<div class="qcard"><div class="kicker">${title} · ${LV[S.lvl]} ${S.lvl}đ</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };
  const secretBadge = () => S.secret ? `<div class="pcards"><span class="pcard back">🂠<small>Đã dùng lá bí mật</small></span></div>` : '';
  const cardsLeft = t => {
    const c = S.teams[t].cards, sec = (c.dbl ? 1 : 0) + (c.shield ? 1 : 0);

  function vSetup(){

      <div class="kicker">Trò chơi thuyết trình · 4 lá mỗi đội</div>

          <label for="p-turns">Tổng số câu (xoay vòng các đội)<input id="p-turns" type="number" min="1" value="${S.turns}"></label>

        </div>
        <div class="panel">
          <h3>Câu hỏi</h3>
          <label for="p-qtext">Mỗi dòng: mức điểm | câu hỏi | đáp án. Mức 1 = dễ, 3 = trung bình, 5 = khó. Câu không ghi mức thì AI tự chấm khi bấm Chia bài.
            <textarea id="p-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>
          <div class="row" style="justify-content:flex-start"><button type="button" class="ghost" onclick="P.classify()">✨ AI phân cấp độ ngay</button><span class="note" id="p-lvmsg"></span></div>
        </div>
        <div class="panel span2">
          <h3>4 lá bài</h3>
          <div class="slip-grid">
            <div class="mini"><b>🂠 Nhân đôi</b><span>Dùng trước câu hỏi, chỉ giơ cho nhóm thuyết trình xem. Đúng ×2 điểm, sai bị trừ ×2. Đội cướp lượt đúng được ×2, sai không bị trừ.</span></div>
            <div class="mini"><b>🂠 Trừ đôi</b><span>Trông giống hệt lá nhân đôi. Sai không bị trừ (như khiên). Đội nào cướp lượt thì đúng hay sai cũng bị trừ ×2.</span></div>
            <div class="mini"><b>🏴 Cướp lượt</b><span>Dùng 1 lần, sau khi đội kia trả lời sai. Đúng được cộng, sai bị trừ.</span></div>
            <div class="mini"><b>⚔️ Tấn công</b><span>Câu khó quá thì chỉ định đội khác trả lời thay. Họ đúng không được cộng, sai bị trừ điểm câu.</span></div>
          </div>
        </div>
      </div>
      <p class="note" id="p-err" role="alert"></p>
      <button class="btn btn-eat" onclick="P.start()">Chia bài!</button>`;
  }
  function vPre(){
    const t = cur(), c = S.teams[t].cards, has = c.dbl || c.shield;
    return `<div class="kicker">Câu ${S.turn + 1}/${S.turns}</div>
      <h1><span class="team-name">${nm(t)}</span><br>có dùng lá bí mật?</h1>
      <p class="lead">Giơ lá cho nhóm thuyết trình xem, không hô tên lá. Các đội khác đoán xem là nhân đôi hay trừ đôi nha 🤫</p>
      <div class="row">
        <button class="btn btn-eat" onclick="P.openHost()" ${has ? '' : 'disabled'}>Có, dùng lá 🂠<small>${has ? 'Người dẫn chọn lá' : 'Hết lá bí mật'}</small></button>
        <button class="btn btn-no" onclick="P.noCard()">Không dùng</button>
      </div>`;
  }
  function vQuestion(){
    const t = cur();
    return `${secretBadge()}${qCard(`Câu ${S.turn + 1} · ${nm(t)}`)}
      ${lvChips()}
      <div class="row">
        <button class="btn btn-ok" onclick="P.answer(true)">Đúng</button>
        <button class="btn btn-no" onclick="P.answer(false)">Sai</button>
        ${S.teams[t].cards.attack ? `<button class="btn btn-gold" onclick="P.attack()">⚔️ Tấn công<small>Đội khác trả lời thay</small></button>` : ''}
      </div>`;
  }
  function vSteal(){
    const t = cur();
    return `${secretBadge()}<div class="kicker">${nm(t)} trả lời sai · kết quả niêm phong</div>
      <h2>Đội nào cướp lượt? 🏴</h2>
      <p class="lead">${S.secret ? `${nm(t)} đã dùng lá bí mật. Nhân đôi hay trừ đôi đây… cướp là liều đấy nha 😏` : `${nm(t)} không dùng lá bí mật.`}</p>
      <div class="grid-pick">${S.teams.map((x, i) => `<button class="chip" ${i === t || !x.cards.steal ? 'disabled' : ''} onclick="P.steal(${i})">${esc(x.name)}${x.cards.steal ? '' : ' <small class="chip-sub">đã dùng lá cướp</small>'}</button>`).join('')}</div>
      <button class="btn btn-no" onclick="P.noSteal()">Không ai cướp</button>`;
  }
  const vStealQ = () => `${secretBadge()}${qCard(`${nm(S.stealer)} cướp lượt`)}
    <div class="row"><button class="btn btn-ok" onclick="P.stealAns(true)">Đúng</button><button class="btn btn-no" onclick="P.stealAns(false)">Sai</button></div>`;
  const vAttackPick = () => `<div class="kicker">${nm(cur())} dùng lá tấn công ⚔️</div><h2>Chỉ định đội trả lời thay</h2>
    <p class="lead">Đội bị chỉ định trả lời đúng không được cộng, sai bị trừ ${S.lvl}đ.</p>
    <div class="grid-pick">${S.teams.map((x, i) => `<button class="chip" ${i === cur() ? 'disabled' : ''} onclick="P.attackPick(${i})">${esc(x.name)}</button>`).join('')}</div>`;
  const vAttackQ = () => `${qCard(`${nm(S.target)} bị tấn công`)}
    <div class="row"><button class="btn btn-ok" onclick="P.attackAns(true)">Đúng<small>Không cộng</small></button><button class="btn btn-no" onclick="P.attackAns(false)">Sai<small>−${S.lvl}đ</small></button></div>`;
  function vTurnEnd(){
    const t = cur();
    const reveal = S.secret
      ? `<div class="slip ${S.secret === 'dbl' ? 'good' : 'bad'}"><span class="slip-no">Lá bí mật của ${nm(t)}</span><span class="slip-t">${SECRET[S.secret]}</span></div>`
      : `<div class="kicker">${nm(t)} không dùng lá bí mật</div>`;
    const lines = S.lines.length ? `<div class="verdict">${S.lines.map(l => `<p>${nm(l.team)}: <b class="${l.delta > 0 ? 'pos' : l.delta < 0 ? 'neg' : ''}">${fmt(l.delta)}đ</b> · ${esc(l.why)}</p>`).join('')}</div>` : '';
    return `${reveal}${lines}<button class="btn btn-gold" onclick="P.next()">${S.turn + 1 >= S.turns ? 'Tổng kết' : 'Câu tiếp →'}</button>`;
  }
  function vEnd(){
    const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
    const top = order[0];
    return `<div class="kicker">Tổng kết</div>
      <h1>👑 <span class="team-name">${esc(top.name)}</span></h1>
      <div class="money pos">${top.score} điểm</div>
      <p class="lead">Các đội thua hô vang câu do ${esc(top.name)} chỉ định, hoặc ra đấm lưng, quạt mát cho đội thắng 💆</p>
      <div class="row">${plushBtn(order[order.length - 1].name)}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Hạng</th><th>Đội</th><th class="num">Điểm</th></tr></thead>
        <tbody>${order.map((t, k) => `<tr><td>${k + 1}</td><td><b>${esc(t.name)}</b></td><td class="num"><b class="${t.score < 0 ? 'neg' : ''}">${t.score}</b></td></tr>`).join('')}</tbody>
      </table></div>
      <button class="btn btn-no" onclick="P.reset()">${S.armReset ? 'Bấm lần nữa để chơi ván mới' : 'Chơi ván mới'}</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, pre:vPre, question:vQuestion, steal:vSteal, stealQ:vStealQ, attackPick:vAttackPick, attackQ:vAttackQ, turnEnd:vTurnEnd, end:vEnd };
    document.getElementById('p-stage').innerHTML = (V[S.phase] || vSetup)();
    const st = document.getElementById('p-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      ${S.phase !== 'end' ? `<span class="pill on">Câu ${S.turn + 1}/${S.turns}</span>` : ''}
      <button class="ghost" onclick="P.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      <button class="ghost" onclick="P.undo()" ${undo.length ? '' : 'disabled'}>↶ Hoàn tác</button>
      ${S.phase !== 'end' ? editBtn('P', editing) : ''}
      <button class="ghost" onclick="P.log()">Sổ thư ký</button>
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="P.reset()">${S.armReset ? 'Bấm lần nữa để xoá ván' : 'Ván mới'}</button>`;
    const rail = document.getElementById('p-rail');
    rail.hidden = S.phase === 'setup' || S.phase === 'end';
    const live = S.phase === 'turnEnd';
    if (!rail.hidden) rail.innerHTML = S.teams.map((t, i) => `<div class="slot ${i === cur() && !live ? 'now' : ''}">
        <span class="nm">${esc(t.name)}</span>
        ${editing ? adjBox('P', i, live ? t.score : (S.turnStart[i] ?? t.score), 1) : `<span class="sc">${live ? t.score : (S.turnStart[i] ?? t.score)}đ</span>`}
        <span class="lb">${cardsLeft(i)}</span></div>`).join('');
    const veil = document.getElementById('p-veil');
    if (hostPick) {
      const c = S.teams[cur()].cards;
      veil.innerHTML = `<div class="veil" role="dialog" aria-label="Người dẫn chọn lá"><div class="box">
        <div class="kicker">Chỉ người dẫn xem · tắt máy chiếu</div>
        <h2>${nm(cur())} giơ lá gì?</h2>
        <div class="row">
          <button class="btn btn-ok" onclick="P.useSecret('dbl')" ${c.dbl ? '' : 'disabled'}>Nhân đôi ×2${c.dbl ? '' : '<small>đã dùng</small>'}</button>
          <button class="btn btn-eat" onclick="P.useSecret('shield')" ${c.shield ? '' : 'disabled'}>Trừ đôi (khiên)${c.shield ? '' : '<small>đã dùng</small>'}</button>
        </div>
        <button class="ghost" onclick="P.closeHost()">Huỷ</button></div></div>`;
    } else if (showLog) {
      veil.innerHTML = `<div class="veil" role="dialog" aria-label="Sổ thư ký"><div class="box">
        <div class="kicker">Sổ thư ký</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Câu</th><th>Đội</th><th>Lý do</th><th class="num">Điểm</th></tr></thead>
          <tbody>${S.log.slice().reverse().map(l => `<tr><td>${l.turn}</td><td>${nm(l.team)}</td><td>${esc(l.why)}</td><td class="num"><b class="${l.delta > 0 ? 'pos' : l.delta < 0 ? 'neg' : ''}">${fmt(l.delta)}</b></td></tr>`).join('') || '<tr><td colspan="4" class="note">Chưa có khoản nào.</td></tr>'}</tbody>
        </table></div>
        <p class="note">Sổ ghi cả kết quả của câu đang chơi. Mở khi đã tắt máy chiếu.</p>
        <button class="btn btn-gold" onclick="P.log()">Đóng</button></div></div>`;
    } else veil.innerHTML = '';
  }
  act.names = () => (S.teams || []).map(t => t.name);
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= TRUYỀN BOM ================= */
const T = (() => {
  const KEYT = 'truyen-bom-v1';
  const WORDS = ['MỘT!', 'HAI!', 'BA!', 'BỐN!', 'NĂM!'];
  function fresh(){
    return { phase:'setup', mode:'team', names:['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5'], roster:'', secs:12, maxB:3, theme:'bomb',
      qText:SAMPLE_Q, questions:[], qi:0, curQ:null, showAns:false, holder:null, from:null, pickWhy:'warm', bombs:0,
      remaining:null, running:false, deadline:null, victims:{}, seen:[], passes:0, boomWhy:'', flash:'', armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYT)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
  if (S.phase === 'tick' && S.running) { S.running = false; S.remaining = Math.max(1000, S.remaining || S.secs * 1000); }
  let lastSec = null, editing = false, railKeys = [];

  const save = () => { try { localStorage.setItem(KEYT, JSON.stringify(S)); } catch(e) {} };
  const poison = () => S.theme === 'poison';
  const noun = () => poison() ? 'thuốc độc' : 'bom';
  const icon = () => poison() ? '🧪' : '💣';
  function nextQ(){ S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null; S.qi++; S.showAns = false; }
  function startTimer(ms){
    S.deadline = Date.now() + ms; S.remaining = ms; S.running = true; lastSec = null;
  }
  function stopTimer(){ if (S.running) S.remaining = Math.max(0, S.deadline - Date.now()); S.running = false; }

  function boom(why){
    stopTimer();
    S.boomWhy = why;
    S.victims[S.holder] = (S.victims[S.holder] || 0) + 1;
    S.phase = 'boom';
    poison() ? SFX.gulp() : SFX.boom();
    render();
  }

  // one loop for the whole game; only touches the timer elements while ticking
  setInterval(() => {
    if (S.phase !== 'tick' || !S.running) return;
    const rem = S.deadline - Date.now();
    S.remaining = rem;
    if (rem <= 0) { boom('Hết giờ'); return; }
    const sec = Math.ceil(rem / 1000);
    paintTimer(rem);
    if (sec !== lastSec) {
      lastSec = sec;
      if (sec <= 5) SFX.beep(sec === 1 ? 1320 : 880); else SFX.click();
      save();
    }
  }, 100);

  function paintTimer(rem){
    const total = S.secs * 1000, sec = Math.ceil(rem / 1000);
    const ring = document.getElementById('t-ring'), num = document.getElementById('t-num'), word = document.getElementById('t-word');
    if (!ring) return;
    const C = 2 * Math.PI * 88;
    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, rem / total)));
    ring.classList.toggle('hot', sec <= 5);
    num.textContent = sec;
    word.textContent = sec <= 5 && S.running ? WORDS[sec - 1] : '';
    word.classList.toggle('shout', sec <= 5 && S.running);
  }

  const act = {
    start(){
      const mode = document.querySelector('input[name="t-mode"]:checked').value;
      const names = [...document.querySelectorAll('[data-tname]')].map(el => el.value.trim()).filter(Boolean);
      if (mode === 'team' && names.length < 2) { document.getElementById('t-err').textContent = 'Cần ít nhất 2 nhóm.'; return; }
      S.mode = mode; S.names = names;
      S.roster = document.getElementById('t-roster').value;
      S.secs = Math.max(3, parseInt(document.getElementById('t-secs').value, 10) || 12);
      S.maxB = Math.max(1, parseInt(document.getElementById('t-maxb').value, 10) || 3);
      S.theme = document.querySelector('input[name="t-theme"]:checked').value;
      S.qText = document.getElementById('t-qtext').value;
      S.questions = parseQLines(S.qText, false);
      S.qi = 0; S.victims = {}; S.seen = []; S.passes = 0; S.holder = null;
      nextQ(); S.phase = 'warm'; render();
    },
    warmDone(){ S.pickWhy = 'warm'; S.from = null; S.phase = 'pick'; SFX.click(); render(); },
    choose(name){
      name = String(name).trim();
      if (!name) return;
      S.holder = name; S.bombs = 1; S.flash = '';
      if (!S.seen.includes(name)) S.seen.push(name);
      S.phase = 'ready'; SFX.flip(); render();
    },
    chooseTyped(){
      const v = document.getElementById('t-who').value.trim();
      if (!v) { document.getElementById('t-perr').textContent = 'Gõ tên người nhận trước nha.'; return; }
      act.choose(v);
    },
    pickIdx(i){ act.choose(act._opts[i]); },
    _opts:[],
    activate(){ nextQ(); startTimer(S.secs * 1000); S.phase = 'tick'; SFX.flip(); render(); },
    answer(right){
      if (S.phase !== 'tick') return;
      stopTimer();
      if (right) {
        S.passes++; S.from = S.holder; S.pickWhy = 'pass'; S.phase = 'pick'; SFX.coin(); render(); return;
      }
      S.bombs++;
      if (S.bombs >= S.maxB) { boom(`Ôm đủ ${S.maxB} quả ${noun()}`); return; }
      S.flash = `Sai rồi! Ôm thêm 1 quả ${noun()}`;
      SFX.bonk(); nextQ(); startTimer(S.secs * 1000); render();
    },
    pause(){
      if (S.phase !== 'tick') return;
      if (S.running) stopTimer(); else startTimer(Math.max(1000, S.remaining));
      render();
    },
    add5(){
      if (S.phase !== 'tick') return;
      if (S.running) S.deadline += 5000; else S.remaining += 5000;
      paintTimer(S.running ? S.deadline - Date.now() : S.remaining);
      SFX.click();
    },
    edit(){ editing = !editing; render(); },
    adj(i, d){
      const k = railKeys[i]; d = Math.round(Number(d)) || 0; if (k == null || !d) return;
      const v = Math.max(0, (S.victims[k] || 0) + d);
      if (v) S.victims[k] = v; else delete S.victims[k];
      render();
    },
    setv(i, v){ const k = railKeys[i], n = Math.round(Number(v)); if (k != null && Number.isFinite(n)) act.adj(i, n - (S.victims[k] || 0)); },
    afterBoom(){ S.from = S.holder; S.pickWhy = 'boom'; S.phase = 'pick'; render(); },
    end(){ S.phase = 'end'; SFX.fanfare(); render(); },
    showAns(){ S.showAns = true; render(); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){

      const keep = { mode:S.mode, names:S.names, roster:S.roster, secs:S.secs, maxB:S.maxB, theme:S.theme, qText:S.qText };
      S = Object.assign(fresh(), keep); render();
    }
  };

  /* ---------- views ---------- */
  const art = (big) => poison()
    ? `<div class="bottle ${big ? 'big' : ''}" aria-hidden="true"><span>☠</span></div>`

  const pile = () => `<div class="pile" aria-label="${S.bombs} quả ${noun()}">${Array.from({ length:S.maxB }, (_, i) => `<span class="${i < S.bombs ? '' : 'off'}">${icon()}</span>`).join('')}</div>`;
  const qCard = title => {

    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}

  }
  const vWarm = () => `<div class="kicker">Câu khởi động · không tính giờ</div>
    ${qCard('Mời một bạn xung phong trả lời')}

    <button class="btn btn-eat" onclick="T.warmDone()">Đã trả lời, chọn người nhận ${noun()} →</button>`;
  function vPick(){
    const title = S.pickWhy === 'warm' ? `Bạn xung phong gọi tên ai?`
      : S.pickWhy === 'pass' ? `<span class="team-name">${esc(S.from)}</span> trả lời đúng! Truyền ${noun()} cho ai?`
      : `<span class="team-name">${esc(S.from)}</span> chọn người cầm ${noun()} mới`;
    let opts = [];
    if (S.mode === 'team') opts = S.names;
    else {
      const roster = S.roster.split('\n').map(x => x.trim()).filter(Boolean);
      opts = roster.length ? roster : S.seen;
    }
    act._opts = opts;
    const chips = opts.length ? `<div class="grid-pick">${opts.map((o, i) => `<button class="chip" ${o === S.from && S.pickWhy === 'pass' ? 'disabled' : ''} onclick="T.pickIdx(${i})">${esc(o)}${S.victims[o] ? ` <small class="chip-sub">${icon()}×${S.victims[o]} lần dính</small>` : ''}</button>`).join('')}</div>` : '';
    const typed = S.mode === 'solo' ? `<div class="row heir"><label for="t-who">Tên người nhận<input id="t-who" placeholder="vd: Vy" onkeydown="if(event.key==='Enter')T.chooseTyped()"></label>

  const vReady = () => `${art(true)}

  function vTick(){
    return `<div class="tick-head">
        <div class="timer"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88"/><circle id="t-ring" class="bar" cx="100" cy="100" r="88"/></svg>
          <span id="t-num" class="tnum">${Math.ceil((S.remaining ?? S.secs * 1000) / 1000)}</span></div>
        <div class="tick-who"><div class="kicker">Đang cầm ${noun()}</div><div class="holder">${esc(S.holder)}</div>${pile()}</div>
      </div>
      <div id="t-word" class="countword" aria-live="assertive"></div>
      ${S.flash ? `<p class="flash">${esc(S.flash)}</p>` : ''}
      ${qCard(`Câu hỏi cho ${esc(S.holder)}`)}
      <div class="row">
        <button class="btn btn-ok" onclick="T.answer(true)">Đúng<small>Được truyền ${noun()}</small></button>
