      </div>
      <div class="row">
        <button class="ghost" onclick="T.pause()">${S.running ? '⏸ Tạm dừng' : '▶ Chạy tiếp'}</button>
        <button class="ghost" onclick="T.add5()">+5 giây</button>
      </div>`;
  }
  const vBoom = () => `<div class="${poison() ? 'gulp' : 'kaboom'}" aria-hidden="true">${poison() ? '☠️' : '💥'}</div>
    <h1><span class="team-name">${esc(S.holder)}</span> ${poison() ? 'trúng độc rồi!' : 'BÙM!'}</h1>
    <p class="lead">${esc(S.boomWhy)}. ${poison()
      ? (S.mode === 'team' ? 'Mỗi người trong nhóm uống 1/3 đến 1/2 chai nước, hoặc cả nhóm đồng ca một bài 🎤' : 'Phạt uống 1/2 chai nước 💧')
      : (S.mode === 'team' ? 'Cả nhóm đồng ca một bài, hoặc mỗi người nghĩ một câu khen thầy cô thật ngọt 🎤' : 'Tự tay chọc thủng quả bóng nào! 🎈')}</p>
    <div class="row">${plushBtn(S.holder)}${deckBtn('pen', S.holder)}</div>
    <div class="row"><button class="btn btn-gold" onclick="T.afterBoom()">${esc(S.holder)} chọn người tiếp →</button>
    <button class="btn btn-no" onclick="T.end()">Kết thúc trò chơi</button></div>`;
  function vEnd(){
    const list = Object.entries(S.victims).sort((a, b) => b[1] - a[1]);
    return `<div class="kicker">Tổng kết</div><h1>Bảng nạn nhân ${icon()}</h1>
      <p class="lead">${S.passes} lần truyền ${noun()} thành công.</p>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>${S.mode === 'team' ? 'Nhóm' : 'Bạn'}</th><th class="num">Số lần dính</th></tr></thead>
        <tbody>${list.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>`
        : `<p class="lead">Không ai dính! Câu hỏi dễ quá rồi 😅</p>`}
      <button class="btn btn-no" onclick="T.reset()">${S.armReset ? 'Bấm lần nữa để chơi ván mới' : 'Chơi ván mới'}</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, warm:vWarm, pick:vPick, ready:vReady, tick:vTick, boom:vBoom, end:vEnd };
    document.getElementById('t-stage').innerHTML = (V[S.phase] || vSetup)();
    if (S.phase === 'tick') paintTimer(S.running ? S.deadline - Date.now() : (S.remaining ?? S.secs * 1000));
    const st = document.getElementById('t-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      <button class="ghost" onclick="T.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      ${S.phase !== 'end' ? editBtn('T', editing) : ''}
      ${S.phase !== 'end' ? `<button class="ghost" onclick="T.end()">Kết thúc</button>` : ''}
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="T.reset()">${S.armReset ? 'Bấm lần nữa để xoá ván' : 'Ván mới'}</button>`;
    const rail = document.getElementById('t-rail');
    rail.hidden = S.phase === 'setup' || S.phase === 'end';
    if (!rail.hidden) {
      const keys = S.mode === 'team' ? S.names : Object.keys(S.victims);
      railKeys = keys;
      rail.innerHTML = keys.length ? keys.map((k, i) => `<div class="slot ${k === S.holder && ['ready','tick'].includes(S.phase) ? 'now' : ''}">
          <span class="nm">${esc(k)}</span>
          ${editing ? adjBox('T', i, S.victims[k] || 0, 1) : `<span class="sc">${S.victims[k] ? icon().repeat(Math.min(5, S.victims[k])) : '–'}</span>`}
          <span class="lb">${S.victims[k] ? `Dính ${S.victims[k]} lần` : 'Chưa dính'}</span></div>`).join('')
        : `<div class="slot"><span class="nm">Bảng nạn nhân</span><span class="lb">Chưa ai dính ${noun()}</span></div>`;
    }
  }
  act.pauseIfRunning = () => { if (S.phase === 'tick' && S.running) { stopTimer(); render(); } };
  act.ticking = () => S.phase === 'tick';
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= HỘP NHẠC ================= */
const M = (() => {
  const KEYM = 'hop-nhac-v1';
  const TWISTERS = `Buổi trưa ăn bưởi chua
Lúa nếp là lúa nếp làng, lúa lên lớp lớp lòng nàng lâng lâng
Nồi đồng nấu ốc, nồi đất nấu ếch
Luộc hột vịt lộn, luộc hột vịt lộn
Hôm qua qua nói qua mà qua không qua`;

  /* ---- built-in original music: a small generated lo-fi loop ---- */
  const Music = (() => {
    let ctx = null, master = null, timer = null, nextT = 0, step = 0, style = 'chill', audio = null, fileUrl = null, fileName = '';
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    const CH = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
    const PENTA = [72, 74, 76, 79, 81, 84];
    function ensure(){
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function note(t, f, len, type, gain, cutoff){
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = type; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = cutoff || 2400;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.08, len / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + len + 0.05);
    }
    function noise(t, len, freq, type, gain){
      const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * len), ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = b; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
      s.connect(f).connect(g).connect(master); s.start(t);
    }
    function kick(t){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g).connect(master); o.start(t); o.stop(t + 0.32);
    }
    function play(st, t){
      const fast = style === 'fast';
      const bar = Math.floor(st / 8), s = st % 8, ch = CH[bar % 4];
      if (s === 0) {
        ch.forEach(m => note(t, mf(m), fast ? 1.6 : 2.6, 'triangle', 0.05, 1400));
        note(t, mf(ch[0] - 12), fast ? 0.8 : 1.4, 'sine', 0.22, 600);
      }
      if (fast && s === 4) note(t, mf(ch[0] - 12), 0.5, 'sine', 0.2, 600);
      if (s === 0 || (fast ? s === 4 : s === 5)) kick(t);
      if (fast && (s === 2 || s === 6)) kick(t);
      if (s === 4) noise(t, 0.16, 1800, 'bandpass', 0.25);
      if (fast || s % 2 === 1) noise(t, 0.05, 8000, 'highpass', fast ? 0.09 : 0.06);
      if (Math.random() < (fast ? 0.5 : 0.38)) {
        const pool = PENTA.filter(p => ch.some(c => (p - c) % 12 === 0) || Math.random() < 0.5);
        note(t, mf(pool[Math.floor(Math.random() * pool.length)] || 76), fast ? 0.35 : 0.6, 'sine', 0.09, 3000);
      }
    }
    return {
      setStyle(v){ style = v; },
      setFile(file){
        if (fileUrl) URL.revokeObjectURL(fileUrl);
        fileUrl = URL.createObjectURL(file); fileName = file.name;
        audio = new Audio(fileUrl); audio.loop = true;
      },
      clearFile(){ if (fileUrl) URL.revokeObjectURL(fileUrl); fileUrl = null; fileName = ''; audio = null; },
      fileName: () => fileName,
      start(useFile){
        if (useFile && audio) { audio.play().catch(() => {}); return; }
        try { ensure(); } catch(e) { return; }
        master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
        nextT = ctx.currentTime + 0.05; step = 0;
        const spb = () => 60 / (style === 'fast' ? 128 : 84) / 2;
        timer = setInterval(() => {
          while (nextT < ctx.currentTime + 0.2) { play(step, nextT); nextT += spb(); step++; }
        }, 25);
      },
      stop(){
        if (audio && !audio.paused) audio.pause();
        if (timer) { clearInterval(timer); timer = null; }
        if (master && ctx) {
          const m = master; m.gain.cancelScheduledValues(ctx.currentTime);
          m.gain.setValueAtTime(m.gain.value, ctx.currentTime); m.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.04);
          setTimeout(() => { try { m.disconnect(); } catch(e) {} }, 200);
          master = null;
        }
      }
    };
  })();

  function fresh(){
    return { phase:'setup', mode:'question', letters:'a b c d e f g h i l m n o p r s t w', twisters:TWISTERS, qText:SAMPLE_Q,
      minS:8, maxS:25, source:'chill', yt:'', questions:[], qi:0, curQ:null, showAns:false, letter:null, penalty:null,
      next:'', who:'', round:0, right:0, wrong:0, log:[], armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYM)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
  if (S.phase === 'playing') S.phase = 'idle';
  if (S.source === 'file') S.source = 'chill';
  let stopTimer = null, editing = false;

  const save = () => { try { localStorage.setItem(KEYM, JSON.stringify(S)); } catch(e) {} };
  const lettersArr = () => S.letters.split(/[\s,]+/).map(x => x.trim()).filter(Boolean);
  const twisterArr = () => S.twisters.split('\n').map(x => x.trim()).filter(Boolean);
  function nextQ(){ S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null; S.qi++; S.showAns = false; }
  function ytOk(u){ return /^https?:\/\/(www\.|m\.|music\.)?(youtube\.com\/(watch\?|shorts\/|live\/|playlist\?)|youtu\.be\/)\S+$/i.test(u || ''); }
  const yt = () => S.source === 'youtube';
  function pickLetter(){
    const L = lettersArr(); if (!L.length) return 'e';
    let x; do { x = L[Math.floor(Math.random() * L.length)]; } while (L.length > 1 && x === S.letter);
    return x;
  }
  function pickPenalty(){
    const tw = twisterArr();
    const opts = [{ kind:'sing', text:S.source === 'file' || yt() ? 'Hát lại một câu trong bài vừa phát' : 'Hát một câu bất kì thật tình cảm' }];
    tw.forEach(t => opts.push({ kind:'twist', text:t }));
    opts.push({ kind:'plush', text:'Tạo dáng y chang gấu bông bị ném' });
    let p; do { p = opts[Math.floor(Math.random() * opts.length)]; } while (opts.length > 1 && S.penalty && p.text === S.penalty.text);
    return p;
  }

  const act = {
    start(){
      S.mode = document.querySelector('input[name="m-mode"]:checked').value;
      S.source = document.querySelector('input[name="m-src"]:checked').value;
      S.letters = document.getElementById('m-letters').value;
      S.twisters = document.getElementById('m-tw').value;
      S.qText = document.getElementById('m-qtext').value;
      const a = parseInt(document.getElementById('m-min').value, 10), b = parseInt(document.getElementById('m-max').value, 10);
      S.minS = Math.max(2, Number.isFinite(a) ? a : 8); S.maxS = Math.max(S.minS + 1, Number.isFinite(b) ? b : 25);
      S.yt = document.getElementById('m-yt').value.trim();
      if (S.yt && !/^https?:\/\//i.test(S.yt)) S.yt = 'https://' + S.yt;
      if (S.source === 'youtube' && !ytOk(S.yt)) { document.getElementById('m-err').textContent = 'Link YouTube chưa đúng. Dán link dạng youtube.com/watch?v=… hoặc youtu.be/…'; return; }
      if (S.source === 'file' && !Music.fileName()) { document.getElementById('m-err').textContent = 'Chọn file nhạc trước, hoặc dùng nhạc có sẵn.'; return; }
      if (S.mode === 'letter' && !lettersArr().length) { document.getElementById('m-err').textContent = 'Nhập ít nhất một chữ cái.'; return; }
      S.questions = parseQLines(S.qText, false);
      if (S.source !== 'file') Music.setStyle(S.source);
      S.qi = 0; S.round = 0; S.right = 0; S.wrong = 0; S.log = []; S.next = '';
      S.phase = 'idle'; render();
    },
    pickFile(input){
      const f = input.files && input.files[0];
      if (!f) return;
      Music.setFile(f);
      const r = document.querySelector('input[name="m-src"][value="file"]'); if (r) r.checked = true;
      document.getElementById('m-fname').textContent = `Đã chọn: ${f.name}`;
    },
    play(){
      if (!yt()) {
        if (S.source !== 'file') Music.setStyle(S.source);
        Music.start(S.source === 'file');
      }
      S.phase = 'playing'; S.who = ''; render();
      const ms = (S.minS + Math.random() * (S.maxS - S.minS)) * 1000;
      clearTimeout(stopTimer); stopTimer = setTimeout(act.stop, ms);
    },
    stop(){
      if (S.phase !== 'playing') return;
      clearTimeout(stopTimer);
      Music.stop(); SFX.scratch();
      if (yt()) { setTimeout(() => SFX.scratch(), 300); setTimeout(() => SFX.beep(1320), 650); }
      S.round++;
      if (S.mode === 'letter') S.letter = pickLetter(); else nextQ();
      S.phase = 'stopped'; render();
    },
    answer(right){
      const w = (document.getElementById('m-who') || {}).value || '';
      S.who = w.trim();
      S.log.push({ round:S.round, who:S.who, right, item:S.mode === 'letter' ? `Chữ ${S.letter.toUpperCase()}` : (S.curQ ? S.curQ.q : 'Câu trên slide') });
      if (right) { S.right++; S.phase = 'won'; SFX.fanfare(); }
      else { S.wrong++; S.penalty = pickPenalty(); S.phase = 'penalty'; SFX.bonk(); }
      render();
    },
    reroll(){ S.penalty = pickPenalty(); SFX.click(); render(); },
    edit(){ editing = !editing; render(); },
    adj(i, d){
      d = Math.round(Number(d)) || 0; if (!d) return;
      const key = ['right', 'wrong', 'round'][i]; S[key] = Math.max(0, S[key] + d); render();
    },
    setv(i, v){ const key = ['right', 'wrong', 'round'][i], n = Math.round(Number(v)); if (Number.isFinite(n)) act.adj(i, n - S[key]); },
    nextUp(){
      const v = (document.getElementById('m-next') || {}).value || '';
      S.next = v.trim(); S.phase = 'idle'; render();
    },
    back(){ S.next = ''; S.phase = 'idle'; render(); },
    showAns(){ S.showAns = true; render(); },
    leave(){ if (S.phase === 'playing') { clearTimeout(stopTimer); Music.stop(); S.phase = 'idle'; render(); } },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      act.leave();
      const keep = { mode:S.mode, letters:S.letters, twisters:S.twisters, qText:S.qText, minS:S.minS, maxS:S.maxS, source:S.source === 'file' ? 'chill' : S.source };
      S = Object.assign(fresh(), keep); Music.clearFile(); render();
    }
  };

  /* ---------- views ---------- */
  const vinyl = spin => `<div class="musicbox ${spin ? 'on' : ''}" aria-hidden="true">
      <div class="vinyl"><span></span></div>
      <div class="eq">${'<i></i>'.repeat(9)}</div>
    </div>`;
  const qCard = title => {
    const q = S.curQ;
    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'M')}</div>`
      : `<div class="qcard"><div class="kicker">${title}</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };
  function vSetup(){
    return `${vinyl(false)}
      <div class="kicker">Trò chơi thuyết trình · Dành cho lớp lì</div>
      <h1>Hộp nhạc</h1>
      <div class="setup">
        <div class="panel">
          <h3>Nhạc</h3>
          <div class="seg-pick" role="radiogroup" aria-label="Nguồn nhạc">
            <label><input type="radio" name="m-src" value="chill" ${S.source === 'chill' ? 'checked' : ''}> 🎧 Chill có sẵn</label>
            <label><input type="radio" name="m-src" value="fast" ${S.source === 'fast' ? 'checked' : ''}> ⚡ Nhanh có sẵn</label>
            <label><input type="radio" name="m-src" value="file" ${S.source === 'file' ? 'checked' : ''}> 📁 File của cô</label>
            <label><input type="radio" name="m-src" value="youtube" ${S.source === 'youtube' ? 'checked' : ''}> ▶️ Link YouTube</label>
          </div>
          <label for="m-yt">Link YouTube<input id="m-yt" type="url" value="${esc(S.yt)}" placeholder="https://www.youtube.com/watch?v=…" oninput="if(this.value.trim()){const r=document.querySelector('input[name=m-src][value=youtube]');if(r)r.checked=true}"></label>
          <p class="note">YouTube mở ở tab riêng và cô tự bấm phát. Tới lúc dừng, trang game kêu “xẹt” thật to và hiện NHẠC DỪNG, cô chỉ cần tạm dừng YouTube.</p>
          <label for="m-file">Chọn file nhạc trên máy (mp3, m4a…), ví dụ bài ABC cô tự thu<input id="m-file" type="file" accept="audio/*" onchange="M.pickFile(this)"></label>
          <p class="note" id="m-fname">${Music.fileName() ? `Đã chọn: ${esc(Music.fileName())}` : 'Nhạc có sẵn do máy tự chơi, không lời.'}</p>
          <div class="two">
            <label for="m-min">Dừng sớm nhất (giây)<input id="m-min" type="number" min="2" value="${S.minS}"></label>
            <label for="m-max">Dừng muộn nhất (giây)<input id="m-max" type="number" min="3" value="${S.maxS}"></label>
          </div>
          <p class="note">Máy dừng nhạc ngẫu nhiên trong khoảng này, người dẫn cũng không biết trước.</p>
        </div>
        <div class="panel">
          <h3>Nhạc dừng thì…</h3>
          <div class="seg-pick" role="radiogroup" aria-label="Kiểu thử thách">
            <label><input type="radio" name="m-mode" value="question" ${S.mode === 'question' ? 'checked' : ''}> Trả lời câu hỏi</label>
            <label><input type="radio" name="m-mode" value="letter" ${S.mode === 'letter' ? 'checked' : ''}> Bốc chữ cái</label>
          </div>
          <label for="m-letters">Chữ cái để bốc (cách nhau bằng dấu cách)<input id="m-letters" value="${esc(S.letters)}"></label>
          <p class="note">Bốc chữ cái: người bị gọi liệt kê từ đã học bắt đầu bằng chữ đó và nói nghĩa.</p>
          <label for="m-tw">Câu nói nhanh để phạt (mỗi dòng một câu)<textarea id="m-tw" spellcheck="false" style="min-height:120px">${esc(S.twisters)}</textarea></label>
        </div>
        <div class="panel span2">
          <h3>Câu hỏi</h3>
          <label for="m-qtext">Mỗi dòng: câu hỏi | đáp án. Dòng bắt đầu bằng &gt;&gt; là đoạn văn đi kèm các câu bên dưới. Để trống nếu chiếu bằng slide Canva.
            <textarea id="m-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>
        </div>
      </div>
      <p class="note" id="m-err" role="alert"></p>
      <button class="btn btn-eat" onclick="M.start()">Mở hộp nhạc 🎵</button>`;
  }
  const vIdle = () => `${vinyl(false)}
    <div class="kicker">Lượt ${S.round + 1}</div>
    <h2>${S.next ? `<span class="team-name">${esc(S.next)}</span> giơ tay đầu tiên!` : 'Bạn đầu dãy giơ tay đầu tiên'}</h2>
    <p class="lead">Nhạc chạy thì lần lượt giơ tay rồi hạ xuống, người sau giơ ngay khi người trước hạ. Nhạc dừng lúc ai đang giơ tay thì người đó trả lời!</p>
    ${yt() ? `<div class="ytbox">
        <a class="btn btn-gold" href="${esc(S.yt)}" target="_blank" rel="noopener">Mở bài trên YouTube ↗</a>
        <p class="note">1. Mở bài và bấm phát trên YouTube. 2. Quay lại tab này, bấm “Bắt đầu đếm”.</p>
      </div>` : ''}
    <button class="btn btn-eat" onclick="M.play()">${yt() ? '⏱ Bắt đầu đếm' : '▶ Bật nhạc'}</button>`;
  const vPlaying = () => `${vinyl(true)}
    <h1>Giơ tay nối tiếp!</h1>
    <p class="lead">Nhanh lên, nhạc có thể dừng bất cứ lúc nào 👀</p>
    ${yt() ? '<p class="note">Nhạc đang phát trên tab YouTube. Nghe tiếng “xẹt” là dừng!</p>' : ''}
    <button class="btn btn-no" onclick="M.stop()">⏹ Dừng ngay</button>`;
  function vStopped(){
    const ch = S.mode === 'letter'
      ? `<div class="bigletter">${esc(S.letter.toUpperCase())}</div>
         <p class="lead">Liệt kê các từ đã học bắt đầu bằng chữ <b>“${esc(S.letter)}”</b> và nói nghĩa của từ.</p>`
      : qCard('Câu hỏi cho bạn đang giơ tay');
    return `<h1 class="halt">NHẠC DỪNG!</h1>
      ${yt() ? '<p class="flash">Người dẫn tạm dừng YouTube nha ⏸</p>' : ''}
      <p class="lead">Ai đang giơ tay? Đứng lên nào!</p>
      ${ch}
      <div class="row heir"><label for="m-who">Tên bạn trả lời (không bắt buộc)<input id="m-who" placeholder="vd: Khánh"></label></div>
      <div class="row"><button class="btn btn-ok" onclick="M.answer(true)">Đúng 🎁</button><button class="btn btn-no" onclick="M.answer(false)">Sai</button></div>`;
  }
  const vWon = () => `<div class="kaboom" aria-hidden="true">🎁</div>
    <h1>${S.who ? `<span class="team-name">${esc(S.who)}</span> được quà!` : 'Được quà!'}</h1>
    <p class="lead">Được quyền chỉ định bạn sẽ giơ tay đầu tiên khi nhạc bật lại. Cả lớp sẵn sàng nha!</p>
    <div class="row">${deckBtn('gift', S.who)}</div>
    <div class="row heir"><label for="m-next">Bạn được chỉ định<input id="m-next" placeholder="vd: Vy ngồi bàn cuối" onkeydown="if(event.key==='Enter')M.nextUp()"></label>
    <button class="btn btn-gold" onclick="M.nextUp()">Chốt, bật nhạc tiếp →</button></div>`;
  function vPenalty(){
    const p = S.penalty;
    return `<div class="kicker">${S.who ? esc(S.who) + ' bị phạt' : 'Hình phạt'}</div>
      <div class="slip bad"><span class="slip-no">${p.kind === 'twist' ? 'Nói nhanh 3 lần' : p.kind === 'plush' ? 'Tạo dáng' : 'Hát'}</span><span class="slip-t">${esc(p.text)}</span>
      ${p.kind === 'twist' ? '<span class="slip-d">Nói không vấp thì quá bá khí 💪</span>' : ''}</div>
      <div class="row">${p.kind === 'plush' ? `<button class="btn btn-eat" data-n="${esc(S.who)}" onclick="Plush.open(this.dataset.n)">🧸 Bắt đầu ném gấu</button>` : plushBtn(S.who)}<button class="ghost" onclick="M.reroll()">🎲 Đổi hình phạt khác</button>${deckBtn('pen', S.who)}</div>
      <button class="btn btn-gold" onclick="M.back()">Xong, chơi tiếp →</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, idle:vIdle, playing:vPlaying, stopped:vStopped, won:vWon, penalty:vPenalty };
    document.getElementById('m-stage').innerHTML = (V[S.phase] || vSetup)();
    const st = document.getElementById('m-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      <button class="ghost" onclick="M.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật hiệu ứng' : '🔊 Hiệu ứng'}</button>
      ${editBtn('M', editing)}
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="M.reset()">${S.armReset ? 'Bấm lần nữa để về cài đặt' : 'Cài đặt lại'}</button>`;
    const rail = document.getElementById('m-rail');
    rail.hidden = S.phase === 'setup';
    if (!rail.hidden) {
      const recent = S.log.slice(-3).reverse().map(l => `${l.who ? esc(l.who) : 'Ẩn danh'} ${l.right ? '🎁' : '😵'}`).join(' · ') || 'Chưa có ai';
      rail.innerHTML = `<div class="slot"><span class="lb">Đã dừng nhạc</span>${editing ? adjBox('M', 2, S.round, 1) : `<span class="sc">${S.round} lần</span>`}</div>
        <div class="slot"><span class="lb">Được quà</span>${editing ? adjBox('M', 0, S.right, 1) : `<span class="sc pos">${S.right}</span>`}</div>
        <div class="slot"><span class="lb">Bị phạt</span>${editing ? adjBox('M', 1, S.wrong, 1) : `<span class="sc neg">${S.wrong}</span>`}</div>
        <div class="slot"><span class="lb">Gần đây</span><span class="nm">${recent}</span></div>`;
    }
  }
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0 && S.mode === 'question', left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= ĐỨC VUA CHỌN HIỀN TÀI ================= */
const K = (() => {
  const KEYK = 'duc-vua-v1';
  const GIFTS = `Ngọc tỷ truyền quốc | phần quà xịn nhất | 1
Bảo vật trấn cung | phần quà xịn thứ hai | 1
Gia vị cuộc sống | củ tỏi và trái ớt | 3
Chân dung mỹ nam tuyệt sắc | poster in hình người nổi tiếng | 2
Lộc vua ban | một viên kẹo | 4`;
  const OPEN = [
    { cmd:'Mời cả lớp đứng dậy!', sub:'Ai đang ngồi đứng lên hết nha' },
    { cmd:'Giơ hai tay lên trời!', sub:'' },
    { cmd:'Đưa hai tay ra trước mặt!', sub:'' },
    { cmd:'Buông cả hai tay!', sub:'' },
    { cmd:'Cất điện thoại, gập máy tính!', sub:'Chuẩn bị tinh thần nào' },
    { cmd:'Hơi cúi người về phía trước…', sub:'Cúi xuống một chút thôi, chờ hiệu lệnh' },
    { cmd:'CÁC ÁI KHANH BÌNH THÂN!', sub:'Hôm nay Trẫm đến đây để tuyển chọn nhân tài cho đất nước', royal:true }
  ];
  function fresh(){
    return { phase:'setup', giftText:GIFTS, qText:SAMPLE_Q, questions:[], qi:0, curQ:null, showAns:false, step:0,
      pool:[], gift:null, opened:false, who:'', scholars:[], eunuchs:[], rosterText:'', roster:[], king:null, scores:{}, lastKing:null, armReset:false };
  }
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEYK)); } catch(e) {}
  if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);

  const save = () => { try { localStorage.setItem(KEYK, JSON.stringify(S)); } catch(e) {} };
  function nextQ(){ S.curQ = S.questions.length ? S.questions[S.qi % S.questions.length] : null; S.qi++; S.showAns = false; }
  function parseGifts(t){
    return t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [fancy, real, cnt] = l.split('|').map(x => (x || '').trim());
      return { fancy, real:real || fancy, left:Math.max(1, parseInt(cnt, 10) || 1) };
    }).filter(g => g.fancy);
  }
  const giftsLeft = () => S.pool.reduce((a, g) => a + g.left, 0);
  const whoName = () => S.who || 'Ái khanh';
  const kingMode = () => S.roster && S.roster.length >= 2;
  const ranked = () => Object.entries(S.scores).sort((a, b) => b[1] - a[1]);

  const act = {
    start(){
      S.giftText = document.getElementById('k-gifts').value;
      S.qText = document.getElementById('k-qtext').value;
      S.pool = parseGifts(S.giftText);
      S.questions = parseQLines(S.qText, false);
      S.rosterText = document.getElementById('k-roster').value;
      S.roster = [...new Set(S.rosterText.split('\n').map(x => x.trim()).filter(Boolean))];
      S.qi = 0; S.scholars = []; S.eunuchs = []; S.step = 0; S.king = null; S.scores = {};
      S.phase = 'open'; SFX.click(); render();
    },
    step(){
      if (S.step < OPEN.length - 1) {
        S.step++;
        if (OPEN[S.step].royal) { SFX.gong(); setTimeout(SFX.fanfare, 700); } else SFX.click();
      } else { S.phase = 'decree'; SFX.flip(); }
      render();
    },
    skipOpen(){ S.phase = 'decree'; render(); },
    begin(){
      if (kingMode() && !S.king) { S.phase = 'crown'; render(); return; }
      if (kingMode()) { S.who = ''; S.phase = 'pickAK'; render(); return; }
      nextQ(); S.who = ''; S.phase = 'question'; SFX.flip(); render();
    },
    crown(name){
      if (name === undefined) name = S.roster[Math.floor(Math.random() * S.roster.length)];
      S.king = name; S.lastKing = null; S.who = '';
      S.phase = 'pickAK'; SFX.gong(); setTimeout(SFX.fanfare, 600); render();
    },
    choose(name){
      if (name === undefined) { const pool = S.roster.filter(x => x !== S.king); name = pool[Math.floor(Math.random() * pool.length)]; }
      S.who = name; nextQ(); S.phase = 'question'; SFX.flip(); render();
    },
    chooseIdx(i){ act.choose(act._opts[i]); },
    crownIdx(i){ act.crown(S.roster[i]); },
    _opts:[],
    answer(right){
      if (!kingMode()) S.who = ((document.getElementById('k-who') || {}).value || '').trim();
      if (right && kingMode()) {
        S.scores[S.who] = (S.scores[S.who] || 0) + 10;
        S.scholars.push(S.who);
        S.lastKing = S.king; S.king = S.who;
        const bag = [];
        S.pool.forEach((g, i) => { for (let k = 0; k < g.left; k++) bag.push(i); });
        if (bag.length) { const i = bag[Math.floor(Math.random() * bag.length)]; S.pool[i].left--; S.gift = { fancy:S.pool[i].fancy, real:S.pool[i].real }; }
        else S.gift = null;
        S.opened = false; S.phase = 'throne'; SFX.gong(); setTimeout(SFX.fanfare, 600);
        render(); return;
      }
      if (right) {
        S.scholars.push(whoName());
        const bag = [];
        S.pool.forEach((g, i) => { for (let k = 0; k < g.left; k++) bag.push(i); });
        if (bag.length) { const i = bag[Math.floor(Math.random() * bag.length)]; S.pool[i].left--; S.gift = { fancy:S.pool[i].fancy, real:S.pool[i].real }; }
        else S.gift = null;
        S.opened = false; S.phase = 'reward'; SFX.fanfare();
      } else {
        S.eunuchs.push(whoName());
        S.phase = 'eunuch'; SFX.gong();
      }
      render();
    },
    openGift(){ S.opened = true; SFX.flip(); setTimeout(SFX.coin, 300); render(); },
    next(){ act.begin(); },
    toReward(){ S.phase = 'reward'; SFX.flip(); render(); },
    end(){ S.phase = 'end'; SFX.gong(); setTimeout(SFX.fanfare, 700); render(); },
    showAns(){ S.showAns = true; render(); },
    mute(){ muted = !muted; try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {} render(); if (!muted) SFX.click(); },
    reset(){
      if (!S.armReset) { S.armReset = true; render(); setTimeout(() => { S.armReset = false; render(); }, 3500); return; }
      const keep = { giftText:S.giftText, qText:S.qText, rosterText:S.rosterText };
      S = Object.assign(fresh(), keep); render();
    }
  };

  /* ---------- views ---------- */
  const crown = big => `<div class="crown ${big ? 'big' : ''}" aria-hidden="true">👑</div>`;
  const scroll = (title, body) => `<div class="scroll"><div class="scroll-k">${title}</div>${body}</div>`;

  /* throne room: the honoured student on the throne, the rest of the leaderboard kneeling around */

  function throneSVG(hero){

    return `<svg class="throne" viewBox="0 0 1000 620" role="img" aria-label="${esc(hero)} ngồi trên ngai vàng, cả lớp quỳ xung quanh">

        <rect x="-100" y="20" width="34" height="80" rx="8" fill="#7a1414" stroke="#f0c460" stroke-width="4"/>

        <rect x="-90" y="70" width="180" height="40" rx="8" fill="#7a1414" stroke="#f0c460" stroke-width="4"/>
        <path d="M-46 72 Q-46 -12 0 -12 Q46 -12 46 72 Z" fill="#fff3d6"/>

        <path d="M-34 -78 L-34 -112 L-17 -94 L0 -122 L17 -94 L34 -112 L34 -78 Z" fill="#f2c94c" stroke="#a87412" stroke-width="3"/>
        <circle cx="0" cy="-104" r="5" fill="#d8384f"/>
      </g>
      ${kneel}
      <g transform="translate(500,92)">
        <rect x="-150" y="-36" width="300" height="70" rx="8" fill="rgba(20,4,4,.85)" stroke="#f0c460" stroke-width="3"/>

  function vThrone(){

  const vDecree = () => `${scroll('Thánh chỉ', `
      <p>Phụng thiên thừa vận, Hoàng đế chiếu viết:</p>
      <p>Trẫm sẽ ra đề. Ái khanh nào trả lời đúng, Trẫm <b>ban thưởng</b> một món bảo vật bốc ngẫu nhiên từ kho.</p>
      <p>Ái khanh nào trả lời sai, Trẫm tuyển ngay vào cung làm <b>thái giám</b>, lên đứng cạnh Trẫm cầm sách quạt hầu cho tới hết buổi.</p>
      <p>Khâm thử!</p>`)}
    <button class="btn btn-gold" onclick="K.begin()">Trẫm ra đề thứ nhất</button>`;
  function vQuestion(){
    const q = S.curQ;
    const body = q ? `<div data-a="${esc(q.a || '')}">${qHTML(q, S.showAns)}</div>${ansBlock(q, S.showAns, 'K')}`

      <div class="row"><button class="btn btn-ok" onclick="K.answer(true)">Đúng<small>Ban thưởng</small></button>

        <div class="row">${deckBtn('gift', whoName())}</div>
        <div class="row"><button class="btn btn-gold" onclick="K.next()">Đề tiếp theo</button><button class="btn btn-no" onclick="K.end()">Bãi triều</button></div>`

  function vEnd(){

        <tbody>${ranked().map(([k, v], i) => `<tr><td>${i + 1}</td><td><b>${esc(k)}</b>${k === S.king ? ' 👑' : ''}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <p class="lead">Trẫm rất hài lòng. Các ái khanh lui!</p>
      <button class="btn btn-no" onclick="K.reset()">${S.armReset ? 'Bấm lần nữa để mở triều mới' : 'Mở triều mới'}</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, open:vOpen, decree:vDecree, crown:vCrown, pickAK:vPickAK, throne:vThrone, question:vQuestion, reward:vReward, eunuch:vEunuch, end:vEnd };

    if (!rail.hidden) rail.innerHTML = `${kingMode() && S.king ? `<div class="slot"><span class="lb">Đức vua đang trị vì</span><span class="sc">👑 ${esc(S.king)}</span><span class="nm small">${S.scores[S.king] || 0} điểm</span></div>` : ''}
      <div class="slot"><span class="lb">Hiền tài</span><span class="sc pos">${S.scholars.length}</span><span class="nm small">${S.scholars.slice(-3).map(esc).join(', ') || '–'}</span></div>

  }
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= Hình phạt: tạo dáng gấu bông (dùng chung) ================= */
const Plush = (() => {
  let st = null, who = '', timer = null, left = 0;
  const POSE_SECS = 10;
  function el(){ return document.getElementById('plush-veil'); }
  function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
  function draw(){
    const v = el(); if (!v) return;
    if (!st) { v.innerHTML = ''; return; }
    let body = '';
    if (st === 'ready') body = `
      <div class="plush big" aria-hidden="true">🧸</div>
      <div class="kicker">Hình phạt${who ? ' cho ' + esc(who) : ''}</div>
      <h2>Ném gấu bông, tạo dáng y chang!</h2>
      <p class="lead">Nhóm thuyết trình ném một con gấu bông xuống sàn hoặc lên bàn. Gấu nằm kiểu gì, ${who ? esc(who) : 'người bị phạt'} phải nằm, ngồi, giơ tay… đúng kiểu đó. Cả lớp làm giám khảo!</p>
      <div class="row"><button class="btn btn-eat" onclick="Plush.toss()">🧸 Ném!</button><button class="ghost" onclick="Plush.close()">Đóng</button></div>`;
    if (st === 'count') body = `<div class="plush flying" aria-hidden="true">🧸</div><div class="countword shout">${left}</div><h2>Chuẩn bị ném…</h2>`;
    if (st === 'pose') body = `
      <div class="plush landed" aria-hidden="true">🧸</div>
      <h1 class="halt">TẠO DÁNG!</h1>
      <div class="money ${left <= 3 ? 'neg' : 'pos'}">${left}</div>
      <p class="lead">Giống hệt con gấu vừa rơi, càng giống càng được tha 😆</p>
      <button class="ghost" onclick="Plush.judge()">Xong sớm, chấm luôn</button>`;
    if (st === 'judge') body = `
      <div class="plush big" aria-hidden="true">🧸</div>
      <h2>Cả lớp chấm: giống chưa?</h2>
      <div class="row"><button class="btn btn-ok" onclick="Plush.pass()">Giống y chang 👏</button>
      <button class="btn btn-no" onclick="Plush.again()">Chưa giống, làm lại!</button></div>
      <button class="ghost" onclick="Plush.close()">Đóng</button>`;
    if (st === 'done') body = `<div class="plush big" aria-hidden="true">🧸</div><h1 class="royal">Quá đạt!</h1>
      <p class="lead">${who ? esc(who) + ' được tha. ' : ''}Cho một tràng pháo tay nào 👏</p>
      <button class="btn btn-gold" onclick="Plush.close()">Quay lại trò chơi</button>`;
    v.innerHTML = `<div class="veil plush-veil" role="dialog" aria-label="Hình phạt tạo dáng gấu bông"><div class="box">${body}</div></div>`;
  }
  function run(secs, onTick, onEnd){
    stopTimer(); left = secs; draw();
    timer = setInterval(() => {
      left--;
      if (left <= 0) { stopTimer(); onEnd(); return; }
      onTick(); draw();
    }, 1000);
  }
  return {
    open(name){ who = name || ''; st = 'ready'; draw(); SFX.click(); },
    toss(){

        ${editing ? adjBox('C', i, t.pos, 1) + (t.fired ? `<button class="ghost" onclick="C.rehire(${i})">Tuyển lại</button>` : '') : ''}</div>
      ${withSvg ? lineSVG(t, i, i === S.active) : ''}
    </div>`).join('');
  }

  /* ---------- views ---------- */
  const qCard = title => {
    const q = S.curQ;
    return q ? `<div class="qcard" data-a="${esc(q.a || '')}"><div class="kicker">${title}</div>${qHTML(q, S.showAns)}
      ${ansBlock(q, S.showAns, 'C')}</div>`
      : `<div class="qcard"><div class="kicker">${title}</div><p class="qtext">Chuyển sang slide Canva để chiếu câu hỏi.</p></div>`;
  };
  function vSetup(){
    const names = [...S.names];
    return `<div class="factory-hero" aria-hidden="true">🏭</div>
      <div class="kicker">Trò chơi thuyết trình · Quy trình sản xuất</div>
      <h1>Băng chuyền</h1>
      <div class="setup">
        <div class="panel">
          <h3>Các dây chuyền</h3>
          ${names.map((v, i) => `<label for="c-nm${i}">Dây chuyền ${i + 1}${i >= 1 ? ' (không bắt buộc)' : ''}<input id="c-nm${i}" data-cname value="${esc(v)}" placeholder="Bỏ trống nếu không dùng"></label>`).join('')}
          <label for="c-secs">Giây trả lời mỗi câu<input id="c-secs" type="number" min="5" value="${S.secs}"></label>
          <p class="note">Mỗi nhóm một dây chuyền. Chơi cả lớp thì để một dây chuyền.</p>
        </div>
        <div class="panel">
          <h3>Công đoạn</h3>
          <div class="row" style="justify-content:flex-start">${Object.keys(PRESETS).map(k => `<button type="button" class="ghost" onclick="C.preset('${k}')">Mẫu: ${PRESETS[k].t}</button>`).join('')}</div>
          <label for="c-steps">Các công đoạn theo thứ tự, mỗi dòng một bước. Có thể dùng luôn các bước trong bài Process đang học.
            <textarea id="c-steps" spellcheck="false" style="min-height:200px">${esc(S.stepsText)}</textarea></label>
          <label for="c-extra">Công đoạn “phạt” được chèn thêm khi trả lời sai
            <textarea id="c-extra" spellcheck="false" style="min-height:110px">${esc(S.extraText)}</textarea></label>
        </div>
        <div class="panel span2">
          <h3>Câu hỏi</h3>
          <label for="c-qtext">Mỗi dòng: câu hỏi | đáp án. Dòng bắt đầu bằng &gt;&gt; là đoạn văn đi kèm các câu bên dưới. Để trống nếu chiếu bằng slide Canva.
            <textarea id="c-qtext" spellcheck="false">${esc(S.qText)}</textarea></label>
          <ul class="rules">
            <li><b>Đúng:</b> sản phẩm chạy qua 1 công đoạn. Qua hết là xuất xưởng 🚚</li>
            <li><b>Sai hoặc hết giờ:</b> bốc ngẫu nhiên một hình phạt: nối thêm 2 đoạn băng chuyền, chèn thêm 1 công đoạn, hoặc đếm giờ nhanh hơn 5 giây.</li>
            <li><b>Sai đủ ${MAX_WRONG} lần:</b> cả dây chuyền bị <b>sa thải</b>.</li>
          </ul>
        </div>
      </div>
      <p class="note" id="c-err" role="alert"></p>
      <button class="btn btn-eat" onclick="C.start()">Khởi động nhà máy ⚙️</button>`;
  }
  const vReady = () => `<div class="kicker">Lượt ${S.turn + 1}</div>
    <h1><span class="team-name">${nm(S.active)}</span> vào ca!</h1>
    <p class="lead">${S.teams[S.active].secs} giây cho câu này. Đúng thì băng chuyền chạy, sai là bị phạt.</p>
    <button class="btn btn-eat" onclick="C.go()">▶ Chạy băng chuyền</button>`;
  const vQuestion = () => `<div class="timebar"><div class="timebar-fill" id="c-bar"></div><span id="c-time" class="ttag">${S.teams[S.active].secs}s</span></div>
    ${qCard(`Câu hỏi cho ${nm(S.active)}`)}
    <div class="row"><button class="btn btn-ok" onclick="C.answer(true)">Đúng<small>Băng chuyền chạy</small></button>
    <button class="btn btn-no" onclick="C.answer(false)">Sai<small>Bị phạt</small></button></div>
    <div class="row"><button class="ghost" onclick="C.pause()">${S.running ? '⏸ Tạm dừng' : '▶ Chạy tiếp'}</button><button class="ghost" onclick="C.add5()">+5 giây</button></div>`;
  function vResult(){
    const t = S.teams[S.active], L = S.last;
    if (L.right) return `<div class="kicker">${nm(S.active)}</div><h1 class="pos">Băng chuyền chạy! ✅</h1>
      <p class="lead">Sản phẩm vừa qua công đoạn <b>${esc(L.step)}</b>. Còn ${t.steps.length - t.pos} công đoạn nữa là xuất xưởng.</p>
      <div class="row">${deckBtn('gift', t.name)}</div>
      <button class="btn btn-gold" onclick="C.next()">Dây chuyền tiếp →</button>`;
    const p = PEN[L.pen];
    return `<div class="kicker">${nm(S.active)} ${L.timeout ? 'hết giờ' : 'trả lời sai'} · lỗi ${t.wrong}/${MAX_WRONG}</div>
      <div class="slip bad"><span class="slip-no">Phạt dây chuyền</span><span class="slip-t">${p.t}</span><span class="slip-d">${p.d}</span></div>
      <div class="row"><span class="note">Người dẫn muốn đổi hình phạt?</span>${Object.keys(PEN).map(k => `<button class="ghost ${k === L.pen ? 'on-edit' : ''}" onclick="C.repick('${k}')" ${k === 'fast' && t.secs <= 10 && L.pen !== 'fast' ? 'disabled' : ''}>${PEN[k].t}</button>`).join('')}</div>
      ${t.wrong === MAX_WRONG - 1 ? '<p class="flash">⚠️ Sai thêm 1 lần nữa là cả dây chuyền bị sa thải!</p>' : ''}
      <button class="btn btn-gold" onclick="C.next()">Dây chuyền tiếp →</button>`;
  }
  const vFired = () => `<div class="kaboom" aria-hidden="true">📦💥</div>
    <h1 class="neg">SA THẢI!</h1>
    <p class="lead">${nm(S.active)} sai ${MAX_WRONG} lần, ùn hàng cả xưởng. Cả dây chuyền nghỉ việc từ hôm nay 😵</p>
    <div class="row">${plushBtn(S.teams[S.active].name)}</div>
    <button class="btn btn-gold" onclick="C.next()">Dây chuyền tiếp →</button>`;
  const vShipped = () => `<div class="kaboom" aria-hidden="true">🚚</div>
    <h1><span class="team-name">${nm(S.active)}</span> xuất xưởng!</h1>
    <p class="lead">Sản phẩm đã qua đủ ${S.teams[S.active].steps.length} công đoạn và lên xe giao hàng.</p>
    <div class="row">${alive().length ? '<button class="btn btn-gold" onclick="C.next()">Chơi tiếp tranh hạng</button>' : ''}<button class="btn btn-no" onclick="C.end()">Tổng kết</button></div>`;
  function vEnd(){
    const order = S.teams.map((t, i) => ({ t, i, pct:t.pos / t.steps.length })).sort((a, b) => (b.t.done - a.t.done) || (a.t.fired - b.t.fired) || (b.pct - a.pct));
    const top = order[0];
    return `<div class="kicker">Tổng kết ca làm</div>
      <h1>🏆 <span class="team-name">${esc(top.t.name)}</span></h1>
      <div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Dây chuyền</th><th class="num">Công đoạn</th><th class="num">Lỗi</th><th>Tình trạng</th></tr></thead>
      <tbody>${order.map((o, k) => `<tr><td>${k + 1}</td><td><b>${esc(o.t.name)}</b></td><td class="num">${o.t.pos}/${o.t.steps.length}</td><td class="num">${o.t.wrong}</td><td>${o.t.done ? '✅ Xuất xưởng' : o.t.fired ? '❌ Sa thải' : '⏳ Đang làm'}</td></tr>`).join('')}</tbody></table></div>
      <div class="row">${plushBtn(order[order.length - 1].t.name)}</div>
      <button class="btn btn-no" onclick="C.reset()">${S.armReset ? 'Bấm lần nữa để mở ca mới' : 'Mở ca mới'}</button>`;
  }

  function render(){
    save();
    const V = { setup:vSetup, ready:vReady, question:vQuestion, result:vResult, fired:vFired, shipped:vShipped, end:vEnd };
    document.getElementById('c-stage').innerHTML = (V[S.phase] || vSetup)();
    if (S.phase === 'question') paintTimer(S.running ? S.deadline - Date.now() : (S.remaining ?? S.teams[S.active].secs * 1000));
    const st = document.getElementById('c-status');
    st.innerHTML = S.phase === 'setup' ? '' : `
      ${S.phase !== 'end' ? `<span class="pill on">Lượt ${S.turn + 1}</span>` : ''}
      <button class="ghost" onclick="C.mute()" aria-pressed="${muted}">${muted ? '🔇 Bật âm thanh' : '🔊 Âm thanh'}</button>
      <button class="ghost" onclick="C.undo()" ${undo.length ? '' : 'disabled'}>↶ Hoàn tác</button>
      ${S.phase !== 'end' ? editBtn('C', editing) : ''}
      ${S.phase !== 'end' ? '<button class="ghost" onclick="C.end()">Tổng kết</button>' : ''}
      <button class="ghost" onclick="C.view()">🎥 Góc nhìn gốc</button>
      <button class="ghost ${S.armReset ? 'warn' : ''}" onclick="C.reset()">${S.armReset ? 'Bấm lần nữa để xoá ca' : 'Ca mới'}</button>`;
    const fl = document.getElementById('c-floor');
    fl.hidden = S.phase === 'setup';
    if (!fl.hidden) {
      let lines = document.getElementById('c-lines');
      if (!lines) { fl.innerHTML = '<div id="c-3d" class="c3d"></div><div id="c-lines" class="floor"></div>'; lines = document.getElementById('c-lines'); }
      const use3d = typeof F3 !== 'undefined' && F3.ready();
      document.getElementById('c-3d').hidden = !use3d;
      lines.className = use3d ? 'floor compact-grid' : 'floor';
      lines.innerHTML = floor(!use3d);
      if (use3d) F3.update(S);
    }
  }
  act.names = () => (S.teams || []).map(t => t.name);
  act.ticking = () => S.phase === 'question';
  act.qInfo = () => { const qs = S.questions || []; return { live:S.phase !== 'setup' && S.phase !== 'end' && qs.length > 0, left:qs.length - S.qi, all:qs, sample:qs.slice(-25) }; };
  act.addQs = list => { S.questions.push(...list); const t = String(S.qText || '').trim(); S.qText = (t ? t + '\n' : '') + list.map(q => (q.lv ? q.lv + ' | ' : '') + q.q + ' | ' + q.a).join('\n'); save(); };
  return Object.assign(act, { render });
})();

/* ================= Bộ thẻ Quà & Phạt (dùng chung mọi trò) ================= */
const Deck = (() => {
  const KEYK2 = 'bo-the-qua-phat-v1';
  const BASE = [
    { id:'sos', ic:'🆘', t:'Thẻ SOS', d:'Cứu nguy một lần: khi bí, giơ thẻ để nhóm hoặc cô trợ giúp.', k:'gift' },
    { id:'hw', ic:'📚', t:'Homework delay 24h', d:'Được gia hạn bài tập về nhà thêm 24 giờ.', k:'gift' },
    { id:'seat', ic:'🪑', t:'Đổi chỗ ngồi', d:'Được chọn chỗ ngồi mới trong buổi học hôm nay.', k:'gift' },
    { id:'partner', ic:'🤝', t:'Chọn partner', d:'Được tự chọn bạn cặp đôi khi ghép cặp.', k:'gift' },
    { id:'retry', ic:'🔁', t:'Làm lại 1 lần', d:'Được thử lại câu vừa rồi thêm một lần nữa.', k:'gift' },
    { id:'skip', ic:'⏭️', t:'Bỏ qua câu này', d:'Được bỏ qua câu hỏi hiện tại mà không bị trừ.', k:'gift' },
    { id:'bonus', ic:'➕', t:'Cộng thêm điểm', d:'Được cộng thêm điểm cho đội mình.', k:'gift' },
    { id:'freeze', ic:'🧊', t:'Đóng băng', d:'Khoan! Đứng yên như tượng trong 5 giây.', k:'pen' },
    { id:'hint', ic:'💡', t:'Xin gợi ý', d:'Được xin thêm một gợi ý cho câu hỏi.', k:'gift' },
    { id:'time', ic:'⏱️', t:'Thêm thời gian', d:'Được xin thêm 5–10 giây suy nghĩ.', k:'gift' },
    { id:'candy', ic:'🍬', t:'Một cái kẹo', d:'Nhận ngay một cái kẹo!', k:'gift' },
    { id:'call', ic:'📞', t:'Gọi bạn trả lời thay', d:'Được chỉ định một bạn trả lời thay mình.', k:'gift' }
  ];
  let cfg = { off:{}, custom:'' };
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(KEYK2)) || {}); } catch(e) {}
  const saveCfg = () => { try { localStorage.setItem(KEYK2, JSON.stringify(cfg)); } catch(e) {} };

  let phase = null, mode = 'all', who = '', card = null, lastId = null, left = 0, timer = null;
  let amt = null, team = null, applied = '', hintOn = false, err = '';

  function customCards(){
    return cfg.custom.split('\n').map(l => l.trim()).filter(Boolean).map((l, i) => {
      const [ic, t, d, k] = l.split('|').map(x => (x || '').trim());
      return { id:'c' + i, ic:ic || '🎴', t:t || 'Thẻ tự tạo', d:d || '', k:/phạt|phat|pen/i.test(k || '') ? 'pen' : 'gift', custom:true };
    });
  }
  const all = () => BASE.concat(customCards());
  const pool = () => all().filter(c => !cfg.off[c.id] && (mode === 'all' || c.k === mode));

  /* ---- links into the game that is open right now ---- */
  function hooks(){
    const g = document.documentElement.dataset.game;
    const H2 = {
      joker:{ names:() => (S.teams || []).map(t => t.name), add:(i, d) => A.adj(i, d), unit:'điểm', amts:[10, 20] },
      banh:{ names:B.names, add:B.adj, unit:'tỷ', amts:[10, 20, 30] },
      daugia:{ names:D.names, add:D.adj, unit:'tỷ', amts:[10, 20, 50] },
      quyennang:{ names:P.names, add:P.adj, unit:'điểm', amts:[1, 3, 5] },
      haitrinh:{ names:H.names, add:H.adj, unit:'bước', amts:[1, 2] },
      bangchuyen:{ names:C.names, add:C.adj, unit:'công đoạn', amts:[1, 2] }
    };
    const h = H2[g];
    return h && h.names().length ? h : null;
  }
  function liveTimer(){
    const g = document.documentElement.dataset.game;
    if (g === 'bom' && T.ticking()) return s => { T.add5(); if (s === 10) T.add5(); };
    if (g === 'bangchuyen' && C.ticking()) return s => { C.add5(); if (s === 10) C.add5(); };
    return null;
  }
  function answerOnScreen(){
    const el = [...document.querySelectorAll('.app:not([hidden]) [data-a]')].find(e => e.dataset.a && e.offsetParent !== null);
    return el ? el.dataset.a : '';
  }
  function hintOf(a){
    return a.split(/\s+/).map(w => { let seen = false; return [...w].map(ch => /[\p{L}\p{N}]/u.test(ch) ? (seen ? '_' : (seen = true, ch)) : ch).join(' '); }).join('     ');
  }

  /* ---- views ---- */
  const back = cls => `<div class="dk-back ${cls || ''}"><span>🎴</span></div>`;
  function face(c){
    return `<div class="dk-card ${c.k}">
      <span class="dk-badge">${c.k === 'pen' ? 'PHẠT' : 'QUÀ'}</span>
      <span class="dk-ic">${esc(c.ic)}</span>
      <span class="dk-t">${esc(c.t)}</span>
      <span class="dk-d">${esc(c.d)}</span>
      ${who ? `<span class="dk-who">Trao cho: ${esc(who)}</span>` : ''}
    </div>`;
  }
  function actions(c){
    if (c.id === 'freeze') return `<button class="btn btn-eat" onclick="Deck.freeze()">❄️ Bắt đầu đóng băng 5 giây</button>`;
    if (c.id === 'time') {
      const tm = liveTimer();
      return tm ? `<div class="row"><button class="btn btn-gold" onclick="Deck.time(5)">+5 giây</button><button class="btn btn-gold" onclick="Deck.time(10)">+10 giây</button></div>${applied ? `<p class="flash">${esc(applied)}</p>` : ''}`
        : `<p class="note">Đồng hồ của trò này đang không chạy. Cô cho thêm 5–10 giây bằng miệng nha.</p>`;
    }
    if (c.id === 'bonus') {
      const h = hooks();
      if (!h) return `<p class="note">Trò này không tính điểm theo đội. Cô cộng điểm theo cách của lớp nha.</p>`;
      if (amt === null) amt = h.amts[0];
      const names = h.names();
      if (team === null && who) { const k = names.indexOf(who); if (k >= 0) team = k; }
      return `<div class="dk-pick">
        <div class="row">${h.amts.map(v => `<button class="chip ${amt === v ? 'sel' : ''}" onclick="Deck.amt(${v})">+${v} ${h.unit}</button>`).join('')}</div>
        <div class="grid-pick">${names.map((n, i) => `<button class="chip ${team === i ? 'sel' : ''}" onclick="Deck.team(${i})">${esc(n)}</button>`).join('')}</div>
        <button class="btn btn-gold" onclick="Deck.give()" ${team === null ? 'disabled' : ''}>Cộng +${amt} ${h.unit}${team !== null ? ' cho ' + esc(names[team]) : ''}</button>
        ${applied ? `<p class="flash">${esc(applied)}</p>` : ''}</div>`;
    }
    if (c.id === 'hint') {
      const a = answerOnScreen();
      if (!a) return `<p class="note">Không thấy đáp án trên màn hình. Cô gợi ý thêm bằng lời nha.</p>`;
      return hintOn ? `<div class="dk-hint" aria-label="Gợi ý">${esc(hintOf(a))}</div>` : `<button class="btn btn-gold" onclick="Deck.hint()">💡 Hiện gợi ý chữ cái đầu</button>`;
    }
    return '';
  }
  function vReady(){
    return `<div class="kicker">Bộ thẻ quà & phạt</div>
      <h2>Bốc một lá nào!</h2>
      <div class="dk-stack" aria-hidden="true">${back('s1')}${back('s2')}${back('s3')}</div>
      <div class="seg-pick" role="radiogroup" aria-label="Loại thẻ">
        ${[['all', 'Tất cả'], ['gift', '🎁 Chỉ quà'], ['pen', '🧊 Chỉ phạt']].map(([v, l]) => `<label><input type="radio" name="dk-mode" value="${v}" ${mode === v ? 'checked' : ''} onchange="Deck.mode(this.value)"> ${l}</label>`).join('')}
      </div>
      <label for="dk-who" class="dk-wholbl">Trao cho ai (không bắt buộc)<input id="dk-who" value="${esc(who)}" placeholder="Tên bạn hoặc tên đội" oninput="Deck.who(this.value)"></label>
      <p class="note">${pool().length} lá đang bật trong bộ.</p>
      ${err ? `<p class="flash">${esc(err)}</p>` : ''}
      <div class="row"><button class="btn btn-eat" onclick="Deck.draw()">🎴 Bốc thẻ</button><button class="ghost" onclick="Deck.settings()">⚙️ Chỉnh bộ thẻ</button><button class="ghost" onclick="Deck.close()">Đóng</button></div>`;
  }
  const vShuffle = () => `<div class="kicker">Đang xáo bài…</div><div class="dk-stack shuffling" aria-hidden="true">${back('s1')}${back('s2')}${back('s3')}</div>`;
  const vCard = () => `${face(card)}${actions(card)}
    <div class="row"><button class="ghost" onclick="Deck.draw()">🎴 Bốc lá khác</button><button class="btn btn-gold" onclick="Deck.close()">Xong</button></div>`;
  const vFreeze = () => `<div class="dk-frost">
      <div class="dk-ice" aria-hidden="true">🧊</div>
      <h1 class="dk-freeze-t">ĐÓNG BĂNG!</h1>
      <div class="money">${left}</div>
      <p class="lead">${who ? esc(who) + ' đứng' : 'Đứng'} yên như tượng, không được nhúc nhích!</p></div>`;
  const vThaw = () => `<div class="dk-ice" aria-hidden="true">💧</div><h1 class="royal">Rã đông!</h1>
    <p class="lead">Hết 5 giây, được cử động rồi nha.</p>
    <div class="row"><button class="ghost" onclick="Deck.draw()">🎴 Bốc lá khác</button><button class="btn btn-gold" onclick="Deck.close()">Quay lại trò chơi</button></div>`;
  function vSettings(){

  }
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };

  return {
    open(m, name){ mode = m || 'all'; who = name || ''; err = ''; phase = 'ready'; draw(); SFX.click(); },
    close(){ stop(); phase = null; draw(); },
    back(){ phase = 'ready'; draw(); },
    mode(m){ mode = m; err = ''; draw(); },
    who(v){ who = v; },
    draw(){
      const p = pool();
      if (!p.length) { err = 'Bộ thẻ đang trống với lựa chọn này. Bật thêm thẻ trong ⚙️ Chỉnh bộ thẻ.'; phase = 'ready'; draw(); return; }
      stop(); err = ''; applied = ''; hintOn = false; amt = null; team = null;
      let c; do { c = p[Math.floor(Math.random() * p.length)]; } while (p.length > 1 && c.id === lastId);

    },
    freeze(){

        SFX.beep(left === 1 ? 1320 : 660); draw();

    },
    time(s){ const tm = liveTimer(); if (!tm) return; tm(s); applied = `Đã cộng thêm ${s} giây vào đồng hồ.`; SFX.coin(); draw(); },
    amt(v){ amt = v; draw(); },
    team(i){ team = i; draw(); },
    give(){

      h.add(team, amt); applied = `Đã cộng +${amt} ${h.unit} cho ${h.names()[team]}.`; SFX.coin(); draw();
    },
    hint(){ hintOn = true; SFX.flip(); draw(); },
    settings(){ phase = 'settings'; draw(); },
    toggle(id, on){ if (on) delete cfg.off[id]; else cfg.off[id] = true; saveCfg(); },
    saveSettings(){ cfg.custom = document.getElementById('dk-custom').value; saveCfg(); phase = 'ready'; draw(); SFX.coin(); }

})();
