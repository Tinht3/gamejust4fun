<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Trò Chơi Thuyết Trình</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Alegreya+SC:wght@800&family=Playfair+Display:wght@800;900&family=Noto+Serif:wght@800;900&family=Lora:wght@700&family=Bangers&family=Mali:wght@700&family=Anton&family=Bungee&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: one-screen card table — status strip on top, a single stage in the middle, team rail along the bottom */
:root{
  --tint:251,245,230; --felt:#13402f; --felt-deep:#0a2a1f; --felt-hi:#1d5c46; --felt-line:rgba(var(--tint),.14);
  --ivory:#fbf5e6; --ink:#2a1a10; --ruby:#d8384f; --ruby-deep:#a8243a;
  --gold:#f2c35e; --mint:#86dbaf; --muted:#a9c7b9; --sponge:#e8b56c; --sponge-dark:#c98f45;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background-color:var(--felt);background-image:radial-gradient(ellipse at 50% 25%,var(--felt-hi),var(--felt) 55%,var(--felt-deep));color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.app{min-height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1;letter-spacing:.01em}
.brand b{color:var(--gold)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid var(--felt-line);color:var(--muted)}
.pill.on{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.ghost{font:inherit;font-size:.85rem;font-weight:600;color:var(--ivory);background:transparent;border:1px solid var(--felt-line);padding:6px 12px;border-radius:999px;cursor:pointer}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
.ghost.warn{border-color:var(--ruby);color:var(--ruby)}

main{flex:1;display:grid;place-items:center;min-height:0}
.stage{width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,6vw,4.4rem)}
h2{font-size:clamp(1.6rem,3.6vw,2.6rem)}
.kicker{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}
.lead{font-size:clamp(1rem,1.8vw,1.25rem);color:var(--muted);max-width:60ch;margin:0}
.team-name{color:var(--gold)}

.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2.4vw,1.6rem);padding:14px 30px;border-radius:999px;border:3px solid transparent;cursor:pointer;line-height:1.1;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.ghost:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-eat{background:var(--ruby);color:var(--ivory);border-color:var(--ruby-deep);box-shadow:0 6px 0 var(--ruby-deep)}
.btn-no{background:transparent;color:var(--ivory);border-color:var(--ivory)}
.btn-ok{background:var(--mint);color:var(--ink);box-shadow:0 6px 0 #4f9f78}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #b58a2c}
.btn small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;opacity:.85;margin-top:2px}

.fan{display:flex;justify-content:center;height:130px;margin-bottom:-6px}
.pc{width:76px;aspect-ratio:5/7;border-radius:10px;background:var(--ivory);box-shadow:0 10px 22px rgba(0,0,0,.35);display:grid;place-items:center;margin:0 -14px;transform-origin:50% 120%;font-size:2rem;line-height:1}
.pc.red{color:var(--ruby)}
.pc.joker{color:var(--ruby);z-index:2;transform:translateY(-14px);align-content:center;gap:4px}
.pc.joker span{color:var(--gold)}
.pc.joker b{font-family:var(--display);font-size:.8rem;letter-spacing:.08em}
.fan .pc:nth-child(1){transform:rotate(-24deg)}
.fan .pc:nth-child(2){transform:rotate(-12deg) translateY(-6px)}
.fan .pc:nth-child(4){transform:rotate(12deg) translateY(-6px)}
.fan .pc:nth-child(5){transform:rotate(24deg)}

.qcard{width:100%;background:var(--ivory);color:var(--ink);border-radius:20px;padding:clamp(20px,4vw,40px);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px;text-align:left}
.qcard .kicker{color:var(--ruby-deep)}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.15;margin:0}
.ans{font-weight:700;font-size:1.2rem;color:var(--ruby-deep)}
.linkbtn{font:inherit;font-weight:600;color:var(--ruby-deep);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;align-self:flex-start}

.money{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,10vw,6.5rem);line-height:1;font-variant-numeric:tabular-nums}
.neg{color:var(--ruby)}.pos{color:var(--mint)}
.seal{width:140px;height:96px;position:relative;background:var(--ivory);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.seal::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 49%,rgba(42,26,16,.18) 50%,transparent 51%),linear-gradient(20deg,transparent 49%,rgba(42,26,16,.18) 50%,transparent 51%);border-radius:8px}
.seal::after{content:"MẬT";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:56px;height:56px;border-radius:50%;background:var(--ruby);color:var(--ivory);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;box-shadow:0 0 0 4px var(--ruby-deep)}

.grid-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
.chip{font:inherit;font-weight:700;font-size:1.05rem;color:var(--ivory);background:rgba(var(--tint),.06);border:2px solid var(--felt-line);border-radius:14px;padding:14px 12px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip.sel{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chip:disabled{opacity:.35;cursor:not-allowed}

.guess-list{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.guess-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(0,0,0,.18)}
.guess-row .opts{display:flex;flex-wrap:wrap;gap:8px}
.guess-row .chip{padding:8px 14px;font-size:.95rem;border-radius:999px}
.guess-name{font-weight:700}
@media (max-width:560px){.guess-row{grid-template-columns:1fr}}

.card{width:150px;aspect-ratio:5/7;max-width:100%;border-radius:14px;background:var(--ivory);color:var(--ruby);box-shadow:0 16px 36px rgba(0,0,0,.4);display:grid;place-items:center;position:relative;animation:flip .8s ease-out}
.card .j{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:.08em}
.card .s{position:absolute;font-size:1.3rem;color:var(--gold)}
.card .s.a{top:10px;left:12px}.card .s.b{bottom:10px;right:12px;transform:rotate(180deg)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}

.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:left}
th,td{padding:10px 12px;border-bottom:1px solid var(--felt-line)}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(var(--tint),.1)}
.note{font-size:.95rem;color:var(--muted);margin:0}
.verdict{padding:14px 18px;border-radius:14px;background:rgba(0,0,0,.2);width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.verdict p{margin:0}

.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.slot{padding:10px 14px;border-radius:14px;border:2px solid var(--felt-line);background:rgba(0,0,0,.16);display:flex;flex-direction:column;gap:2px;min-width:0}
.slot.now{border-color:var(--gold);background:rgba(242,195,94,.12)}
.slot.done{opacity:.6}
.slot .nm{font-weight:700;overflow-wrap:anywhere}
.slot .sc{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.slot .lb{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* setup */
.setup{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left}
.panel{background:rgba(0,0,0,.2);border:1px solid var(--felt-line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0}
label{font-size:.85rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,textarea{font:inherit;color:var(--ivory);background:rgba(0,0,0,.25);border:1px solid var(--felt-line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:transparent}
textarea{min-height:230px;resize:vertical;font-size:.92rem;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--ivory)}
.span2{grid-column:1/-1}
@media (max-width:720px){.setup{grid-template-columns:1fr}}

/* host peek */
.veil{position:fixed;inset:0;background:rgba(5,20,15,.92);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.veil .box{width:100%;max-width:620px;max-height:100%;overflow:auto;background:var(--felt);border:2px solid var(--gold);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}

.hd-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.cake{width:min(300px,62vw);height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.c-top{fill:#fff3dc}.c-front{fill:var(--sponge)}.c-side{fill:var(--sponge-dark)}.c-cream{fill:#fff3dc}.c-jam{fill:var(--ruby)}.c-berry{fill:var(--ruby)}.c-leaf{fill:var(--mint)}.c-seed{fill:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%}
.tile{font:inherit;color:var(--ivory);text-align:left;cursor:pointer;background:rgba(0,0,0,.22);border:2px solid var(--felt-line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tile-art{height:120px;align-self:center;margin-bottom:8px}
.cake-mini{width:160px}
.fan.small{display:flex;height:120px;align-items:center}
.fan.small .pc{width:64px;font-size:1.6rem}
.fan.small .pc:nth-child(1){transform:rotate(-14deg)}
.fan.small .pc:nth-child(2){transform:translateY(-10px)}
.fan.small .pc:nth-child(3){transform:rotate(14deg)}
.tile-k{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.tile-t{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05}
.tile-d{color:var(--muted)}
.chip-sub{display:block;font-weight:500;font-size:.8rem;opacity:.75}
.slip{width:min(440px,100%);background:var(--ivory);color:var(--ink);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 16px 36px rgba(0,0,0,.4);border-left:10px solid var(--gold);animation:flip .7s ease-out;position:relative}
.slip::after{content:"";position:absolute;left:-10px;top:50%;width:20px;height:20px;border-radius:50%;background:var(--felt);transform:translate(-50%,-50%)}
.slip.good{border-left-color:#3fa572}.slip.bad{border-left-color:var(--ruby)}
.slip-no{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ruby-deep)}
.slip-t{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05}
.slip-d{font-size:1.05rem}
.slip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:rgba(var(--tint),.06);font-size:.88rem;color:var(--muted)}
.mini b{color:var(--ivory)}
.heir{align-items:flex-end}
.heir label{min-width:160px;text-align:left}
.mbox{width:150px;height:130px;position:relative;margin-top:14px;background:var(--ruby);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 -10px 0 var(--ruby-deep);display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.mbox::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:var(--gold)}
.mbox::after{content:"";position:absolute;left:-8px;right:-8px;top:-14px;height:30px;border-radius:8px;background:var(--ruby);box-shadow:inset 0 -6px 0 var(--ruby-deep);background-image:linear-gradient(90deg,transparent calc(50% - 11px),var(--gold) calc(50% - 11px),var(--gold) calc(50% + 11px),transparent calc(50% + 11px))}
.mbox span{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:3.4rem;color:var(--ivory);text-shadow:0 3px 0 var(--ruby-deep)}
.mbox.small{width:110px;height:92px;display:grid;margin-top:22px;animation:none}
.mbox.small span{font-size:2.4rem}
.ship{font-size:5rem;line-height:120px;height:120px}
.wheel-wrap{position:relative;width:min(380px,82vw);aspect-ratio:1;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px var(--gold),0 18px 40px rgba(0,0,0,.45)}
.wheel-pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--ivory);z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.chest{font-size:5rem;line-height:1;animation:bob 2s ease-in-out infinite}
#h-board{overflow-x:auto}
.sea{display:flex;flex-direction:column;gap:6px;min-width:520px}
.sea-row{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(6,1fr);gap:6px;align-items:center;padding:4px;border-radius:12px}
.sea-row.now{background:rgba(242,195,94,.14);box-shadow:inset 0 0 0 2px var(--gold)}
.sea-head span{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.sea-name{font-weight:700;overflow-wrap:anywhere;padding-left:6px}
.cell{height:48px;border-radius:10px;background:rgba(0,0,0,.2);border:1px dashed var(--felt-line);display:grid;place-items:center;font-size:1.2rem}
.cell.goal{background:rgba(242,195,94,.18);border:1px solid var(--gold)}
.token{font-size:1.9rem;line-height:1;animation:flip .5s ease-out}
.pcards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pcard{width:74px;aspect-ratio:5/7;border-radius:10px;background:var(--ivory);color:var(--ink);display:grid;place-items:center;align-content:center;gap:2px;font-size:1.8rem;line-height:1;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.pcard small{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pcard.back{background:var(--ruby);color:var(--ivory);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(var(--tint),.12) 6px 12px)}
.pcards.big .pcard{width:88px}
.tile-art.pcards{height:120px;align-items:center;flex-wrap:nowrap}
.tile-art.pcards .pcard{width:60px}
.mini-cards{display:inline-flex;gap:8px;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ivory)}
.mini-cards .used{opacity:.25;text-decoration:line-through}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ivory)}
.check input{width:auto}
.bomb{position:relative;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#5a5f66,#1b1d21 62%);box-shadow:0 14px 26px rgba(0,0,0,.45);margin-top:26px;animation:bob 2.4s ease-in-out infinite}
.bomb.big{width:150px;height:150px}
.bomb::before{content:"";position:absolute;left:50%;top:-14px;width:30px;height:22px;transform:translateX(-50%);background:#33363b;border-radius:5px}
.bomb .fuse{position:absolute;left:50%;top:-34px;width:34px;height:26px;border:5px solid var(--sponge);border-color:var(--sponge) transparent transparent var(--sponge);border-radius:50% 0 0 0}
.bomb .spark{position:absolute;left:calc(50% + 26px);top:-44px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff6c9,var(--gold) 45%,var(--ruby) 80%,transparent 82%);animation:spark .25s infinite alternate}
@keyframes spark{to{transform:scale(1.35) rotate(40deg)}}
.tile-art.bomb{width:84px;height:84px;align-self:center;margin:34px 0 10px}
.bottle{position:relative;width:96px;height:130px;margin-top:30px;border-radius:22px 22px 26px 26px;background:linear-gradient(to top,#5fd38a 0 58%,rgba(var(--tint),.18) 58%);border:4px solid var(--ivory);display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.bottle::before{content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:34px;height:30px;border:4px solid var(--ivory);border-bottom:none;background:var(--sponge-dark)}
.bottle span{font-size:2.6rem;color:var(--ink)}
.bottle.big{width:116px;height:156px}
.pile{display:flex;gap:6px;font-size:2rem}
.pile .off{opacity:.18;filter:grayscale(1)}
.tick-head{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.timer{position:relative;width:190px;height:190px;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:rgba(var(--tint),.12);stroke-width:14}
.timer .bar{fill:none;stroke:var(--mint);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .2s}
.timer .bar.hot{stroke:var(--ruby)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:4.4rem;font-variant-numeric:tabular-nums}
.tick-who{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.holder{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1;color:var(--gold);overflow-wrap:anywhere}
.countword{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;color:var(--ruby);min-height:1em}
.countword.shout{animation:shout .9s ease-out infinite}
@keyframes shout{0%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:.85}}
.flash{margin:0;font-weight:700;color:var(--ivory);background:var(--ruby);padding:8px 16px;border-radius:999px}
.kaboom,.gulp{font-size:clamp(6rem,18vw,10rem);line-height:1;animation:kaboom .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes kaboom{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.seg-pick{display:flex;flex-wrap:wrap;gap:8px}
.seg-pick label{flex-direction:row;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--felt-line);color:var(--ivory);cursor:pointer}
.seg-pick input{width:auto;accent-color:var(--gold)}
.seg-pick label:has(input:checked){border-color:var(--gold);background:rgba(242,195,94,.14)}
.musicbox{display:flex;align-items:center;gap:22px}
.vinyl{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,#15171a 0 3px,#22252a 3px 5px);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.vinyl span{width:46px;height:46px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 16px var(--ruby),inset 0 0 0 19px var(--gold)}
.musicbox.on .vinyl{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;align-items:flex-end;gap:5px;height:90px}
.eq i{display:block;width:10px;height:18%;border-radius:4px;background:var(--mint)}
.eq i:nth-child(3n){background:var(--gold)}.eq i:nth-child(4n){background:var(--ruby)}
.musicbox.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}.eq i:nth-child(4){animation-delay:-.15s!important}
.eq i:nth-child(5){animation-delay:-.45s!important}.eq i:nth-child(6){animation-delay:-.75s!important}.eq i:nth-child(7){animation-delay:-.2s!important}
.eq i:nth-child(8){animation-delay:-.55s!important}.eq i:nth-child(9){animation-delay:-.05s!important}
@keyframes eq{from{height:12%}to{height:100%}}
.tile-art.musicbox.small{height:120px;justify-content:center}
.tile-art.musicbox.small .vinyl{width:100px;height:100px}
.bigletter{font-family:var(--display);font-weight:800;font-size:clamp(6rem,20vw,11rem);line-height:.9;color:var(--gold);text-shadow:0 8px 0 rgba(0,0,0,.3)}
.halt{color:var(--ruby);animation:kaboom .5s cubic-bezier(.2,1.6,.4,1)}
input[type=file]{padding:8px;font-size:.88rem}
.ytbox{display:flex;flex-direction:column;align-items:center;gap:8px}
a.btn{text-decoration:none;display:inline-block}
.crown{font-size:4.6rem;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:bob 3s ease-in-out infinite}
.crown.big{font-size:6rem}
.tile-art.crown{font-size:5rem;line-height:120px;height:120px;animation:none}
.command{font-size:clamp(2.6rem,7.5vw,5.4rem)}
.royal{font-size:clamp(2.8rem,8vw,6rem);color:var(--gold);text-shadow:0 5px 0 var(--ruby-deep);animation:kaboom .8s cubic-bezier(.2,1.6,.4,1)}
.scroll{position:relative;width:100%;background:var(--ivory);color:var(--ink);padding:clamp(22px,4vw,40px) clamp(22px,5vw,52px);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:left;display:flex;flex-direction:column;gap:10px;border-top:14px solid var(--ruby);border-bottom:14px solid var(--ruby)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:10px;background:var(--gold);border-radius:6px}
.scroll::before{top:-22px}.scroll::after{bottom:-22px}
.scroll p{margin:0;font-size:clamp(1rem,1.9vw,1.25rem)}
.scroll-k{font-family:var(--display);font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.2em;color:var(--ruby-deep);text-align:center}
.scroll .qtext{font-size:clamp(1.5rem,3.6vw,2.6rem)}
.scroll .ans{font-size:1.2rem}
.giftname{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4.8rem);line-height:1.05;color:var(--gold);text-wrap:balance}
.nm.small{font-weight:500;font-size:.85rem;color:var(--muted)}
.photobox{display:flex;flex-direction:column;gap:10px}
.pb-drop{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px dashed var(--gold);border-radius:14px;background:rgba(242,195,94,.07);color:var(--ivory);font-size:.92rem;line-height:1.4;cursor:default}
.pb-drop.over{background:rgba(242,195,94,.2)}
.pb-drop:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pb-ico{font-size:1.8rem}
.pb-hint{color:var(--muted)}
.pb-pick{display:inline;color:var(--gold);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.pb-thumbs{display:flex;flex-wrap:wrap;gap:8px}
.pb-thumbs:empty{display:none}
.pb-th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--felt-line)}
.pb-th img{width:100%;height:100%;object-fit:cover}
.pb-x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:none;background:var(--ruby);color:var(--ivory);font-weight:800;cursor:pointer;line-height:1}
.pb-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pb-actions .btn{font-size:1rem;padding:10px 20px}
.pb-msg{min-height:0}
.pb-msg:empty{display:none}
.adj{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;max-width:100%}
.adj-b{font:inherit;font-weight:700;font-size:.85rem;color:var(--ivory);background:rgba(var(--tint),.08);border:1px solid var(--felt-line);border-radius:8px;padding:5px 7px;cursor:pointer;min-width:38px}
.adj-b:hover{border-color:var(--gold);color:var(--gold)}
.adj-in{width:4.6em;padding:5px 4px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.ghost.on-edit{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.sea-name .adj{margin-top:4px}

/* ===== per-game themes: each game re-skins the same tokens ===== */
body{min-height:100%;background-attachment:fixed}
/* Joker's Call: red-and-black casino, streamers, dice, chips */
:root[data-game="joker"]{--felt:#3a0306; --felt-deep:#070000; --felt-hi:#8e0b12; --felt-line:rgba(255,200,120,.2);
  --ivory:#fff4ec; --ink:#1a0204; --ruby:#e3262e; --ruby-deep:#9c1118; --gold:#f4c048; --mint:#78d6a0; --muted:#e0b6ae;
  --display:"Bungee","Baloo 2",system-ui,sans-serif}
:root[data-game="joker"] body{background-image:radial-gradient(ellipse at 45% 45%,#060000 0%,#1c0103 35%,#5c0409 70%,#9b0c14 100%)}
:root[data-game="joker"] h1,:root[data-game="joker"] h2,:root[data-game="joker"] .brand{font-weight:400;letter-spacing:.02em;color:#fff;text-shadow:-2px -2px 0 var(--ruby),2px -2px 0 var(--ruby),-2px 2px 0 var(--ruby),2px 2px 0 var(--ruby),0 6px 0 #5a0006}
:root[data-game="joker"] .team-name,:root[data-game="joker"] .brand b{color:var(--gold)}
:root[data-game="joker"] .btn{font-weight:400}
:root[data-game="joker"] .money{font-weight:400}
:root[data-game="joker"] .panel,:root[data-game="joker"] .slot,:root[data-game="joker"] .guess-row,:root[data-game="joker"] .verdict{background:rgba(12,0,1,.85)}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.app{position:relative;z-index:1}
#veil,#b-veil,#d-veil,#p-veil,#plush-veil,#deck-veil{position:relative;z-index:30}
#decor svg{position:absolute}
#decor .tl{top:70px;left:-60px;width:min(460px,50vw);opacity:.9}
#decor .br{bottom:-30px;right:-40px;width:min(560px,62vw)}
#decor .dice{top:70px;right:-20px;width:min(280px,28vw)}
#decor .cards{bottom:-10px;left:-10px;width:min(300px,30vw)}
@media (max-width:700px){#decor .dice,#decor .cards{opacity:.45}}
.joker-logo{font-family:"Bungee","Baloo 2",sans-serif;font-size:clamp(3.4rem,11vw,7.5rem);line-height:1;color:#fff;letter-spacing:.02em;transform:rotate(-3deg);text-shadow:-4px -4px 0 #c4151d,4px -4px 0 #c4151d,-4px 4px 0 #c4151d,4px 4px 0 #c4151d,0 10px 0 #5a0006,0 18px 26px rgba(0,0,0,.6)}

/* Ăn hay không ăn: lavender cake, clean white, pink-to-purple type */
:root[data-game="banh"]{--tint:80,40,140; --felt:#fdfbff; --felt-deep:#efe6ff; --felt-hi:#ffffff; --felt-line:rgba(120,70,200,.18);
  --ivory:#3a1d5c; --ink:#ffffff; --ruby:#ff4f7b; --ruby-deep:#d12c5e; --gold:#8f4dff; --mint:#2f9e6e; --muted:#7a6596;
  --display:"Anton","Baloo 2",system-ui,sans-serif; color-scheme:light}
:root[data-game="banh"] body{background-image:radial-gradient(ellipse at 50% 10%,#ffffff,#fbf7ff 55%,#f1e8ff)}
:root[data-game="banh"] .panel,:root[data-game="banh"] .slot,:root[data-game="banh"] .guess-row,:root[data-game="banh"] .verdict{background:#fff;box-shadow:0 4px 14px rgba(120,70,200,.08)}
:root[data-game="banh"] .qcard,:root[data-game="banh"] .slip{background:#fff;color:#3a1d5c;box-shadow:0 14px 34px rgba(120,70,200,.18)}
:root[data-game="banh"] .qcard .kicker,:root[data-game="banh"] .slip-no{color:#d12c5e}
:root[data-game="banh"] input,:root[data-game="banh"] textarea{background:#fff;color:#3a1d5c}
:root[data-game="banh"] h1,:root[data-game="banh"] h2,:root[data-game="banh"] .brand{font-weight:400;letter-spacing:.01em;text-transform:uppercase}
:root[data-game="banh"] .team-name,:root[data-game="banh"] .brand b{background:linear-gradient(90deg,#ff4f7b,#8f4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-game="banh"] .btn{font-weight:400;letter-spacing:.03em}
:root[data-game="banh"] .money{font-weight:400}
.lavcake{width:min(260px,40vw);height:auto;filter:drop-shadow(0 10px 14px rgba(90,50,140,.18))}
.lavcake.hero{width:min(240px,55vw);animation:bob 3s ease-in-out infinite}
.ask-title{font-size:clamp(2rem,5vw,3.6rem)}
.cake-pick{display:flex;align-items:stretch;justify-content:center;gap:clamp(12px,4vw,48px);width:100%}
.cake-btn{font:inherit;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:20px;color:var(--muted);transition:transform .15s}
.cake-btn:hover{transform:translateY(-6px) rotate(-2deg)}
.cake-btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.cake-btn .lavcake{width:min(300px,38vw)}
.cake-word{font-family:"Anton","Baloo 2",sans-serif;font-size:clamp(2.6rem,7vw,4.8rem);line-height:1;background:linear-gradient(90deg,#ff4f7b,#8f4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cake-divider{width:4px;border-radius:4px;background:linear-gradient(#c9a3ff,#8f4dff);opacity:.7}
.tile-art.cake-mini{display:block;width:150px;align-self:center}
.tile-art.cake-mini .lavcake{width:150px}

/* Đấu giá: auction house, velvet and gold */
:root[data-game="daugia"]{--felt:#4a0f1d; --felt-deep:#2a0610; --felt-hi:#6d1a2c; --felt-line:rgba(230,190,110,.22);
  --ivory:#f7ecd6; --ink:#2a0d12; --ruby:#b8283f; --ruby-deep:#7c1426; --gold:#e3bb62; --mint:#9ad6a8; --muted:#d6b9a6;
  --display:"Playfair Display",Georgia,serif}
:root[data-game="daugia"] body{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 18px),radial-gradient(ellipse at 50% 0%,var(--felt-hi),var(--felt) 55%,var(--felt-deep))}
:root[data-game="daugia"] .panel,:root[data-game="daugia"] .slot{border-color:rgba(227,187,98,.35)}
:root[data-game="daugia"] .brand,:root[data-game="daugia"] h1,:root[data-game="daugia"] h2{letter-spacing:.01em}

/* Đại hải trình: antique sea chart */
:root[data-game="haitrinh"]{--tint:70,40,15; --felt:#e7d1a1; --felt-deep:#c9a467; --felt-hi:#f4e6c4; --felt-line:rgba(74,46,20,.28);
  --ivory:#3b2413; --ink:#f7ecd2; --ruby:#a8322d; --ruby-deep:#7a1f1b; --gold:#8a5a12; --mint:#2f6b4a; --muted:#6b5232;
  --display:"Alegreya SC",Georgia,serif; color-scheme:light}
:root[data-game="haitrinh"] body{background-image:
  repeating-linear-gradient(0deg,rgba(74,46,20,.07) 0 1px,transparent 1px 80px),
  repeating-linear-gradient(90deg,rgba(74,46,20,.07) 0 1px,transparent 1px 80px),
  radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 60%,var(--felt-deep))}
:root[data-game="haitrinh"] .panel,:root[data-game="haitrinh"] .verdict{background:rgba(255,248,230,.45)}
:root[data-game="haitrinh"] .qcard,:root[data-game="haitrinh"] .slip{background:#fbf2dc;color:#3b2413;box-shadow:0 10px 24px rgba(74,46,20,.25)}
:root[data-game="haitrinh"] .qcard .kicker,:root[data-game="haitrinh"] .slip-no{color:var(--ruby-deep)}
:root[data-game="haitrinh"] input,:root[data-game="haitrinh"] textarea{background:#fbf2dc;color:#3b2413}
:root[data-game="haitrinh"] .wheel-wrap canvas{box-shadow:0 0 0 8px #6b4a22,0 18px 40px rgba(74,46,20,.4)}

/* Lá bài quyền năng: mystic card table, indigo and gold */
:root[data-game="quyennang"]{--felt:#1d1842; --felt-deep:#0f0b26; --felt-hi:#2e2765; --felt-line:rgba(214,186,255,.18);
  --ivory:#f3ecff; --ink:#1a1438; --ruby:#c43b72; --ruby-deep:#8b2350; --gold:#f1c75b; --mint:#7fe0c4; --muted:#b8acd9;
  --display:"Lora",Georgia,serif}
:root[data-game="quyennang"] body{background-image:radial-gradient(circle,rgba(241,199,91,.35) 1px,transparent 1.6px),radial-gradient(circle,rgba(243,236,255,.18) 1px,transparent 1.6px),radial-gradient(ellipse at 50% 20%,var(--felt-hi),var(--felt) 55%,var(--felt-deep));background-size:90px 90px,53px 53px,auto;background-position:0 0,20px 30px,0 0}
:root[data-game="quyennang"] .pcard.back{background-color:#3a2f86;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(241,199,91,.25) 6px 8px),repeating-linear-gradient(-45deg,transparent 0 6px,rgba(241,199,91,.25) 6px 8px);box-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 0 0 3px var(--gold)}
:root[data-game="quyennang"] .pcard{box-shadow:0 8px 18px rgba(0,0,0,.4),inset 0 0 0 3px var(--gold)}

/* Truyền bom: bomb squad, charcoal with hazard tape */
:root[data-game="bom"]{--felt:#1f2125; --felt-deep:#121316; --felt-hi:#2c2f35; --felt-line:rgba(245,196,0,.22);
  --ivory:#f2f2ea; --ink:#16171a; --ruby:#e5382b; --ruby-deep:#a5221a; --gold:#f5c400; --mint:#5fd38a; --muted:#a9adb4;
  --display:"Bangers","Baloo 2",system-ui,sans-serif}
:root[data-game="bom"] body{background-image:radial-gradient(ellipse at 50% 30%,var(--felt-hi),var(--felt) 55%,var(--felt-deep))}
:root[data-game="bom"] #app-bom header{padding-top:14px;background:repeating-linear-gradient(-45deg,var(--gold) 0 18px,#16171a 18px 36px) top/100% 8px no-repeat}
:root[data-game="bom"] h1,:root[data-game="bom"] h2,:root[data-game="bom"] .brand,:root[data-game="bom"] .holder{letter-spacing:.04em}
:root[data-game="bom"] .tnum,:root[data-game="bom"] .countword{font-family:"Bangers","Baloo 2",sans-serif;letter-spacing:.05em}

/* Hộp nhạc: late-night lo-fi */
:root[data-game="hopnhac"]{--felt:#2a1f4f; --felt-deep:#160f2f; --felt-hi:#4a2f6e; --felt-line:rgba(255,179,138,.2);
  --ivory:#fdf1ff; --ink:#1d1538; --ruby:#ff6b8b; --ruby-deep:#c9406a; --gold:#ffb38a; --mint:#7ee6d6; --muted:#c3b4e6}
:root[data-game="hopnhac"] body{background-image:linear-gradient(180deg,#160f2f 0%,#2a1f4f 45%,#5b3a6e 80%,#8a4f6a 100%)}
:root[data-game="hopnhac"] .eq i{background:var(--mint)}
:root[data-game="hopnhac"] .eq i:nth-child(3n){background:var(--gold)}
:root[data-game="hopnhac"] .eq i:nth-child(4n){background:var(--ruby)}

/* Đức vua: imperial lacquer red and gold */
:root[data-game="ducvua"]{--felt:#7a1414; --felt-deep:#4a0909; --felt-hi:#9c2a1d; --felt-line:rgba(240,196,96,.3);
  --ivory:#fff3d6; --ink:#3a0d0a; --ruby:#c0281e; --ruby-deep:#7a1010; --gold:#f0c460; --mint:#9be3a8; --muted:#f1c9a8;
  --display:"Noto Serif",Georgia,serif}
:root[data-game="ducvua"] body{background-image:radial-gradient(circle at 50% 50%,rgba(240,196,96,.12) 0 10px,transparent 11px),radial-gradient(ellipse at 50% 20%,var(--felt-hi),var(--felt) 55%,var(--felt-deep));background-size:64px 64px,auto}
:root[data-game="ducvua"] .neg{color:#ffb3a8}
:root[data-game="ducvua"] .panel,:root[data-game="ducvua"] .slot{border-color:rgba(240,196,96,.4)}
:root[data-game="ducvua"] #app-ducvua header{border-bottom:3px double var(--gold);padding-bottom:10px}

/* home tiles preview each game's palette */
.tile[onclick*="'joker'"]{background:radial-gradient(ellipse at 40% 40%,#120002,#5c0409 70%,#9b0c14)}
.tile[onclick*="'banh'"]{background:linear-gradient(170deg,#ffffff,#efe4ff);color:#3a1d5c}
.tile[onclick*="'banh'"] .tile-d{color:#6a5590}.tile[onclick*="'banh'"] .tile-k{color:#d12c5e}
.tile[onclick*="'daugia'"]{background:linear-gradient(160deg,#6d1a2c,#2a0610)}
.tile[onclick*="'haitrinh'"]{background:linear-gradient(160deg,#f1dfb6,#c9a467);color:#3b2413}
.tile[onclick*="'haitrinh'"] .tile-d{color:#5b4024}.tile[onclick*="'haitrinh'"] .tile-k{color:#7a1f1b}
.tile[onclick*="'quyennang'"]{background:linear-gradient(160deg,#2e2765,#0f0b26)}
.tile[onclick*="'bom'"]{background:linear-gradient(160deg,#2c2f35,#121316);border-top:6px solid #f5c400}
.tile[onclick*="'hopnhac'"]{background:linear-gradient(170deg,#2a1f4f,#8a4f6a)}
.tile[onclick*="'ducvua'"]{background:linear-gradient(160deg,#9c2a1d,#4a0909)}
.tile .tile-t{text-wrap:balance}

/* sea chart board */
.chart-wrap{width:100%;overflow-x:auto}
.chart{display:block;width:100%;min-width:560px;height:auto;border-radius:14px;box-shadow:0 14px 30px rgba(74,46,20,.3),inset 0 0 0 2px rgba(74,46,20,.3)}
.chart .lbl{font:700 15px "Be Vietnam Pro",system-ui,sans-serif;fill:#3b2413}
.chart .ocean{font:italic 800 22px "Alegreya SC",Georgia,serif;fill:rgba(74,46,20,.28);letter-spacing:.3em}
.chart .tok{font-size:34px}
.chart .step-n{font:800 11px "Be Vietnam Pro",sans-serif;fill:#3b2413}
.edit-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.edit-list .slot{flex:1 1 180px}
.throne-wrap{width:100%;max-width:900px}
.throne{display:block;width:100%;height:auto}
.throne .tg1{font:800 13px "Be Vietnam Pro",sans-serif;fill:#fff3d6}
.throne .tg2{font:700 12px "Be Vietnam Pro",sans-serif;fill:#f0c460;letter-spacing:.08em}
.throne .tg-hero{font:900 26px "Noto Serif",Georgia,serif;fill:#f0c460}
.throne .tg-badge{font:800 12px "Be Vietnam Pro",sans-serif;fill:#fff;letter-spacing:.08em}
.kneel-title{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,7vw,4.8rem);line-height:1;color:#fff3d6;text-shadow:0 4px 0 var(--ruby),0 8px 0 rgba(0,0,0,.35);animation:kaboom .8s cubic-bezier(.2,1.6,.4,1)}
.kneel-sub{display:inline-block;margin-top:-6px;padding:8px 22px;background:var(--gold);color:var(--ink);font-weight:800;font-size:clamp(1.1rem,2.6vw,1.6rem);letter-spacing:.04em;transform:rotate(-2deg);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.plush{font-size:5rem;line-height:1}
.plush.big{font-size:6.5rem;animation:bob 2.4s ease-in-out infinite}
.plush.flying{animation:toss .6s linear infinite}
.plush.landed{animation:land .5s cubic-bezier(.2,1.6,.4,1);transform:rotate(-70deg)}
@keyframes toss{to{transform:rotate(360deg) translateY(-6px)}}
@keyframes land{from{transform:translateY(-120px) rotate(200deg)}to{transform:rotate(-70deg)}}
.plush-veil .box{text-align:center;align-items:center;max-width:720px}
.plush-veil .lead{margin:0 auto}

/* Băng chuyền: clean factory floor, steel grey and safety orange */
:root[data-game="bangchuyen"]{--tint:30,40,50; --felt:#eef1f4; --felt-deep:#dfe4ea; --felt-hi:#fbfcfd; --felt-line:rgba(30,40,50,.16);
  --ivory:#1d2630; --ink:#ffffff; --ruby:#e23b2e; --ruby-deep:#a8241a; --gold:#ff7a1a; --mint:#1f9d6b; --muted:#5d6b78;
  --display:"Chakra Petch","Baloo 2",system-ui,sans-serif; color-scheme:light}
:root[data-game="bangchuyen"] body{background-image:linear-gradient(rgba(30,40,50,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(30,40,50,.05) 1px,transparent 1px),linear-gradient(180deg,#fbfcfd,#e6eaef);background-size:40px 40px,40px 40px,auto}
:root[data-game="bangchuyen"] .panel,:root[data-game="bangchuyen"] .verdict{background:#fff;box-shadow:0 4px 14px rgba(30,40,50,.06)}
:root[data-game="bangchuyen"] .qcard,:root[data-game="bangchuyen"] .slip{background:#fff;color:#1d2630;box-shadow:0 12px 30px rgba(30,40,50,.14)}
:root[data-game="bangchuyen"] .qcard .kicker,:root[data-game="bangchuyen"] .slip-no{color:#c45a0c}
:root[data-game="bangchuyen"] input,:root[data-game="bangchuyen"] textarea{background:#fff;color:#1d2630}
:root[data-game="bangchuyen"] #app-bangchuyen header{border-bottom:6px solid transparent;border-image:repeating-linear-gradient(-45deg,#ff7a1a 0 14px,#1d2630 14px 28px) 6;padding-bottom:10px}
.tile[onclick*="'bangchuyen'"]{background:linear-gradient(170deg,#fbfcfd,#d9dfe6);color:#1d2630;border-top:6px solid #ff7a1a}
.tile[onclick*="'bangchuyen'"] .tile-d{color:#4d5a66}.tile[onclick*="'bangchuyen'"] .tile-k{color:#c45a0c}
.factory-tile,.factory-hero{font-size:5rem;line-height:1}
.factory-tile{height:120px;line-height:120px}
.floor{display:flex;flex-direction:column;gap:10px}
.line{background:#fff;border:2px solid var(--felt-line);border-radius:14px;padding:8px 12px 2px;min-width:0}
.line.now{border-color:#ff7a1a;box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.line.is-fired{opacity:.7}
.line-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.95rem}
.line-meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.lights{display:inline-flex;gap:4px}
.lights i{width:14px;height:14px;border-radius:50%;background:#d7dde3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.lights i.on{background:#e23b2e;box-shadow:0 0 8px rgba(226,59,46,.7)}
.belt-svg{display:block;width:100%;height:auto;min-width:0}
.belt-svg .belt{fill:#2b333c}
.belt-svg .belt-tread{fill:url(#none);fill:transparent;stroke:#4a5560;stroke-width:3;stroke-dasharray:12 10}
.belt-svg.moving .belt-tread{animation:tread .6s linear infinite}
@keyframes tread{to{stroke-dashoffset:-22}}
.belt-svg .roller{fill:#9aa6b2;stroke:#2b333c;stroke-width:2}
.belt-svg .stn{fill:#f4f6f8;stroke:#1d2630;stroke-width:2.5}
.belt-svg .stn.done{fill:#d8f3e6;stroke:#1f9d6b}
.belt-svg .stn.extra{fill:#ffe7d6;stroke:#ff7a1a;stroke-dasharray:5 3}
.belt-svg .stn-n{font:700 15px "Be Vietnam Pro",sans-serif;fill:#1d2630}
.belt-svg .stn-l{font:700 12px "Be Vietnam Pro",sans-serif;fill:#3c4853}
.belt-svg .stn-l.x{fill:#c45a0c}
.belt-svg .stn-arm{stroke:#9aa6b2;stroke-width:2;stroke-dasharray:3 3}
.belt-svg .box{fill:#f2c35e;stroke:#a87412;stroke-width:2}
.belt-svg .prod{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.belt-svg .stamp{fill:rgba(226,59,46,.12);stroke:#e23b2e;stroke-width:5}
.belt-svg .stamp-t{font:900 36px "Chakra Petch","Be Vietnam Pro",sans-serif;fill:#e23b2e;letter-spacing:.2em}
.timebar{position:relative;width:100%;height:30px;border-radius:999px;background:#dfe4ea;overflow:hidden}
.timebar-fill{position:absolute;inset:0 auto 0 0;width:100%;background:repeating-linear-gradient(-45deg,#ff7a1a 0 14px,#ff9a4d 14px 28px);transition:width .2s linear}
.ttag{position:absolute;inset:0;display:grid;place-items:center;font-family:"Chakra Petch","Baloo 2",sans-serif;font-weight:700;font-size:1.1rem;color:#1d2630}
.ttag.hot{color:#a8241a}

.c3d{position:relative;width:100%;height:clamp(320px,52vh,560px);border-radius:16px;overflow:hidden;border:2px solid var(--felt-line);background:#e9edf1;touch-action:none}
.c3d-canvas{display:block;width:100%;height:100%;cursor:grab}
.c3d-canvas:active{cursor:grabbing}
.c3d-labels{position:absolute;inset:0;pointer-events:none}
.c3d-label{position:absolute;left:0;top:0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;color:#1d2630;font:700 13px "Be Vietnam Pro",sans-serif;box-shadow:0 3px 10px rgba(30,40,50,.18)}
.c3d-label b{display:grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:#ffe8d6;color:#c45a0c;font-size:12px}
.c3d-label.stn:not(.act){padding:3px}
.c3d-label.ok b{background:#d8f3e6;color:#1f9d6b}
.c3d-label.x{border:2px dashed #ff7a1a}
.c3d-label.act{font-size:14px}
.c3d-label.lane{padding:5px 12px;background:#1d2630;color:#fff}
.c3d-label.lane.act{background:#ff7a1a}
.c3d-label.fired{padding:8px 18px;background:rgba(226,59,46,.12);border:4px solid #e23b2e;color:#e23b2e;font:900 26px "Chakra Petch","Be Vietnam Pro",sans-serif;letter-spacing:.2em;transform-origin:center}
.c3d-hint{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:.8rem;color:#4d5a66;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;pointer-events:none;width:max-content;max-width:calc(100% - 24px);margin:0 auto}
.floor.compact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px}
.line.compact{padding:8px 12px}
.ai-toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:45;max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border-radius:14px;background:#1d1a2e;color:#fff;font:600 .95rem "Be Vietnam Pro",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ai-toast .ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.pb-pass{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.pb-pass label{flex:1 1 200px}
.pb-gen{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:rgba(var(--tint),.05);font-size:.9rem;color:var(--muted)}
.pb-gen b{color:var(--ivory)}
.pb-genrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.pb-genrow label{width:96px}
/* ===== multiple choice tiles + paste importer ===== */
.passage{max-height:min(38vh,340px);overflow:auto;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.045);border-left:5px solid #f2a63a;font-size:clamp(1rem,1.9vw,1.25rem);line-height:1.6;text-align:left}
.passage p{margin:0 0 .5em}
.passage p:last-child{margin-bottom:0}
.passage mark{background:#ffe08a;color:#2a1d10;border-radius:4px;padding:0 4px;font-weight:800;box-shadow:0 0 0 2px #f2a63a}

.mc.thinking{opacity:.75}
.mc-verdict{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.05);font-weight:700;font-size:clamp(1rem,2vw,1.25rem)}
.mc-verdict.ok{background:#d8f3e6;color:#0d3b26}
.mc-verdict.bad{background:#fde1e5;color:#5c0d1a}
.mc-why{font-weight:500;font-size:.9em}
.mc-auto{font-weight:500;font-size:.8em;opacity:.8}
.mc-auto .linkbtn{color:inherit}
.ans-why{font-size:1rem;opacity:.85;margin-top:2px}

.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
@media (max-width:560px){.mc{grid-template-columns:1fr}}
.mc-opt{font:inherit;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid rgba(0,0,0,.14);background:rgba(0,0,0,.035);color:inherit;cursor:pointer;font-size:clamp(1.05rem,2.2vw,1.45rem);font-weight:600;line-height:1.25;transition:transform .12s}
.mc-opt:hover{transform:translateY(-2px)}
.mc-opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mc-opt b{flex:0 0 auto;display:grid;place-items:center;width:2em;height:2em;border-radius:50%;background:#2a2366;color:#fff;font-size:.85em}
.mc-opt span{min-width:0;overflow-wrap:anywhere}
.mc-opt.picked{border-color:#f2a63a;box-shadow:0 0 0 3px rgba(242,166,58,.35)}
.mc-opt.right{border-color:#1f9d6b;background:#d8f3e6;color:#0d3b26}
.mc-opt.right b{background:#1f9d6b}
.mc-opt.wrong{border-color:#d8384f;background:#fde1e5;color:#5c0d1a}
.mc-opt.wrong b{background:#d8384f}
.mcimp{display:flex;flex-direction:column;gap:8px}
.mcimp .mi-open{align-self:flex-start}
.mi-panel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:2px dashed var(--felt-line);background:rgba(var(--tint),.04)}
.mi-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.mi-opts{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.mi-opts i{font-style:normal}
.mi-opts i.ok{color:var(--mint);font-weight:700}
.team-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.team-ctl .ghost:disabled{opacity:.4}
.rescue{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px;border-radius:18px;background:rgba(0,0,0,.25);max-width:640px}
/* ===== shared reward / penalty deck ===== */
.deck-btn{white-space:nowrap}
.deck-veil .box{align-items:center;text-align:center;max-width:640px}
.deck-veil .seg-pick{justify-content:center}
.dk-wholbl{width:100%;max-width:360px;text-align:left}
.dk-stack{position:relative;flex-shrink:0;width:170px;height:230px;margin:6px auto 4px}
.dk-back{position:absolute;inset:0;border-radius:18px;background:#2a2366;border:5px solid #f2c35e;background-image:repeating-linear-gradient(45deg,transparent 0 8px,rgba(242,195,94,.28) 8px 10px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(242,195,94,.28) 8px 10px);display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.35)}
.dk-back span{font-size:3.4rem;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.dk-back.s1{transform:rotate(-8deg) translateX(-16px)}
.dk-back.s2{transform:rotate(6deg) translateX(14px)}
.dk-stack.shuffling .s1{animation:dkshuf .32s ease-in-out infinite alternate}
.dk-stack.shuffling .s2{animation:dkshuf .32s ease-in-out infinite alternate-reverse}
.dk-stack.shuffling .s3{animation:dkup .32s ease-in-out infinite alternate}
@keyframes dkshuf{from{transform:translateX(-60px) rotate(-10deg)}to{transform:translateX(60px) rotate(10deg)}}
@keyframes dkup{to{transform:translateY(-18px)}}
.dk-card{position:relative;flex-shrink:0;width:min(300px,78vw);min-height:min(400px,60vh);max-width:100%;border-radius:22px;background:linear-gradient(170deg,#fffdf6,#fff1d1);color:#2a1d10;border:7px solid #f2c35e;box-shadow:0 18px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 18px 22px;text-align:center;animation:flip .7s ease-out}
.dk-card.pen{background:linear-gradient(170deg,#f3fbff,#cdeeff);border-color:#57b8ef;color:#0f2a3a}
.dk-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:3px 14px;border-radius:999px;background:#2f9e6e;color:#fff;font:800 .78rem "Be Vietnam Pro",sans-serif;letter-spacing:.14em}
.dk-card.pen .dk-badge{background:#1677b8}
.dk-ic{font-size:clamp(3.6rem,10vw,5rem);line-height:1}
.dk-t{font:800 clamp(1.5rem,3.6vw,2rem)/1.1 "Baloo 2","Be Vietnam Pro",sans-serif;text-wrap:balance}
.dk-d{font:500 1rem/1.4 "Be Vietnam Pro",sans-serif;opacity:.85}
.dk-who{font:700 .85rem "Be Vietnam Pro",sans-serif;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.07)}
.dk-pick{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.dk-hint{font:800 clamp(1.6rem,4.5vw,2.6rem)/1.3 "Be Vietnam Pro",sans-serif;letter-spacing:.04em;color:var(--gold);padding:12px 18px;border-radius:14px;background:rgba(0,0,0,.18);overflow-wrap:anywhere}
.dk-frost{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:18px;border-radius:16px;background:linear-gradient(170deg,#e9f8ff,#bfe6fb);color:#0f2a3a}
.dk-frost .lead{color:#24485e}
.dk-frost .money{color:#1677b8}
.dk-ice{font-size:5rem;line-height:1;animation:bob 1.6s ease-in-out infinite}
.dk-freeze-t{color:#1677b8;text-shadow:0 4px 0 #fff}
.dk-list{display:flex;flex-direction:column;gap:6px;width:100%;max-height:44vh;overflow:auto;text-align:left}
.dk-row{flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(var(--tint),.06);color:var(--ivory);cursor:pointer}
.dk-row input{width:auto;accent-color:var(--gold)}
.dk-row-ic{font-size:1.6rem}
.dk-row .tag{margin-left:auto}
@media (prefers-reduced-motion:reduce){.dk-stack.shuffling .dk-back,.dk-ice{animation:none}.belt-svg.moving .belt-tread{animation:none}.plush,.plush.big,.plush.flying,.plush.landed{animation:none}.kneel-title{animation:none}.crown,.royal{animation:none}.musicbox.on .vinyl,.musicbox.on .eq i,.halt{animation:none}.card,.cake,.slip,.mbox,.chest,.token,.bomb,.bomb .spark,.bottle,.countword,.kaboom,.gulp{animation:none}.btn{transition:none}}
</style>

<div class="app" id="app-home">
  <main><div class="stage">
    <div class="kicker">Trò chơi thuyết trình</div>
    <h1>Hôm nay chơi gì?</h1>
    <p class="lead">Chọn một trò, mở máy chiếu, gọi các đội lên. Điểm được lưu trên máy này, đóng trang mở lại vẫn chơi tiếp được.</p>
    <div class="row"><button class="btn btn-gold" onclick="Deck.open('all')">🎴 Bộ thẻ quà & phạt</button></div>
    <div class="tiles">
      <button class="tile" onclick="openGame('bangchuyen')">
        <span class="tile-art factory-tile" aria-hidden="true">🏭</span>
        <span class="tile-k">Mới · Quy trình sản xuất</span>
        <span class="tile-t">Băng chuyền</span>
        <span class="tile-d">Đúng thì băng chuyền chạy tới xuất xưởng. Sai bị nối thêm băng, thêm công đoạn, đếm giờ gắt hơn. Sai 5 lần là sa thải.</span>
      </button>
      <button class="tile" onclick="openGame('ducvua')">
        <span class="tile-art crown" aria-hidden="true">👑</span>
        <span class="tile-k">Bài đăng 01 · Nhập vai</span>
        <span class="tile-t">Đức vua chọn hiền tài</span>
        <span class="tile-d">Khai triều cho cả lớp tập trung, xưng Trẫm ra đề. Đúng được ban thưởng, sai vào cung quạt hầu.</span>
      </button>
      <button class="tile" onclick="openGame('hopnhac')">
        <span class="tile-art musicbox on small" aria-hidden="true"><span class="vinyl"><span></span></span></span>
        <span class="tile-k">Bài đăng 02 · Cho lớp lì</span>
        <span class="tile-t">Hộp nhạc</span>
        <span class="tile-d">Nhạc chạy, cả lớp giơ tay nối tiếp. Nhạc dừng bất chợt, ai đang giơ tay thì trả lời.</span>
      </button>
      <button class="tile" onclick="openGame('bom')">
        <span class="tile-art bomb" aria-hidden="true"><i class="fuse"></i><i class="spark"></i></span>
        <span class="tile-k">Bài đăng 03 · Phản xạ</span>
        <span class="tile-t">Truyền bom</span>
        <span class="tile-d">Đếm ngược từng giây, sai thì ôm thêm bom, đủ 3 quả là BÙM. Có bản “truyền thuốc độc”.</span>

var RESCUE_KEYS = { joker:'jokers-call-v1', banh:'an-hay-khong-an-v2', daugia:'dau-gia-v1', haitrinh:'dai-hai-trinh-v1', quyennang:'la-bai-quyen-nang-v1', bom:'truyen-bom-v1', hopnhac:'hop-nhac-v1', ducvua:'duc-vua-v1', bangchuyen:'bang-chuyen-v1' };
var RESCUE_STAGE = { joker:'stage', banh:'b-stage', daugia:'d-stage', haitrinh:'h-stage', quyennang:'p-stage', bom:'t-stage', hopnhac:'m-stage', ducvua:'k-stage', bangchuyen:'c-stage' };

    '<button class="btn btn-eat" onclick="rescueReset(\'' + g + '\')">Xoá ván cũ và mở lại</button></div>';
}
function rescueReset(g){

  location.reload();
}
window.addEventListener('error', function(){ setTimeout(rescueCheck, 50); });

<script>
const KEY = 'jokers-call-v1';
const SAMPLE_Q = `She ___ to school every day. (go / goes) | goes
What is the past form of "eat"? | ate
Unscramble the word: R - A - C - D | card
Plural of "child"? | children
Which word is different: apple, banana, carrot, mango? | carrot
Complete: I'm good ___ drawing. | at
Opposite of "expensive"? | cheap
Make a question: you / like / milk tea? | Do you like milk tea?
"Lá bài" in English? | a card / a playing card
What do we call a person who cooks in a restaurant? | a chef / a cook
Complete: There ___ two cakes on the table. | are
How do you say "Không, cảm ơn" politely? | No, thank you.`;

function fresh(){
  return {
    phase:'setup',
    teamNames:['Nhóm 1','Nhóm 2','Nhóm 3','Nhóm 4','Nhóm 5'],
    rounds:3, turnsPerRound:5, start:0,
    v:{right:10, wrong:-5, jokerRight:20, jokerWrong:0, decoy:50, holder:50, guessWrong:-20},
    qText:SAMPLE_Q,
    teams:[], questions:[], qi:0, round:1, turn:0,
    holder:null, decoy:null, roundStart:[], events:[], guesses:{}, curQ:null, showAns:false,
    last:null, revealData:null, armReset:false
  };
}
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !S.phase) S = fresh(); else S = Object.assign(fresh(), S);
let peek = false;
let revealing = false;
let muted = false;
try { muted = localStorage.getItem(KEY + '-muted') === '1'; } catch(e) {}

/* ---------- sound effects (Web Audio, no files) ---------- */
const SFX = (() => {
  let ctx = null;
  const ac = () => {
    if (muted) return null;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch(e) { return null; }
  };
  const noiseBuf = c => {
    const b = c.createBuffer(1, c.sampleRate * 0.6, c.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  };
  function hit(c, t, len, freq, gain){
    const src = c.createBufferSource(); src.buffer = noiseBuf(c);
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t); src.stop(t + len + 0.02);
  }
  function tone(c, t, freq, len, type, gain){
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.05);
    return o;
  }
  return {
    // snare roll that speeds up, ends on a cymbal-ish crash; returns its length in ms
    drumroll(){
      const c = ac(); if (!c) return 250;
      const t0 = c.currentTime, dur = 1.5;
      let t = t0, gap = 0.075;
      while (t < t0 + dur) { hit(c, t, 0.07, 1800, 0.35 + (t - t0) / dur * 0.4); t += gap; gap = Math.max(0.03, gap * 0.96); }
      hit(c, t0 + dur, 0.5, 6000, 0.6);
      tone(c, t0 + dur, 70, 0.4, 'sine', 0.5);
      return dur * 1000 + 80;
    },
    // card flip: a quick swoosh plus a paper snap
    flip(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuf(c);
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
      f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(4500, t + 0.22);
      const g = c.createGain();
      g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.12); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
      src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + 0.3);
      hit(c, t + 0.24, 0.05, 3000, 0.7);
    },
    fanfare(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      [[523, 0], [659, .12], [784, .24], [1047, .38]].forEach(([f, d], i) =>
        tone(c, t + d, f, i === 3 ? 0.7 : 0.18, 'square', 0.09));
      [1047, 1319, 1568].forEach(f => tone(c, t + .38, f, 0.8, 'triangle', 0.07));
    },
    // "wah wah wah wahhh" for a caught Joker
    sad(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      [[392, 0, .32], [370, .36, .32], [349, .72, .32]].forEach(([f, d, l]) => tone(c, t + d, f, l, 'sawtooth', 0.08));
      const o = tone(c, t + 1.08, 330, 1.0, 'sawtooth', 0.08);
      o.frequency.setValueAtTime(330, t + 1.08);
      o.frequency.linearRampToValueAtTime(300, t + 2.0);
    },
    gong(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      [[98, .5, 4], [196.5, .25, 3], [263, .16, 2.4], [331, .1, 2], [523, .05, 1.2]].forEach(([f, g, l]) => {
        const o = tone(c, t, f, l, 'sine', g); o.frequency.setValueAtTime(f * 1.02, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.4);
      });
      const src = c.createBufferSource(); src.buffer = noiseBuf(c);
      const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 600;
      const gg = c.createGain(); gg.gain.setValueAtTime(0.5, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      src.connect(fl).connect(gg).connect(c.destination); src.start(t); src.stop(t + 0.3);
    },
    scratch(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      [0, 0.13].forEach((d, k) => {
        const src = c.createBufferSource(); src.buffer = noiseBuf(c);
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
        f.frequency.setValueAtTime(k ? 900 : 2600, t + d); f.frequency.exponentialRampToValueAtTime(k ? 2600 : 700, t + d + 0.12);
        const g = c.createGain(); g.gain.setValueAtTime(0.9, t + d); g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.14);
        src.connect(f).connect(g).connect(c.destination); src.start(t + d); src.stop(t + d + 0.16);
      });
    },
    beep(f){
      const c = ac(); if (!c) return;
      tone(c, c.currentTime, f || 880, 0.18, 'square', 0.14);
    },
    boom(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const len = 1.4, b = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = c.createBufferSource(); src.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(2200, t); f.frequency.exponentialRampToValueAtTime(120, t + 1.2);
      const g = c.createGain(); g.gain.setValueAtTime(1.2, t);
      src.connect(f).connect(g).connect(c.destination); src.start(t);
      const o = tone(c, t, 90, 0.9, 'sine', 0.7); o.frequency.exponentialRampToValueAtTime(35, t + 0.8);
    },
    gulp(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      [0, .28, .56].forEach(d => { const o = tone(c, t + d, 420, 0.22, 'sine', 0.3); o.frequency.exponentialRampToValueAtTime(140, t + d + 0.2); });
      const o = tone(c, t + .9, 300, 1.1, 'sawtooth', 0.06); o.frequency.linearRampToValueAtTime(110, t + 2);
    },
    coin(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      tone(c, t, 988, 0.09, 'square', 0.08); tone(c, t + 0.08, 1319, 0.35, 'square', 0.08);
    },
    bonk(){
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const o = tone(c, t, 220, 0.35, 'triangle', 0.3);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.3);
    },
    click(){
      const c = ac(); if (!c) return;
      hit(c, c.currentTime, 0.04, 2500, 0.35);
    }
  };
})();

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = () => S.teams.length;
const cur = () => (S.turn + S.round - 1) % n();
const nm = i => esc(S.teams[i].name);
const fmt = x => (x > 0 ? '+' : '') + x;

// lavender cake slice; mirror=true flips it so two slices face each other
function lavCake(mirror, cls){
  const sw = (x, y) => `<g transform="translate(${x},${y})"><circle r="15" fill="#ff86b0"/><path d="M-9 2 Q-8 -10 2 -9 Q11 -6 7 4 Q3 10 -3 6 Q-6 2 -1 -2 Q4 -3 3 2" fill="none" stroke="#e2477e" stroke-width="2.4" stroke-linecap="round"/><path d="M-4 -14 Q0 -22 5 -14" fill="#ff86b0" stroke="#e2477e" stroke-width="2"/></g>`;
  const ch = (x, y) => `<g transform="translate(${x},${y})"><circle r="14" fill="#ff6b78"/><circle cx="-5" cy="-5" r="4" fill="#ffd0d4" opacity=".8"/><path d="M1 -13 q2 -5 6 -6" stroke="#9a8a2a" stroke-width="2" fill="none"/></g>`;
  return `<svg class="${cls || 'lavcake'}" viewBox="0 0 230 210" aria-hidden="true"><g ${mirror ? 'transform="translate(230,0) scale(-1,1)"' : ''}>
    <ellipse cx="118" cy="200" rx="62" ry="7" fill="rgba(90,50,140,.18)"/>
    <path d="M206 66 L216 76 L124 204 L112 196 Z" fill="#9fb07a"/>
    <path d="M211 71 L118 200" stroke="#f08db0" stroke-width="4"/>
    <path d="M206 66 L216 76" stroke="#b9a6ea" stroke-width="8" stroke-linecap="round"/>
    <path d="M112 196 L18 66 Q112 -14 206 66 Z" fill="#c9b8f2" stroke="#b09de6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 70 Q112 2 196 70" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="5" stroke-linecap="round"/>
    ${sw(62, 72)}${sw(114, 44)}${sw(165, 72)}${ch(88, 122)}${ch(138, 122)}
  </g></svg>`;
}
// +/- and typed correction box used by every game's score display
function adjBox(ns, i, val, step){
  return `<span class="adj"><button type="button" class="adj-b" onclick="${ns}.adj(${i},${-step})" aria-label="Trừ ${step}">−${step}</button><input type="number" class="adj-in" value="${val}" aria-label="Sửa số" onchange="${ns}.setv(${i},this.value)"><button type="button" class="adj-b" onclick="${ns}.adj(${i},${step})" aria-label="Cộng ${step}">+${step}</button></span>`;
}
const editBtn = (ns, on) => `<button class="ghost ${on ? 'on-edit' : ''}" onclick="${ns}.edit()" aria-pressed="${on}">${on ? '✓ Xong sửa điểm' : '✏️ Sửa điểm'}</button>`;

/* ---------- actions ---------- */
const A = {
  start(){
    const names = [...document.querySelectorAll('[data-name]')].map(el => el.value.trim()).filter(Boolean);
    if (names.length < 3) { alertMsg('Cần ít nhất 3 đội.'); return; }
    const num = id => parseInt(document.getElementById(id).value, 10);
    S.teamNames = names;
    S.rounds = Math.max(1, num('rounds') || 3);
    S.turnsPerRound = Math.max(1, num('turns') || names.length);
    S.start = Number.isFinite(num('start')) ? num('start') : 0;
    S.qText = document.getElementById('qtext').value;
    S.questions = parseQLines(S.qText, false);
    S.teams = names.map(name => ({ name, score:S.start }));
    S.round = 1; S.qi = 0; S.events = [];
    S.phase = 'deal';
    go();
  },
  deal(i){
    S.holder = i; S.decoy = i;
    S.roundStart = S.teams.map(t => t.score);
    S.turn = 0; S.guesses = {}; S.revealData = null;
    nextQ(); go();
  },
  answer(right){
    const t = cur(), joker = S.holder === t, v = S.v;
    const d = right ? (joker ? v.jokerRight : v.right) : (joker ? v.jokerWrong : v.wrong);
    S.teams[t].score += d;
    S.events.push({ round:S.round, team:t, kind:right ? 'right' : 'wrong', delta:d, joker });
    S.last = { kind:'sealed', right };
    S.phase = 'result'; go();
  },
  toSwap(){ S.phase = 'swap'; go(); },
  swap(j){
    const t = cur();
    SFX.click();
    if (S.holder === t) S.holder = j; else if (S.holder === j) S.holder = t;
    S.events.push({ round:S.round, team:t, kind:'swap', with:j });
    S.turn++;
    if (S.turn >= S.turnsPerRound) S.phase = 'guess'; else nextQ();
    go();
  },
  guess(g, target){
    S.guesses[g] = S.guesses[g] === target ? undefined : target;
    go();
  },
  reveal(){
    if (revealing) return;
    revealing = true;
    const btn = document.getElementById('revealBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang lật...'; }
    const wait = SFX.drumroll();
    setTimeout(() => {
      revealing = false;
      A.doReveal();
      SFX.flip();
      setTimeout(() => S.revealData.right.length ? SFX.sad() : SFX.fanfare(), 380);
    }, wait);
  },
  doReveal(){
    const h = S.holder, d = S.decoy, v = S.v;
    const guessers = S.teams.map((_, i) => i).filter(i => i !== d && i !== h);
    const right = guessers.filter(g => S.guesses[g] === h);
    const lines = [];
    const add = (i, x, why) => { S.teams[i].score += x; lines.push({ team:i, delta:x, why }); };
    if (right.length){
      const back = S.roundStart[h] - S.teams[h].score;
      S.teams[h].score = S.roundStart[h];
      lines.push({ team:h, delta:back, why:'Bị đoán trúng, điểm cả vòng về 0' });
    } else {
      add(d, v.decoy, 'Cầm Joker đầu tiên, đánh lạc hướng thành công');
      add(h, v.holder, 'Giữ Joker mà không bị lộ');
      guessers.forEach(g => { if (S.guesses[g] !== undefined && S.guesses[g] !== null) add(g, v.guessWrong, 'Đoán sai'); });
    }
    S.revealData = { h, d, right, guesses:{ ...S.guesses }, lines };
    S.phase = 'reveal'; go();
  },
  next(){
    if (S.round >= S.rounds) { S.phase = 'end'; }
    else { S.round++; S.phase = 'deal'; }
    go();
  },
  showAns(){ S.showAns = true; go(); },
  reset(){
    if (!S.armReset) { S.armReset = true; go(); setTimeout(() => { S.armReset = false; go(); }, 3500); return; }
    const keep = { teamNames:S.teamNames, rounds:S.rounds, turnsPerRound:S.turnsPerRound, start:S.start, qText:S.qText };
    S = Object.assign(fresh(), keep); go();
  },
  peek(){ peek = !peek; drawVeil(); },
  adj(i, d){
    d = Math.round(Number(d)) || 0; if (!d) return;
    S.teams[i].score += d;
    if (S.roundStart[i] != null) S.roundStart[i] += d;
    S.events.push({ round:S.round, team:i, kind:'manual', delta:d });
    go();
  },
  setv(i, v){ const n = Math.round(Number(v)); if (Number.isFinite(n)) A.adj(i, n - S.teams[i].score); },
  mute(){
    muted = !muted;
    try { localStorage.setItem(KEY + '-muted', muted ? '1' : '0'); } catch(e) {}
    drawStatus();
    if (!muted) SFX.click();
  }
};

    const val = showLive ? t.score : (S.roundStart[i] ?? t.score);
    return `<div class="slot ${now ? 'now' : ''} ${done ? 'done' : ''}">
