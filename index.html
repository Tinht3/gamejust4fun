/* ================= AI: đọc ảnh & soạn thêm câu hỏi =================
   Trong Claude: dùng tài khoản Claude của người xem (capability "sample").
   Trên Netlify: gọi hàm máy chủ /api/claude (giữ khoá API bí mật), kèm mã dùng AI. */
const AIERR = {
  not_granted:'Cô chưa cho phép trang dùng Claude.',
  sampling_disabled:'Tài khoản này chưa dùng được Claude.',
  images_unavailable:'Chỗ đang mở trang chưa gửi ảnh được.',
  image_rejected:'Ảnh này không đọc được. Thử ảnh khác nha.',
  rate_limited:'Đang gửi hơi nhiều, chờ một lát rồi thử lại nha.',
  session_expired:'Phiên đăng nhập hết hạn, đăng nhập lại rồi thử nha.',
  invalid_json:'AI trả lời chưa đúng dạng. Bấm thử lại nha.',
  refused:'AI không xử lý được nội dung này.',
  empty_completion:'AI không trả về câu nào.',
  prompt_too_large:'Nội dung dài quá, chia nhỏ ra nha.',
  bad_passcode:'Mã dùng AI chưa đúng. Nhập lại mã nha.',
  no_function:'Trang chưa có hàm AI trên Netlify. Cần đăng bằng GitHub, không dùng kéo thả.',
  no_key:'Netlify chưa có khoá ANTHROPIC_API_KEY.',
  upstream:'Claude API báo lỗi. Kiểm tra khoá API và hạn mức chi tiêu.',
  network:'Mất kết nối mạng. Thử lại nha.',
  unavailable:'Tính năng AI chỉ chạy trong Claude hoặc trên trang Netlify đã cài hàm AI.'
};
const cleanQ = s => String(s ?? '').replace(/[\r\n]+/g, ' ').replace(/\|/g, '/').trim();
const GEN_PROMPT = (lines, n, withLevel) => `You are helping a Vietnamese English teacher prepare a classroom quiz game.
Below are the questions she already has, one per line, in the format "${withLevel ? 'level | question | answer' : 'question | answer'}":

${lines.join('\n')}

Write ${n} NEW questions for the same students: same topic and vocabulary area, same question types (fill-in-the-blank stays fill-in-the-blank, multiple choice keeps its options inline), same language mix and a similar difficulty spread. Do not repeat or lightly reword any question above, and do not repeat each other. Each answer must be short, correct and unambiguous.
Reply with only a JSON array, for example [{"q":"...","a":"..."${withLevel ? ',"level":3' : ''}}]${withLevel ? ', where level is 1 (easy), 3 (medium) or 5 (hard)' : ''}.`;

const AI = (() => {
  const PKEY = 'ai-passcode';
  const inClaude = () => !!(window.claude && window.claude.use);
  const onWeb = () => !inClaude() && /^https?:$/.test(location.protocol);
  let sp = null;
  const getSample = () => { if (!sp) sp = window.claude.use('sample').catch(() => null); return sp; };
  const pass = () => { try { return localStorage.getItem(PKEY) || ''; } catch(e) { return ''; } };
  const setPass = v => { try { if (v) localStorage.setItem(PKEY, v); else localStorage.removeItem(PKEY); } catch(e) {} };
  function parse(text){
    try { return JSON.parse(text); } catch(e) {}
    const f = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch(e) {} }
    for (const [o, c] of [['[', ']'], ['{', '}']]) {
      const a = text.indexOf(o), b = text.lastIndexOf(c);
      if (a >= 0 && b > a) { try { return JSON.parse(text.slice(a, b + 1)); } catch(e) {} }
    }
    throw { code:'invalid_json' };
  }
  // downsize a photo to about 1600px JPEG before upload (keeps requests small and fast)
  function shrink(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res({ type:'image/jpeg', data:c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej({ code:'image_rejected' }); };
      img.src = url;
    });
  }
  async function ask(prompt, images, signal){
    images = images || [];
    if (inClaude()) {
      const sample = await getSample(); if (!sample) throw { code:'unavailable' };
      if (images.length) { const lim = await sample.limits().catch(() => null); if (!lim || !lim.images) throw { code:'images_unavailable' }; }
      return sample.json(prompt, images.length ? { images, signal } : { signal, cache:false });
    }
    if (!onWeb()) throw { code:'unavailable' };
    const imgs = []; for (const f of images) imgs.push(await shrink(f));
    let r;
    try { r = await fetch('/api/claude', { method:'POST', signal, headers:{ 'content-type':'application/json', 'x-passcode':pass() }, body:JSON.stringify({ prompt, images:imgs }) }); }
    catch (e) { throw { code:e && e.name === 'AbortError' ? 'cancelled' : 'network' }; }
    if (r.status === 401) { serverNeedsPass = true; throw { code:'bad_passcode' }; }
    if (r.status === 404 || r.status === 405) throw { code:'no_function' };
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw { code:data.error || 'upstream', message:data.message };
    return parse(data.text || '');
  }
  // hỏi hàm trên Netlify: có đặt APP_PASSCODE không (null = chưa biết)
  let serverNeedsPass = null;
  if (onWeb()) fetch('/api/claude').then(r => r.ok ? r.json() : null).then(d => {
    serverNeedsPass = d ? !!d.needPass : true;
    document.querySelectorAll('.pb-pass').forEach(el => { el.hidden = !(serverNeedsPass && !pass()); });
  }).catch(() => { serverNeedsPass = true; });
  const needsPass = () => onWeb() && serverNeedsPass === true && !pass();
  return { ask, inClaude, onWeb, available:() => inClaude() || onWeb(), pass, setPass, needsPass, auto:() => onWeb() && !needsPass() };
})();
window.__AI = AI;

/* ---------- Khung dưới mỗi ô câu hỏi: nhặt từ ảnh + soạn thêm câu tương tự ---------- */
const Photo = (() => {
  // textarea id -> whether that game writes a point level first ("3 | câu | đáp án")
  const TARGETS = { 'qtext':false, 'b-qtext':false, 'd-qtext':false, 'h-qtext':false, 'p-qtext':true, 't-qtext':false, 'm-qtext':false, 'k-qtext':false, 'c-qtext':false };
  const files = {}, undoText = {}, ctl = {};
  const val = (id, d) => { const el = document.getElementById(id); const n = el ? parseInt(el.value, 10) : NaN; return Number.isFinite(n) && n > 0 ? n : d; };
  const filled = sel => [...document.querySelectorAll(sel)].filter(x => x.value.trim()).length;
  const nonEmpty = id => { const el = document.getElementById(id); return el ? el.value.split('\n').filter(l => l.trim() && !isPassageLine(l)).length : 0; };
  // rough number of questions each game uses, so the teacher knows how many to prepare
  function needFor(id){
    switch (id) {
      case 'qtext': return val('rounds', 3) * val('turns', 5);
      case 'b-qtext': return Math.ceil(val('b-turns', 15) * 1.3);
      case 'd-qtext': return val('d-rounds', 3) * Math.max(1, filled('[data-dname]')) * val('d-qper', 1);
      case 'h-qtext': return Math.max(1, filled('[data-hname]')) * 10;
      case 'p-qtext': return val('p-turns', 10);
      case 't-qtext': return 25;
      case 'm-qtext': return 15;
      case 'k-qtext': return 15;
      case 'c-qtext': return Math.max(1, filled('[data-cname]')) * (nonEmpty('c-steps') + 3);
    }
    return 10;
  }
  const PROMPT = withLevel => `You are helping a Vietnamese English teacher turn printed material into questions for a classroom quiz game.
The attached image is a photo or screenshot of a textbook page, worksheet or exam paper.

Extract every item that can be asked to students as a question. For each item give:
- "q": the question as written, in the original language. Put multiple-choice options inline, e.g. "She ___ to school. (A. go  B. goes  C. going)". If an item needs a short sentence of context from the page, include it. Skip items that cannot work without a picture or a long reading passage.
- "a": the correct answer, short. Use the answer key if one is visible; otherwise work out the correct answer yourself. For multiple choice give the letter and the word, e.g. "B. goes".
${withLevel ? '- "level": 1 for easy, 3 for medium, 5 for hard.\n' : ''}
- "p": only if the item belongs to a reading passage or a cloze text (gap-fill paragraph): the FULL passage text, copied exactly, with "\n" between paragraphs and blanks kept as "(47) ____". Give the same "p" on every item of that passage. Omit "p" for standalone items.
For a cloze text, each numbered blank is one item: "q" is "Question 47" (plus its options), "a" is the correct option.
Skip titles, section headings and instruction lines that are not questions themselves. Never invent items that are not in the image.
Reply with only a JSON array, for example [{"q":"Plural of \\"child\\"?","a":"children"${withLevel ? ',"level":1' : ''}}]. Reply [] if there are no questions.`;

  function boxHTML(id){
    return `<div class="photobox" id="pb-${id}" data-target="${id}">
      <div class="pb-pass" ${AI.needsPass() ? '' : 'hidden'}>
        <label>Mã dùng AI (cô tự đặt trên Netlify)<input type="password" class="pb-pin" autocomplete="off"></label>
        <button type="button" class="ghost pb-pinsave">Lưu mã</button>
      </div>
      <div class="pb-drop" tabindex="0" aria-label="Khung dán ảnh">
        <span class="pb-ico" aria-hidden="true">📷</span>
        <span><b>Nhặt câu hỏi từ ảnh</b><br><span class="pb-hint">Dán ảnh chụp trang sách hoặc đề thi (Ctrl+V), kéo thả vào đây, hoặc <label class="pb-pick">chọn ảnh<input type="file" accept="image/*" multiple hidden></label></span></span>
      </div>
      <div class="pb-thumbs"></div>
      <div class="pb-actions">
        <button type="button" class="btn btn-gold pb-go" hidden>Nhặt câu hỏi</button>
        <button type="button" class="ghost pb-stop" hidden>Dừng</button>
        <button type="button" class="ghost pb-undo" hidden>↶ Bỏ các câu vừa thêm</button>
      </div>
      <div class="pb-gen">
        <span class="pb-need"></span>
        <span class="pb-genrow"><label>Số câu<input type="number" class="pb-n" min="1" max="60" value="10"></label>
        <button type="button" class="ghost pb-gengo">✨ AI soạn thêm câu tương tự</button></span>
      </div>
      <p class="note pb-msg" role="status"></p>
    </div>`;
  }
  const $ = (id, sel) => document.querySelector(`#pb-${CSS.escape(id)} ${sel}`);
  const msg = (id, t) => { const m = $(id, '.pb-msg'); if (m) m.textContent = t; };
  const errText = e => (e && e.code === 'upstream' && e.message) ? `${AIERR.upstream} (${e.message})` : (AIERR[e && e.code] || 'Có lỗi với AI. Thử lại nha.');

  function refreshNeed(id){
    const box = document.getElementById('pb-' + id); if (!box) return;
    const need = needFor(id), have = nonEmpty(id), gap = need - have;
    box.querySelector('.pb-need').innerHTML = gap > 0
      ? `Trò này dùng khoảng <b>${need}</b> câu, đang có <b>${have}</b>. Thiếu ${gap} câu sẽ bị hỏi lặp.`
      : `Trò này dùng khoảng <b>${need}</b> câu, đang có <b>${have}</b>. Đủ rồi 👍`;
    const n = box.querySelector('.pb-n');
    if (!n.dataset.touched) n.value = gap > 0 ? Math.min(60, gap) : 10;
  }
  function add(id, list){
    const imgs = [...list].filter(f => f && f.type && f.type.startsWith('image/'));
    if (!imgs.length) { msg(id, 'Chỉ nhận file ảnh (jpg, png…).'); return; }
    files[id] = (files[id] || []).concat(imgs); msg(id, ''); paint(id);
  }
  function paint(id){
    const box = document.getElementById('pb-' + id); if (!box) return;
    const th = box.querySelector('.pb-thumbs'), list = files[id] || [];
    th.innerHTML = '';
    list.forEach((f, i) => {
      const wrap = document.createElement('div'); wrap.className = 'pb-th';
      const img = document.createElement('img'); img.alt = `Ảnh ${i + 1}`;
      const rd = new FileReader(); rd.onload = () => { img.src = rd.result; }; rd.readAsDataURL(f);
      const x = document.createElement('button'); x.type = 'button'; x.className = 'pb-x'; x.textContent = '×';
      x.setAttribute('aria-label', `Bỏ ảnh ${i + 1}`);
      x.onclick = () => { files[id].splice(i, 1); paint(id); };
      wrap.append(img, x); th.append(wrap);
    });
    const go = box.querySelector('.pb-go'); go.hidden = !list.length; go.textContent = `Nhặt câu hỏi từ ${list.length} ảnh`;
  }
  function append(id, items, withLevel){
    const ta = document.getElementById(id); if (!ta) return 0;
    const have = new Set(ta.value.split('\n').map(l => l.split('|')[withLevel ? 1 : 0]).map(x => (x || '').trim().toLowerCase()).filter(Boolean));
    const keep = [];
    items.forEach(it => {
      const q = cleanQ(it && it.q); if (!q || (!it.p && have.has(q.toLowerCase()))) return; have.add(q.toLowerCase());
      keep.push({ q, a:cleanQ(it.a), p:it.p || '', lv:[1, 3, 5].includes(+it.level) ? +it.level : 1 });
    });
    const lines = keep.length ? withPassages(keep, it => (withLevel ? it.lv + ' | ' : '') + it.q + ' | ' + it.a) : [];
    if (!lines.length) return 0;
    undoText[id] = ta.value;
    const prev = ta.value.trim();
    ta.value = (prev ? prev + '\n' : '') + lines.join('\n');
    ta.scrollTop = ta.scrollHeight;
    $(id, '.pb-undo').hidden = false;
    refreshNeed(id);
    return lines.length;
  }
  function busy(id, on){ $(id, '.pb-go').disabled = on; $(id, '.pb-gengo').disabled = on; $(id, '.pb-stop').hidden = !on; }

  async function go(id){
    const list = files[id] || []; if (!list.length) return;
    if (AI.needsPass()) { msg(id, 'Nhập mã dùng AI rồi bấm Lưu mã trước nha.'); return; }
    busy(id, true);
    const withLevel = TARGETS[id], found = [];
    try {
      for (let k = 0; k < list.length; k++) {
        msg(id, `AI đang đọc ảnh ${list.length > 1 ? `${k + 1}/${list.length}` : ''}… (khoảng nửa phút)`);
        ctl[id] = new AbortController();
        const arr = await AI.ask(PROMPT(withLevel), [list[k]], ctl[id].signal);
        if (Array.isArray(arr)) found.push(...arr);
      }
    } catch (e) {
      busy(id, false);
      if (e && e.code === 'bad_passcode') { AI.setPass(''); $(id, '.pb-pass').hidden = false; }
      if (!found.length) { msg(id, e && e.code === 'cancelled' ? 'Đã dừng.' : errText(e)); return; }
    }
    busy(id, false);
    const n = append(id, found, withLevel);
    if (!n) { msg(id, 'Không tìm thấy câu hỏi mới nào trong ảnh. Thử ảnh rõ hơn nha.'); return; }
    files[id] = []; paint(id);
    msg(id, `Đã thêm ${n} câu vào cuối danh sách. Đáp án nào sách không ghi thì AI tự giải, cô xem lại trước khi chơi nha.`);
    SFX.coin();
  }
  async function gen(id){
    const ta = document.getElementById(id); if (!ta) return;
    const withLevel = TARGETS[id];
    const lines = ta.value.split('\n').map(l => l.trim()).filter(l => l && !isPassageLine(l));
    if (lines.length < 2) { msg(id, 'Cần ít nhất 2 câu mẫu để AI bắt chước. Dán vài câu hoặc nhặt từ ảnh trước nha.'); return; }
    if (AI.needsPass()) { msg(id, 'Nhập mã dùng AI rồi bấm Lưu mã trước nha.'); return; }
    let want = Math.max(1, Math.min(60, parseInt($(id, '.pb-n').value, 10) || 10));
    busy(id, true);
    const made = [];
    try {
      while (made.length < want) {
        const chunk = Math.min(15, want - made.length);
        msg(id, `AI đang soạn ${made.length + 1}–${made.length + chunk} / ${want} câu…`);
        ctl[id] = new AbortController();
        const sampleLines = lines.slice(-40).concat(made.map(it => (withLevel ? (it.level || 1) + ' | ' : '') + cleanQ(it.q) + ' | ' + cleanQ(it.a)));
        const arr = await AI.ask(GEN_PROMPT(sampleLines, chunk, withLevel), [], ctl[id].signal);
        if (!Array.isArray(arr) || !arr.length) break;
        made.push(...arr.slice(0, chunk));
      }
    } catch (e) {
      busy(id, false);
      if (e && e.code === 'bad_passcode') { AI.setPass(''); $(id, '.pb-pass').hidden = false; }
      if (!made.length) { msg(id, e && e.code === 'cancelled' ? 'Đã dừng.' : errText(e)); return; }
    }
    busy(id, false);
    const n = append(id, made, withLevel);
    msg(id, n ? `AI đã soạn thêm ${n} câu tương tự. Cô đọc lướt lại trước khi chơi nha.` : 'AI chưa soạn được câu mới. Thử lại nha.');
    if (n) SFX.coin();
  }

  function wire(id){
    const box = document.getElementById('pb-' + id), drop = box.querySelector('.pb-drop');
    box.querySelector('input[type=file]').addEventListener('change', e => { add(id, e.target.files); e.target.value = ''; });
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); add(id, e.dataTransfer.files); });
    box.querySelector('.pb-go').addEventListener('click', () => go(id));
    box.querySelector('.pb-gengo').addEventListener('click', () => gen(id));
    box.querySelector('.pb-stop').addEventListener('click', () => ctl[id] && ctl[id].abort());
    box.querySelector('.pb-n').addEventListener('input', e => { e.target.dataset.touched = '1'; });
    box.querySelector('.pb-pinsave').addEventListener('click', () => {
      const v = box.querySelector('.pb-pin').value.trim(); if (!v) return;
      AI.setPass(v); document.querySelectorAll('.pb-pass').forEach(p => { p.hidden = true; });
      msg(id, 'Đã lưu mã dùng AI trên máy này.');
    });
    box.querySelector('.pb-undo').addEventListener('click', () => {
      const ta = document.getElementById(id);
      if (ta && undoText[id] !== undefined) { ta.value = undoText[id]; delete undoText[id]; }
      box.querySelector('.pb-undo').hidden = true; msg(id, 'Đã bỏ các câu vừa thêm.'); refreshNeed(id);
    });
    paint(id); refreshNeed(id);
  }
  function attach(){
    if (!AI.available()) return; // e.g. opened as a local file: no AI to talk to
    Object.keys(TARGETS).forEach(id => {
      const ta = document.getElementById(id);
      if (!ta || document.getElementById('pb-' + id)) return;
      (ta.closest('label') || ta).insertAdjacentHTML('afterend', boxHTML(id));
      wire(id);
    });
  }
  new MutationObserver(attach).observe(document.body, { childList:true, subtree:true });
  attach();
  // keep the "cần khoảng N câu" line current while the teacher edits the setup
  document.addEventListener('input', () => Object.keys(TARGETS).forEach(refreshNeed));
  document.addEventListener('paste', e => {
    const list = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
    if (!list.length) return;
    const box = [...document.querySelectorAll('.photobox')].find(b => b.offsetParent !== null);
    if (!box) return;
    e.preventDefault(); add(box.dataset.target, list); box.scrollIntoView({ block:'nearest', behavior:'smooth' });
  });
  return { attach };
})();

/* ---------- Đang chơi mà sắp hết câu: AI bổ sung để khỏi hỏi lặp ---------- */
const Refill = (() => {
  const mods = () => ({ joker:A, banh:B, daugia:D, haitrinh:H, quyennang:P, bom:T, hopnhac:M, ducvua:K, bangchuyen:C });
  let working = false, toastT = null;
  const offered = {};
  function toast(html, keep){
    const el = document.getElementById('ai-toast'); if (!el) return;
    el.innerHTML = html || ''; el.hidden = !html;
    clearTimeout(toastT); if (html && !keep) toastT = setTimeout(() => { el.hidden = true; }, 7000);
  }
  async function run(g){
    const m = mods()[g]; if (!m || !m.qInfo || working) return;
    const info = m.qInfo(); if (!info.live) return;
    if (AI.needsPass()) { toast('Nhập mã dùng AI ở màn hình cài đặt để AI tự bổ sung câu hỏi.'); return; }
    working = true; toast('✨ AI đang soạn thêm câu hỏi mới…', true);
    const withLevel = g === 'quyennang';
    const lines = info.sample.map(q => (withLevel ? (q.lv || 1) + ' | ' : '') + q.q + ' | ' + q.a);
    try {
      const arr = await AI.ask(GEN_PROMPT(lines, 10, withLevel), []);
      const seen = new Set(info.all.map(q => String(q.q).toLowerCase()));
      const add = (Array.isArray(arr) ? arr : []).filter(it => it && cleanQ(it.q) && !seen.has(cleanQ(it.q).toLowerCase()))
        .map(it => withLevel ? { lv:[1, 3, 5].includes(+it.level) ? +it.level : 1, q:cleanQ(it.q), a:cleanQ(it.a) } : { q:cleanQ(it.q), a:cleanQ(it.a) });
      if (add.length) { m.addQs(add); toast(`✨ AI vừa bổ sung ${add.length} câu mới, không lo hỏi lặp.`); }
      else toast('AI chưa soạn được câu mới.');
    } catch (e) { toast(`Chưa bổ sung được: ${AIERR[e && e.code] || 'có lỗi với AI'}`); }
    working = false;
  }
  setInterval(() => {
    if (!AI.available() || working) return;
    const g = document.documentElement.dataset.game, m = mods()[g];
    if (!m || !m.qInfo) return;
    const info = m.qInfo();
    if (!info.live || info.left > 2) return;
    const key = g + ':' + info.all.length; if (offered[key]) return; offered[key] = true;
    if (AI.auto()) run(g); // trên Netlify đã có mã: tự bổ sung
    else if (AI.inClaude()) toast(`Sắp hết câu hỏi (còn ${Math.max(0, info.left)} câu chưa hỏi). <button class="ghost" onclick="Refill.run('${g}')">✨ Để AI soạn thêm 10 câu</button>`, true);
    else if (AI.needsPass()) toast('Sắp hết câu hỏi. Nhập mã dùng AI ở màn hình cài đặt để AI tự bổ sung.');
  }, 2000);
  return { run, toast };
})();

/* ================= Đoạn văn / bài đọc đi kèm câu hỏi =================
   Trong ô câu hỏi, một dòng bắt đầu bằng ">>" là đoạn văn; các câu bên dưới đều kèm đoạn văn đó
   cho tới dòng ">>" tiếp theo (dòng ">>" trống = hết đoạn văn). Xuống đoạn ghi bằng " ¶ ". */
function encP(p){ return String(p || '').replace(/\r/g, '').split(/\n+/).map(x => x.trim()).filter(Boolean).join(' ¶ ').replace(/\|/g, '/'); }
function decP(p){ return String(p || '').split(' ¶ ').join('\n'); }
function parseQLines(text, withLevel){
  let p = ''; const out = [];
  String(text || '').split('\n').forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l.startsWith('>>')) { p = l.slice(2).trim(); return; }
    const parts = l.split('|').map(x => x.trim());
    let lv = null;
    if (withLevel && ['1', '3', '5'].includes(parts[0]) && parts.length > 1) lv = +parts.shift();
    const q = { q:parts[0], a:parts.slice(1).join(' | ') };
    if (withLevel) q.lv = lv;
    if (p) q.p = p;
    out.push(q);
  });
  return out;
}
// lines for the question box, adding ">>" markers whenever the passage changes
function withPassages(items, toLine){
  const out = []; let cur = '';
  items.forEach(it => {
    const p = encP(it.p || '');
    if (p !== cur) { out.push(p ? '>> ' + p : '>>'); cur = p; }
    out.push(toLine(it));
  });
  if (cur) out.push('>>');
  return out;
}
function isPassageLine(l){ return /^\s*>>/.test(l); }
// the passage shown above the question, with the blank being asked highlighted
function passageHTML(q){
  if (!q || !q.p) return '';
  const mc = mcParse(q.q), m = /(\d{1,3})/.exec(mc ? mc.stem : q.q);
  let html = q.p.split(' ¶ ').map(par => `<p>${esc(par)}</p>`).join('');
  if (m) html = html.replace(new RegExp(`\\(${m[1]}\\)\\s*[_…\\.]*`, 'g'), x => `<mark>${x}</mark>`);
  return `<div class="passage" aria-label="Đoạn văn">${html}</div>`;
}
// keep the highlighted blank in view inside a long passage
new MutationObserver(() => {
  document.querySelectorAll('.passage').forEach(box => {
    const mk = box.querySelector('mark');
    if (mk && !box.dataset.scrolled) { box.dataset.scrolled = '1'; box.scrollTop = Math.max(0, mk.offsetTop - box.offsetTop - box.clientHeight / 3); }
  });
}).observe(document.body, { childList:true, subtree:true });

/* ================= Trắc nghiệm A/B/C/D =================
   Câu lưu dạng: "Câu hỏi (A. ...  B. ...  C. ...  D. ...) | B. đáp án".
   Khi chiếu, phần lựa chọn được tách thành các ô bấm được. */
var MCPICK = null; // lựa chọn học sinh vừa nói, để giữ khi màn hình vẽ lại

// tìm dãy "A. … B. … C. …" liên tiếp trong một đoạn chữ; first = chữ cái phải bắt đầu (null = bất kì)
function mcSplit(text, first){
  const re = /(^|[\s(\[;\/,])\*?([A-Fa-f])\s*[\.\):]\s+/g;
  const hits = []; let m, want = first ? first.charCodeAt(0) : null, lower = null;
  while ((m = re.exec(text))) {
    const ch = m[2], up = ch.toUpperCase().charCodeAt(0), isLow = ch !== ch.toUpperCase();
    if (want === null) { want = up; lower = isLow; }
    if (up === want && (lower === null || lower === isLow)) {
      if (lower === null) lower = isLow;
      hits.push({ L:String.fromCharCode(up), at:m.index + m[1].length, start:m.index + m[0].length, star:/\*/.test(m[0]) });
      want++;
    }
  }
  if (hits.length < 2) return null;
  const opts = hits.map((h, i) => {
    let t = text.slice(h.start, i + 1 < hits.length ? hits[i + 1].at : text.length).trim();
    if (i === hits.length - 1) t = t.replace(/[\)\]]\s*[\.?!]?\s*$/, '');
    t = t.replace(/[;\/,]\s*$/, '').trim();
    return { L:h.L, t, star:h.star };
  });
  return { stem:text.slice(0, hits[0].at).trim().replace(/[\(\[]\s*$/, '').trim(), opts };
}
function mcParse(text){ const r = mcSplit(String(text || ''), 'A'); return r && r.opts.every(o => o.t) ? r : null; }
function mcKey(a, opts){
  a = String(a || '').trim();
  const m = /^\(?([A-Fa-f])(?:[\.\):\s]|$)/.exec(a);
  if (m && opts.some(o => o.L === m[1].toUpperCase())) return m[1].toUpperCase();
  const hit = opts.find(o => o.t.toLowerCase() === a.toLowerCase());
  return hit ? hit.L : '';
}
// what every game's question card shows
function qHTML(q, show){ return passageHTML(q) + qHTMLcore(q, show); }
function qHTMLcore(q, show){
  const mc = mcParse(q && q.q);
  if (!mc) return `<p class="qtext">${esc(q.q)}</p>`;
  const key = mcKey(q.a, mc.opts), picked = MCPICK && MCPICK.q === q.q ? MCPICK.L : '';
  return `<p class="qtext">${esc(mc.stem)}</p>
    <div class="mc" data-key="${key}" data-q="${esc(q.q)}">${mc.opts.map(o => {
      const cls = [o.L === picked ? 'picked' : '', show && o.L === key ? 'right' : '', show && o.L === picked && o.L !== key ? 'wrong' : ''].join(' ');
      return `<button type="button" class="mc-opt ${cls}" data-l="${o.L}" onclick="mcPick(this)"><b>${o.L}</b><span>${esc(o.t)}</span></button>`;
    }).join('')}</div>`;
}
/* ---------- Ô dán câu trắc nghiệm dưới mỗi ô câu hỏi ---------- */
const MCImport = (() => {
  const TARGETS = { 'qtext':false, 'b-qtext':false, 'd-qtext':false, 'h-qtext':false, 'p-qtext':true, 't-qtext':false, 'm-qtext':false, 'k-qtext':false, 'c-qtext':false };
  const parsed = {}, level = {};
  const EXAMPLE = `1. She ___ to school every day.
A. go
B. goes
C. going
D. gone
Answer: B

2. What is the past form of "teach"?  A. teached  B. taught  C. teach  D. teaching

Đáp án: 2B`;

  function parse(raw){
    let text = String(raw || '').replace(/\r/g, '').replace(/ /g, ' ');
    const keyMap = {};
    // bảng đáp án gom ở cuối: "Đáp án: 1B 2C 3-A, 4.D" hoặc mỗi dòng "1. B"
    text = text.replace(/^[ \t]*(?:đáp án|dap an|answer key|answers?|key|đa)[ \t]*[:：]?[ \t]*((?:\d+[ \t]*[\.\-:)]?[ \t]*[A-Fa-f]\b[ \t,;]*){1,})$/gim, (m, body) => {
      body.replace(/(\d+)\s*[\.\-:)]?\s*([A-Fa-f])\b/g, (x, n, l) => { keyMap[+n] = l.toUpperCase(); }); return '';
    });
    const startRe = /^\s*(?:câu|cau|question|q)?\s*(\d+)\s*(?:[\.\):]\s*(.*))?$/i;
    const optRe = /^\s*\*?\s*([A-Fa-f])\s*[\.\):]\s+\S/;
    const ansRe = /^\s*(?:answer|ans|đáp án|dap an|key|đa)\s*[:：\-]?\s*\(?([A-Fa-f])\b/i;
    const rangeRe = /^\s*(?:questions?|câu)\s*(\d+)\s*[-–—]\s*(\d+)\s*[:.]?\s*$/i;
    const HEAD = [rangeRe, /^\s*(đoạn văn|bài đọc|passage|reading( passage| text)?|text)\s*[:.]?\s*$/i,
      /^\s*(read|đọc|choose|chọn|mark)\b.*(passage|đoạn văn|bài đọc|A, B, C|correct answer|đáp án đúng|blank)/i];
    const isHead = l => l.split(/\s+/).length < 40 && HEAD.some(r => r.test(l));
    let passage = '', range = null, buf = [], cur = null;
    const blocks = [];
    const close = () => { if (cur) blocks.push(cur); cur = null; };
    const flushBuf = () => {
      if (!buf.length) return;
      const r = buf.map(l => rangeRe.exec(l)).find(Boolean);
      const body = buf.filter(l => !isHead(l));
      if (body.length) { passage = body.join('\n'); range = r ? [+r[1], +r[2]] : null; }
      else if (r) range = [+r[1], +r[2]];
      buf = [];
    };
    const takeInline = b => { const r = mcSplit(b.stem, 'A'); if (r) { b.stem = r.stem; b.opts.push(...r.opts); } };
    const newQ = (n, stem) => {
      const keep = passage && (!range || n == null || (n >= range[0] && n <= range[1]));
      return { n, stem, opts:[], ans:null, p:keep ? passage : '' };
    };
    for (const ln of text.split('\n')) {
      const t = ln.trim();
      if (!t) { if (cur && cur.opts.length) close(); continue; }
      let m;
      if (cur && (m = ansRe.exec(ln))) { cur.ans = m[1].toUpperCase(); continue; }
      if (!optRe.test(ln) && (m = startRe.exec(ln))) { close(); flushBuf(); cur = newQ(+m[1], (m[2] || '').trim()); takeInline(cur); continue; }
      if (optRe.test(ln)) {
        if (!cur) { const stem = buf.pop() || ''; flushBuf(); cur = newQ(null, stem); }
        const next = cur.opts.length ? String.fromCharCode(cur.opts[cur.opts.length - 1].L.charCodeAt(0) + 1) : null;
        const r = mcSplit(ln, next);
        if (r) cur.opts.push(...r.opts); else { const one = /^\s*(\*?)\s*([A-Fa-f])\s*[\.\):]\s+(.*)$/.exec(ln); cur.opts.push({ L:one[2].toUpperCase(), t:one[3].trim(), star:!!one[1] }); }
        continue;
      }
      if (cur && !cur.opts.length && !isHead(t)) { cur.stem += (cur.stem ? ' ' : '') + t; takeInline(cur); continue; }
      if (cur && cur.opts.length && t.split(/\s+/).length <= 8 && !isHead(t)) { cur.opts[cur.opts.length - 1].t += ' ' + t; continue; }
      close(); buf.push(t);
    }
    close();
    return blocks.filter(b => b.opts.length >= 2 && (b.stem || b.p)).map(b => {
      const mark = /\s*(\(\s*(đúng|dung|correct)\s*\)|[✓✔]|\*)\s*$/i;
      b.opts.forEach(o => { if (mark.test(o.t)) { o.star = true; o.t = o.t.replace(mark, ''); } o.t = o.t.replace(/^\*\s*/, '').trim(); });
      const starred = b.opts.find(o => o.star);
      const L = b.ans || (starred && starred.L) || (b.n != null ? keyMap[b.n] : null) || '';
      const stem = b.stem || `Câu ${b.n != null ? b.n : ''}`.trim();
      return { stem:cleanQ(stem), opts:b.opts.map(o => ({ L:o.L, t:cleanQ(o.t) })), ans:L, p:b.p };
    });
  }
  const lineOf = (it, withLevel, lv) => {
    const o = it.opts.find(x => x.L === it.ans);
    return (withLevel && lv ? lv + ' | ' : '') + `${it.stem} (${it.opts.map(x => `${x.L}. ${x.t}`).join('  ')}) | ${o ? `${o.L}. ${o.t}` : ''}`;
  };

  function boxHTML(id){
    return `<div class="mcimp" id="mi-${id}">
      <button type="button" class="ghost mi-open">📋 Dán câu trắc nghiệm A/B/C/D</button>
      <div class="mi-panel" hidden>
        <label>Dán nguyên văn từ Word, Google Docs, đề thi… Mỗi câu có các lựa chọn A, B, C, D. Đáp án ghi kiểu “Answer: B”, đánh dấu * cạnh lựa chọn đúng, hoặc gom cuối bài “Đáp án: 1B 2C 3A”.
          <textarea class="mi-src" spellcheck="false" style="min-height:170px" placeholder="${esc(EXAMPLE)}"></textarea></label>
        ${TARGETS[id] ? `<div class="row mi-lv" style="justify-content:flex-start"><span class="note">Mức điểm cho các câu này:</span>${[[0, '✨ AI tự chấm'], [1, '1đ'], [3, '3đ'], [5, '5đ']].map(([v, l]) => `<button type="button" class="chip mi-lvb ${v === 0 ? 'sel' : ''}" data-v="${v}">${l}</button>`).join('')}</div>` : ''}
        <div class="mi-prev"></div>
        <div class="row" style="justify-content:flex-start">
          <button type="button" class="btn btn-gold mi-add" disabled>Thêm vào danh sách</button>
          <button type="button" class="ghost mi-ai" hidden>✨ AI giải các câu thiếu đáp án</button>
          <button type="button" class="ghost mi-close">Đóng</button>
        </div>
        <p class="note mi-msg" role="status"></p>
      </div>
    </div>`;
  }
  function preview(id){
    const box = document.getElementById('mi-' + id), list = parsed[id] || [];
    const missing = list.filter(x => !x.ans).length;
    box.querySelector('.mi-prev').innerHTML = list.length ? `<p class="note">Nhận được <b>${list.length}</b> câu${missing ? `, <b class="neg">${missing}</b> câu chưa có đáp án` : ', đủ đáp án 👍'}.${list.some(x => x.p) ? ` <b>${list.filter(x => x.p).length}</b> câu có kèm đoạn văn 📄.` : ''}</p>
      <ol class="mi-list">${list.slice(0, 6).map(it => `<li><span>${it.p ? '📄 ' : ''}${esc(it.stem)}</span><span class="mi-opts">${it.opts.map(o => `<i class="${o.L === it.ans ? 'ok' : ''}">${o.L}. ${esc(o.t)}</i>`).join('')}</span></li>`).join('')}${list.length > 6 ? `<li class="note">… và ${list.length - 6} câu nữa</li>` : ''}</ol>`
      : `<p class="note">Chưa nhận được câu nào. Mỗi câu cần ít nhất 2 lựa chọn A, B.</p>`;
    box.querySelector('.mi-add').disabled = !list.length;
    box.querySelector('.mi-ai').hidden = !(missing && typeof AI !== 'undefined' && AI.available());
  }
  async function solve(id){
    const box = document.getElementById('mi-' + id), list = parsed[id] || [];
    const miss = list.map((it, i) => ({ it, i })).filter(x => !x.it.ans);
    if (!miss.length) return;
    if (AI.needsPass()) { box.querySelector('.mi-msg').textContent = 'Nhập mã dùng AI ở khung đọc ảnh bên dưới trước nha.'; return; }
    const btn = box.querySelector('.mi-ai'); btn.disabled = true;
    box.querySelector('.mi-msg').textContent = `AI đang giải ${miss.length} câu…`;
    const prompt = `Choose the correct option for each multiple-choice question below (English-learning exercises for Vietnamese students).
${miss.map(x => `${x.it.p ? `Passage for #${x.i}:\n${x.it.p}\n` : ''}#${x.i}: ${x.it.stem}\n${x.it.opts.map(o => `${o.L}. ${o.t}`).join('\n')}`).join('\n\n')}

Reply with only a JSON array like [{"i":0,"a":"B"}], one object per question, using the # numbers above.`;
    try {
      const arr = await AI.ask(prompt, []);
      let n = 0;
      (Array.isArray(arr) ? arr : []).forEach(r => { const it = list[+r.i]; const L = String(r.a || '').trim().toUpperCase().charAt(0); if (it && !it.ans && it.opts.some(o => o.L === L)) { it.ans = L; n++; } });
      box.querySelector('.mi-msg').textContent = n ? `AI đã điền ${n} đáp án (tô xanh). Cô xem lại trước khi thêm nha.` : 'AI chưa giải được câu nào.';
    } catch (e) { box.querySelector('.mi-msg').textContent = (typeof AIERR !== 'undefined' && AIERR[e && e.code]) || 'Có lỗi với AI.'; }
    btn.disabled = false; preview(id);
  }
  function wire(id){
    const box = document.getElementById('mi-' + id), panel = box.querySelector('.mi-panel'), src = box.querySelector('.mi-src');
    level[id] = 0;
    box.querySelector('.mi-open').addEventListener('click', () => { panel.hidden = !panel.hidden; if (!panel.hidden) { src.focus(); preview(id); } });
    box.querySelector('.mi-close').addEventListener('click', () => { panel.hidden = true; });
    src.addEventListener('input', () => { parsed[id] = parse(src.value); box.querySelector('.mi-msg').textContent = ''; preview(id); });
    box.querySelectorAll('.mi-lvb').forEach(b => b.addEventListener('click', () => {
      level[id] = +b.dataset.v; box.querySelectorAll('.mi-lvb').forEach(x => x.classList.toggle('sel', x === b));
    }));
    box.querySelector('.mi-ai').addEventListener('click', () => solve(id));
    box.querySelector('.mi-add').addEventListener('click', () => {
      const list = parsed[id] || []; if (!list.length) return;
      const ta = document.getElementById(id); if (!ta) return;
      const prev = ta.value.trim();
      ta.value = (prev ? prev + '\n' : '') + withPassages(list, it => lineOf(it, TARGETS[id], level[id])).join('\n');
      ta.scrollTop = ta.scrollHeight;
      ta.dispatchEvent(new Event('input', { bubbles:true }));
      const miss = list.filter(x => !x.ans).length;
      box.querySelector('.mi-msg').textContent = `Đã thêm ${list.length} câu trắc nghiệm vào danh sách${miss ? `, ${miss} câu chưa có đáp án (cô điền sau dấu | nha)` : ''}.`;
      src.value = ''; parsed[id] = []; preview(id); SFX.coin();
      if (TARGETS[id] && !level[id] && typeof P !== 'undefined') P.classify();
    });
  }
  function attach(){
    Object.keys(TARGETS).forEach(id => {
      const ta = document.getElementById(id);
      if (!ta || document.getElementById('mi-' + id)) return;
      (ta.closest('label') || ta).insertAdjacentHTML('afterend', boxHTML(id));
      wire(id);
    });
  }
  new MutationObserver(attach).observe(document.body, { childList:true, subtree:true });
  attach();
  return { parse };
})();
/* ================= Chấm tự động & AI giải đáp án ================= */
var QREF = QREF || {};             // câu đang chiếu: chữ câu hỏi -> đối tượng câu (để AI ghi đáp án vào)
function aiOK(){ return !!(window.__AI && window.__AI.available()); }
function nsObj(ns){ return ({ A, B, D, H, P, T, M, K, C })[ns]; }

// phần đáp án dưới mỗi câu hỏi, dùng chung cho mọi trò
function ansBlock(q, show, ns){
  QREF = QREF || {};
  QREF[q.q] = q;
  const qs = esc(q.q);
  if (q.a && show) return `<div class="ans">Đáp án: ${esc(q.a)}${q.byAI ? ' <span class="tag">AI giải</span>' : ''}</div>` +
    (q.why ? `<div class="ans-why">💡 ${esc(q.why)}</div>` : aiOK() ? `<button class="linkbtn" data-q="${qs}" data-ns="${ns}" onclick="AIAns.explain(this)">💡 Vì sao?</button>` : '');
  if (q.a) return `<button class="linkbtn" onclick="${ns}.showAns()">Hiện đáp án</button>`;
  return aiOK() ? `<button class="linkbtn" data-q="${qs}" data-ns="${ns}" onclick="AIAns.solve(this)">✨ Hiện đáp án (AI giải)</button>` : '';
}

const AIAns = (() => {
  const busy = {};
  async function fill(q){
    if (q.a) return q;
    if (busy[q.q]) return busy[q.q];
    const mc = mcParse(q.q);
    const prompt = `You help a Vietnamese English teacher during a classroom quiz. Answer this question for her students.
${q.p ? `Passage (the question refers to it; a number like (47) marks a blank):\n${decP(q.p)}\n` : ''}Question: ${mc ? mc.stem : q.q}
${mc ? 'Options:\n' + mc.opts.map(o => `${o.L}. ${o.t}`).join('\n') + '\n' : ''}
Reply with only JSON: {"answer":"${mc ? 'the letter and option text, e.g. B. goes' : 'the short correct answer'}","why":"one short sentence in Vietnamese explaining why this is correct"}`;
    busy[q.q] = window.__AI.ask(prompt, []).then(r => {
      const ans = cleanQ(r && r.answer);
      if (!ans) throw { code:'empty_completion' };
      q.a = ans; q.why = cleanQ(r.why); q.byAI = true; return q;
    }).finally(() => { delete busy[q.q]; });
    return busy[q.q];
  }
  async function solve(btn){
    const q = QREF[btn.dataset.q]; if (!q) return;
    btn.disabled = true; btn.textContent = '✨ AI đang giải…';
    try { await fill(q); SFX.flip(); const g = nsObj(btn.dataset.ns); g && g.showAns(); }
    catch (e) { btn.disabled = false; btn.textContent = `Chưa giải được: ${AIERR[e && e.code] || 'thử lại nha'}`; }
  }
  async function explain(btn){
    const q = QREF[btn.dataset.q]; if (!q || !q.a) return;
    btn.disabled = true; btn.textContent = '💡 AI đang giải thích…';
    const mc = mcParse(q.q);
    const prompt = `${q.p ? `Passage:\n${decP(q.p)}\n\n` : ''}Explain in ONE short Vietnamese sentence why "${q.a}" is the correct answer to this English quiz question${mc ? ' (multiple choice)' : ''}: ${q.q}
Reply with only JSON: {"why":"..."}`;
    try { const r = await window.__AI.ask(prompt, []); q.why = cleanQ(r && r.why); const g = nsObj(btn.dataset.ns); g && g.showAns(); }
    catch (e) { btn.disabled = false; btn.textContent = `Chưa giải thích được: ${AIERR[e && e.code] || 'thử lại nha'}`; }
  }
  return { fill, solve, explain };
})();

// bấm ô học sinh chọn: chấm ngay, rồi tự bấm Đúng/Sai của trò sau 2 giây (huỷ được)
async function mcPick(btn){
  const box = btn.closest('.mc');
  if (!box || box.dataset.done || box.classList.contains('thinking')) return;
  const L = btn.dataset.l;
  MCPICK = { q:box.dataset.q, L };
  box.querySelectorAll('.mc-opt').forEach(b => b.classList.remove('picked', 'right', 'wrong'));
  btn.classList.add('picked');
  let key = box.dataset.key;
  const q = QREF[box.dataset.q];
  if (!key) {
    if (!q || !aiOK()) { SFX.click(); mcVerdict(box, null, 'Câu này chưa có đáp án. Cô bấm Đúng hoặc Sai giúp nha.'); return; }
    box.classList.add('thinking'); mcVerdict(box, null, '✨ AI đang chấm…'); SFX.click();
    try { await AIAns.fill(q); key = mcKey(q.a, mcParse(q.q).opts); box.dataset.key = key; }
    catch (e) { box.classList.remove('thinking'); mcVerdict(box, null, `AI chưa chấm được (${AIERR[e && e.code] || 'lỗi'}). Cô bấm Đúng hoặc Sai giúp nha.`); return; }
    box.classList.remove('thinking');
    if (!key) { mcVerdict(box, null, `AI trả lời: ${q.a}. Cô bấm Đúng hoặc Sai giúp nha.`); return; }
  }
  box.dataset.done = '1';
  const right = L === key, keyBtn = box.querySelector(`[data-l="${key}"]`);
  keyBtn.classList.add('right'); if (!right) btn.classList.add('wrong');
  right ? SFX.coin() : SFX.bonk();
  const keyText = keyBtn.querySelector('span').textContent;
  mcVerdict(box, right, (right ? '✅ ĐÚNG RỒI!' : `❌ SAI RỒI! Đáp án đúng: ${key}. ${keyText}`) + (q && q.why ? `<span class="mc-why">💡 ${esc(q.why)}</span>` : ''), true);
  box._t = setTimeout(() => mcAutoJudge(box, right), 2200);
}
function mcVerdict(box, right, html, withCancel){
  let v = box.nextElementSibling;
  if (!v || !v.classList.contains('mc-verdict')) { v = document.createElement('div'); v.className = 'mc-verdict'; box.after(v); }
  v.className = 'mc-verdict ' + (right === true ? 'ok' : right === false ? 'bad' : '');
  v.innerHTML = `<span>${html}</span>` + (withCancel ? `<span class="mc-auto">Tự ghi kết quả sau 2 giây… <button type="button" class="linkbtn" onclick="mcCancel(this)">Để cô tự bấm</button></span>` : '');
}
function mcCancel(link){
  const box = link.closest('.mc-verdict').previousElementSibling;
  if (box && box._t) { clearTimeout(box._t); box._t = null; }
  link.parentElement.textContent = 'Cô tự bấm Đúng hoặc Sai bên dưới nha.';
}
function mcAutoJudge(box, right){
  if (!document.body.contains(box)) return;
  const scope = box.closest('.stage') || document;
  const row = [...scope.querySelectorAll('.row')].find(r => r.querySelector('.btn-ok') && r.querySelector('.btn-no'));
  if (!row) return;
  MCPICK = null;
  (right ? row.querySelector('.btn-ok') : row.querySelector('.btn-no')).click();
}

/* ---------- Lá bài quyền năng: AI chia câu dễ / trung bình / khó ---------- */
const PLevel = (() => {
  const LV = /^\s*[135]\s*\|/;
  async function classify(ta){
    const lines = ta.value.split('\n'), idx = [];
    lines.forEach((l, i) => { if (l.trim() && !LV.test(l) && !isPassageLine(l)) idx.push(i); });
    if (!idx.length) return 0;
    let done = 0;
    for (let k = 0; k < idx.length; k += 40) {
      const part = idx.slice(k, k + 40);
      const prompt = `Rate the difficulty of each quiz question for Vietnamese secondary-school learners of English.
1 = easy: basic vocabulary, recall, very common patterns.
3 = medium: applying a grammar rule, common collocations, short transformations.
5 = hard: tricky distractors, less common vocabulary, multi-step reasoning or full-sentence rewriting.
Spread the levels honestly; do not rate everything the same.
Questions (format "question | answer"):
${part.map(i => `#${i}: ${lines[i].trim()}`).join('\n')}

Reply with only a JSON array like [{"i":${part[0]},"level":3}], one object per question, using the # numbers above.`;
      const arr = await window.__AI.ask(prompt, []);
      (Array.isArray(arr) ? arr : []).forEach(r => {
        const i = +r.i, lv = +r.level;
        if (part.includes(i) && [1, 3, 5].includes(lv) && !LV.test(lines[i])) { lines[i] = `${lv} | ${lines[i].trim()}`; done++; }
      });
    }
    ta.value = lines.join('\n');
    ta.dispatchEvent(new Event('input', { bubbles:true }));
    return done;
  }
  const unlevelled = ta => ta.value.split('\n').filter(l => l.trim() && !LV.test(l) && !isPassageLine(l)).length;
  return { classify, unlevelled };
})();
/* ================= Thêm / bớt nhóm ở màn hình cài đặt ================= */
const TeamCtl = (() => {
  // attribute on the name inputs -> [min, max] teams for that game
  const GROUPS = { 'data-name':[2, 12], 'data-bname':[2, 12], 'data-dname':[2, 12], 'data-hname':[2, 6], 'data-pname':[2, 12], 'data-tname':[2, 12], 'data-cname':[1, 8] };
  const labelsOf = attr => [...document.querySelectorAll(`input[${attr}]`)].map(i => i.closest('label')).filter(Boolean);
  function sync(attr){
    const ctl = document.querySelector(`.team-ctl[data-attr="${attr}"]`); if (!ctl) return;
    const n = labelsOf(attr).length, [min, max] = GROUPS[attr];
    ctl.querySelector('.tc-add').disabled = n >= max;
    ctl.querySelector('.tc-del').disabled = n <= min;
    ctl.querySelector('.tc-n').textContent = `${n} ô tên`;
  }
  function add(attr){
    const labs = labelsOf(attr), last = labs[labs.length - 1]; if (!last) return;
    if (labs.length >= GROUPS[attr][1]) return;
    const copy = last.cloneNode(true), inp = copy.querySelector('input');
    const k = labs.length + 1;
    // "Đội 5 (không bắt buộc)" -> "Đội 6"
    const first = copy.firstChild;
    if (first && first.nodeType === 3) first.textContent = first.textContent.replace(/\d+/, k).replace(/\s*\(không bắt buộc\)/, '');
    inp.id = inp.id.replace(/\d+$/, '') + (k - 1) + '-x' + Date.now().toString(36);
    copy.setAttribute('for', inp.id);
    inp.value = ''; inp.placeholder = 'Tên nhóm';
    last.after(copy);
    inp.focus(); sync(attr); SFX.click();
  }
  function del(attr){
    const labs = labelsOf(attr);
    if (labs.length <= GROUPS[attr][0]) return;
    labs[labs.length - 1].remove(); sync(attr); SFX.click();
  }
  function attach(){
    Object.keys(GROUPS).forEach(attr => {
      const labs = labelsOf(attr);
      if (!labs.length || document.querySelector(`.team-ctl[data-attr="${attr}"]`)) return;
      labs[labs.length - 1].insertAdjacentHTML('afterend', `<div class="team-ctl" data-attr="${attr}">
        <button type="button" class="ghost tc-add" onclick="TeamCtl.add('${attr}')">＋ Thêm nhóm</button>
        <button type="button" class="ghost tc-del" onclick="TeamCtl.del('${attr}')">－ Bớt nhóm</button>
        <span class="note tc-n"></span></div>`);
      sync(attr);
    });
    // keep the buttons right under the last name box after adding or removing
    Object.keys(GROUPS).forEach(attr => {
      const ctl = document.querySelector(`.team-ctl[data-attr="${attr}"]`), labs = labelsOf(attr);
      if (ctl && labs.length && labs[labs.length - 1].nextElementSibling !== ctl) labs[labs.length - 1].after(ctl);
    });
  }
  new MutationObserver(attach).observe(document.body, { childList:true, subtree:true });
  attach();
  return { add, del };
})();
</script>
